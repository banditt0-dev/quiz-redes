"], ["¿Por qué la dirección 2001:0DB8::ABCD::1234 es inválida?", "Porque :: aparece dos veces y la dirección se podría expandir de varias formas, siendo ambigua.", "Porque los hextetos deben ser todos de 4 dígitos, y ABCD deja el grupo sin completar.", "Porque ABCD no es un valor hexadecimal válido dentro de un hexteto de una dirección IPv6.", "Porque el prefijo 2001 está reservado y no puede combinarse con el prefijo de documentación DB8.", "La regla permite usar :: una sola vez por dirección."], ["¿Cuál es la forma comprimida de 2001:0DB8:0000:0000:ABCD:0000:0000:1234 que respeta la regla de ::?", "2001:DB8::ABCD:0:0:1234", "2001:DB8::ABCD::1234", "2001:DB8:0:0:ABCD::1234:", "2001:DB8::ABCD:1234", "Hay dos cadenas de ceros del mismo largo; solo una puede reemplazarse por ::, la otra queda con 0 sueltos."], ["Dos formas de abreviar un hexteto como 0A00 son:", "A00 (se omite el 0 inicial); nunca A (se cambiaría el valor).", "A (se omiten todos los ceros); también es válida y equivale al mismo valor.", "0A (se omiten los ceros finales); el valor del hexteto no cambia por eso.", "A0 (se omite un 0 final); es una forma equivalente de abreviar el hexteto.", "Solo se pueden omitir ceros iniciales; los finales son parte del valor."], ["¿Qué indica la longitud de prefijo /64 en una LAN IPv6?", "Que 64 bits son de red (prefijo) y 64 bits son de ID de interfaz.", "Que la máscara tiene 64 dígitos decimales, uno por cada bit de la dirección de red.", "Que hay 64 hosts en la red, cada uno con su propia ID de interfaz de 64 bits.", "Que la dirección tiene 64 bits en total, divididos entre el prefijo y la ID de interfaz.", "IPv6 no usa máscara decimal punteada; el prefijo va de 0 a 128."], ["¿Cuántas subredes /64 puede crear una organización con un prefijo /48?", "65.536 subredes, porque dispone de 16 bits de ID de subred.", "256 subredes, porque dispone de 8 bits de ID de subred.", "4096 subredes, porque dispone de 12 bits de ID de subred.", "1.048.576 subredes, porque dispone de 20 bits de ID de subred.", "48 + 16 = 64; 2¹⁶ = 65.536."], ["En la dirección global 2001:0DB8:ACAD:0001::1/64 con prefijo de enrutamiento /48, ¿cuál es el ID de subred?", "0001 (el cuarto hexteto).", "ACAD (el tercer hexteto).", "0DB8 (el segundo hexteto).", "0001::1 (los últimos hextetos).", "Los tres primeros hextetos son el prefijo de enrutamiento global; el cuarto es el ID de subred."], ["Una dirección IPv6 de origen de un paquete puede ser de tipo:", "Solo unicast.", "Unicast o multicast.", "Unicast, multicast o anycast.", "Solo anycast.", "Una multicast solo puede ser dirección de destino."], ["¿Qué es una dirección anycast?", "Una dirección unicast asignada a varios dispositivos; el paquete se enruta al más cercano que la tenga.", "Una dirección que llega a todos los dispositivos de un grupo suscripto, enrutada por el camino más corto.", "Una dirección asignada a una sola interfaz, que permite enviar un paquete a ese único dispositivo.", "Una dirección que reemplaza al loopback y permite que un host se envíe tráfico a sí mismo.", "No debe confundirse con multicast, donde el paquete llega a todos los miembros del grupo."], ["¿Qué reemplaza al broadcast en IPv6?", "La dirección multicast de todos los nodos, FF02::1.", "La dirección anycast FF02::2, que llega a todos los routers del enlace local.", "La dirección unicast ::1, que llega únicamente al dispositivo que la envía.", "La dirección sin especificar ::, que se usa como destino cuando no se conoce el receptor.", "IPv6 no tiene broadcast."], ["¿Qué rango identifica a las direcciones unicast globales?", "2000::/3 (el prefijo comienza con los bits 001).", "FE80::/10 (el prefijo comienza con los bits 1111 1110 10).", "FC00::/7 (el prefijo comienza con los bits 1111 110).", "FF00::/8 (el prefijo comienza con los bits 1111 1111).", "Equivalen a las IPv4 públicas: únicas globalmente y enrutables en Internet."], ["¿Cuál de las siguientes direcciones es unicast global?", "2A00:1450:4001::1", "FE80::1234:5678:9ABC", "FD12:3456:789A::1", "FF02::1:FF12:3456", "2A00 cae dentro de 2000::/3 (2000 a 3FFF)."], ["¿Cuál de estas es una dirección link-local?", "FE80::1", "FEC0::1", "FC00::1", "2001:DB8::1", "FE80::/10 abarca de FE80 a FEBF; FEC0::/10 (local de sitio) quedó en desuso."], ["¿Cuál es el alcance de una dirección link-local?", "Solo el enlace (subred) local: los routers no la reenvían más allá.", "Toda Internet, igual que una global, porque los routers la reenvían sin restricciones.", "Toda la organización, a través de varios routers, siempre que estén en la misma VLAN.", "Solo el propio host, porque nunca sale de la interfaz en la que fue configurada.", "Toda interfaz con IPv6 debe tener una link-local."], ["¿Cuál de las siguientes funciones usa la link-local del router?", "Servir como gateway predeterminado para los hosts y como siguiente salto en protocolos de enrutamiento.", "Salir a Internet como dirección pública, porque se enruta sin restricciones por los ISP.", "Funcionar como dirección de loopback para probar el stack IPv6 del propio router.", "Servir como dirección de broadcast del enlace, para llegar a todos los hosts de la LAN.", "Los RA salen con la link-local del router como origen."], ["¿Cómo se forma una dirección link-local por defecto?", "Se crea sola, sin DHCP, con el prefijo FE80::/10 (en la práctica FE80::/64) más la ID de interfaz.", "La asigna siempre un servidor DHCPv6, con el prefijo FE80::/10 y una ID de interfaz que él elige.", "La entrega el ISP al conectarse, con el prefijo FE80::/10 más la ID de interfaz del router.", "Se arma solo cuando el router envía un RA con la opción de autoconfiguración, usando FE80::/10.", "Se genera apenas se habilita IPv6 en la interfaz, aunque no tenga unicast global."], ["¿Qué es una dirección local única (ULA)?", "Una dirección parecida a las privadas de IPv4 (FC00::/7), de uso local en un sitio, no enrutable en Internet global.", "Una dirección global asignada por un RIR a las organizaciones, enrutable en Internet y única en el mundo.", "Una dirección de enlace local de FE80::/10, que sirve para comunicarse con los vecinos del mismo enlace.", "Una dirección multicast de alcance de sitio, usada por los routers de una misma organización.", "No se usa para “ocultar” equipos: la seguridad se logra con medidas adecuadas."], ["¿Qué ocurrió con las direcciones locales de sitio FEC0::/10?", "Quedaron en desuso y fueron reemplazadas por las locales únicas.", "Se transformaron en las direcciones link-local, y hoy se usan solo dentro de un enlace.", "Se convirtieron en las globales, y hoy se asignan a través de los RIR en bloques /32.", "Se reservaron para documentación y ejemplos, y no se usan en redes reales.", "Para documentación y ejemplos se reserva 2001:0DB8::/32."], ["¿Qué prefijo tienen las direcciones multicast IPv6?", "FF00::/8", "FE80::/10", "2000::/3", "FC00::/7", "Solo pueden usarse como dirección de destino."], ["¿Qué grupo multicast reúne a todos los dispositivos con IPv6 de un enlace?", "FF02::1 (todos los nodos).", "FF02::2 (todos los routers).", "FF02::1:FF00:0 (nodo solicitado).", "FF00::1 (todos los hosts).", "Los routers mandan sus RA a esta dirección."], ["¿Cuándo un router se une al grupo FF02::2?", "Cuando se habilita con ipv6 unicast-routing.", "Cuando se le asigna una dirección global.", "Apenas arranca, sin ningún tipo de configuración previa.", "Cuando recibe un RS de un host de la LAN.", "Los hosts mandan sus RS a este grupo."], ["Un router tiene configurada una dirección IPv6 en su interfaz, pero no envía RA. ¿Cuál es la causa más probable?", "Falta el comando ipv6 unicast-routing: por defecto el routing IPv6 está deshabilitado.", "Falta el comando no shutdown en el host, que mantiene apagada su interfaz de red.", "Falta una dirección anycast en la interfaz, que es la que se usa para enviar los RA.", "El router ya está usando DHCPv6 con estado, que reemplaza el envío de RA a los hosts.", "Tener una dirección IPv6 en la interfaz no convierte al router en un router IPv6."], ["¿Qué comando asigna correctamente una dirección unicast global a una interfaz de router?", "ipv6 address 2001:db8:acad:1::1/64", "ip address 2001:db8:acad:1::1/64", "ipv6 address 2001:db8:acad:1::1 /64", "ipv6 ip address 2001:db8:acad:1::1 64", "Se escribe sin espacio antes de la longitud de prefijo."], ["¿Cómo se configura una dirección link-local estática en la interfaz de un router?", "ipv6 address FE80::1 link-local", "ipv6 address FE80::1/64 static", "ipv6 link-local address FE80::1", "ipv6 address FE80::1 global", "Puede repetirse en todas las interfaces del router porque solo debe ser única en su enlace."], ["¿Qué obtiene un host con SLAAC solo (opción 1 del RA)?", "Prefijo, longitud de prefijo y gateway del RA, sin servidor DHCPv6 ni información adicional.", "Dirección, prefijo, gateway y DNS, todos obtenidos de un servidor DHCPv6 que lleva el registro.", "Solo el DNS, que obtiene de un servidor DHCPv6 sin estado; la dirección la arma él solo.", "Solo el prefijo del RA; el gateway y el DNS los configura a mano el administrador.", "Con SLAAC el cliente genera él mismo la ID de interfaz."], ["¿Qué ocurre con la opción 2 del RA (SLAAC y DHCPv6 sin estado)?", "El host usa lo del RA y pide información adicional (por ejemplo, DNS) a un servidor DHCPv6 que no asigna ni registra direcciones.", "El host ignora el RA y obtiene todo de DHCPv6, incluida la dirección global y el registro de la concesión.", "El servidor DHCPv6 asigna la dirección y lleva el registro de las concesiones, como en DHCPv4.", "El host no obtiene ningún gateway, porque el RA solo informa que debe consultar a un servidor DHCPv6.", "Con DHCPv6 con estado (opción 3) el servidor sí asigna y registra, como DHCP de IPv4."], ["En la opción 3 del RA (solo DHCPv6 con estado), ¿qué hace el host?", "Ignora el RA y obtiene dirección global, prefijo, gateway y DNS de un servidor DHCPv6.", "Usa el prefijo del RA y la ID de interfaz EUI-64 para armar su dirección global.", "Genera la dirección con SLAAC y solo le pide el DNS al servidor DHCPv6 sin estado.", "Se autoasigna una link-local y no recibe ninguna otra información de la red.", "El servidor lleva el registro de qué dirección entregó a cada cliente."], ["¿A qué dirección y con qué frecuencia envían los routers los mensajes RA por defecto?", "A FF02::1 (todos los nodos), cada 200 segundos.", "A FF02::2 (todos los routers), cada 200 segundos.", "A FF02::1, cada 60 segundos.", "A la dirección de broadcast de la red, cada 200 segundos.", "Un host no tiene que esperar: manda un RS y el router responde enseguida."], ["Un host con SLAAC arranca y no quiere esperar el próximo RA. ¿Qué hace?", "Envía un RS a FF02::2 (todos los routers).", "Envía un RS a FF02::1 (todos los nodos).", "Envía un NS a su propia dirección.", "Envía un ARP request de broadcast.", "El router responde con un RA."], ["¿Qué sistema operativo/versión usaba por defecto una ID de interfaz aleatoria, según el material?", "Windows desde Vista (XP y anteriores usaban EUI-64).", "Windows XP y anteriores (Vista usaba EUI-64).", "Todas las versiones de Windows, desde la primera con IPv6.", "Solo los routers Cisco, en interfaces seriales y Ethernet.", "La ID aleatoria evita preocupaciones de privacidad por poder rastrear al dispositivo por su MAC."], ["¿En qué consiste el proceso EUI-64 para armar la ID de interfaz?", "Se parte la MAC de 48 bits en dos mitades, se inserta FFFE en el medio y se invierte el séptimo bit del primer byte.", "Se agrega FFFE al final de la MAC de 48 bits y se invierte el primer bit del primer byte de la dirección.", "Se duplica la MAC de 48 bits y se descartan 32 bits, para completar una ID de interfaz de 64 bits.", "Se inserta FFFF en el medio de la MAC, y se invierte el octavo bit del primer byte de la dirección.", "El resultado tiene 64 bits (48 + 16)."], ["Dada la MAC FC99:4775:CEE0, ¿cuál es la ID de interfaz EUI-64?", "FE99:47FF:FE75:CEE0", "FC99:47FF:FE75:CEE0", "FE99:4775:FFFE:CEE0", "FD99:47FF:FE75:CEE0", "FC = 11111100; al invertir el séptimo bit queda 11111110 = FE."], ["Dada la MAC 00-1A-2B-3C-4D-5E, ¿cuál es la ID de interfaz EUI-64?", "021A:2BFF:FE3C:4D5E", "001A:2BFF:FE3C:4D5E", "011A:2BFF:FE3C:4D5E", "021A:2B3C:FFFE:4D5E", "00 = 00000000; invertir el séptimo bit da 00000010 = 02."], ["Dada la MAC 02-11-22-33-44-55, ¿cuál es la ID de interfaz EUI-64?", "0011:22FF:FE33:4455", "0211:22FF:FE33:4455", "0111:22FF:FE33:4455", "0011:2233:FFFE:4455", "El primer byte 02 tiene el séptimo bit en 1; al invertirse queda 00."], ["Dada la MAC A0-B1-C2-D3-E4-F5, ¿cuál es la ID de interfaz EUI-64?", "A2B1:C2FF:FED3:E4F5", "A0B1:C2FF:FED3:E4F5", "A1B1:C2FF:FED3:E4F5", "A3B1:C2FF:FED3:E4F5", "A0 = 10100000; invertir el séptimo bit da 10100010 = A2."], ["Una dirección tiene como ID de interfaz 5E26:0AFF:FE12:3456. ¿Qué MAC original la generó por EUI-64?", "5C-26-0A-12-34-56", "5E-26-0A-12-34-56", "5F-26-0A-12-34-56", "5C-26-0A-FF-FE-12", "Se quita FFFE y se vuelve a invertir el séptimo bit: 5E = 01011110 → 01011100 = 5C."], ["¿Qué sugiere que una ID de interfaz tenga FFFE en el medio?", "Que probablemente fue creada por EUI-64.", "Que es una dirección anycast.", "Que la generó DHCPv6 con estado.", "Que es una dirección multicast de nodo solicitado.", "Una ID aleatoria no tendría ese patrón."], ["¿Cuál es una desventaja de la ID de interfaz EUI-64?", "Permite rastrear la dirección hasta el dispositivo a partir de su MAC, lo que genera preocupación por la privacidad.", "Genera direcciones demasiado cortas, que no alcanzan para completar la ID de interfaz de 64 bits.", "No funciona con SLAAC, porque el router no puede verificar la ID de interfaz que arma el host.", "Requiere un servidor DHCPv6 con estado para registrar la MAC de cada dispositivo de la red.", "Su ventaja es justamente que se puede rastrear el origen de la dirección."], ["¿Qué ID de interfaz usa un router Cisco por defecto para su link-local dinámica en una interfaz Ethernet?", "EUI-64 a partir de la MAC de la interfaz.", "Un número aleatorio, generado al arrancar.", "Siempre ::1, igual que el loopback.", "La de la primera interfaz serial.", "En interfaces seriales usa la MAC de la primera interfaz Ethernet."], ["¿Cómo se forma la dirección multicast de nodo solicitado de un dispositivo?", "Con el prefijo FF02:0:0:0:0:1:FF00::/104 más los últimos 24 bits de su dirección unicast.", "Con el prefijo FF02::1 más los primeros 24 bits de su dirección unicast, es decir, la parte de red.", "Con el prefijo FF02::2 más los últimos 64 bits de su dirección unicast, es decir, la ID de interfaz.", "Con el prefijo FF00::/8 más su dirección MAC completa de 48 bits, tomada de la interfaz.", "104 + 24 = 128 bits."], ["Un dispositivo tiene la unicast 2001:db8:acad:1::1234:5678. ¿Cuál es su multicast de nodo solicitado?", "FF02::1:FF34:5678", "FF02::1:FF12:3456", "FF02::1:1234:5678", "FF02::1:FF00:1234", "Los últimos 24 bits son 34:5678."], ["Dos dispositivos de la misma LAN comparten los últimos 24 bits de su unicast. ¿Qué sucede con la multicast de nodo solicitado?", "Ambos comparten la misma dirección de nodo solicitado, sin problema, porque el paquete trae la dirección completa del destino.", "Se produce un conflicto de direcciones y ninguno de los dos puede comunicarse hasta que cambie una de ellas.", "El segundo dispositivo no puede unirse al grupo, porque ese grupo ya tiene un miembro en el enlace.", "Se asigna automáticamente una dirección anycast a ambos, y el tráfico se entrega solo al más cercano.", "Es posible aunque poco común; la ventaja es que solo procesan el paquete los que comparten esos 24 bits."], ["¿Cuál es la utilidad principal de la dirección multicast de nodo solicitado?", "Que solo procesen el paquete los equipos que comparten esos últimos 24 bits, en lugar de todos los nodos.", "Enviar mensajes a todos los routers del enlace, para que respondan con su configuración de prefijos.", "Reemplazar la dirección de loopback de cada dispositivo para que pruebe su propio stack IPv6.", "Asignar direcciones por DHCPv6 a los dispositivos que no pueden usar SLAAC en la red.", "Se crea automáticamente al asignar una unicast, global o link-local."], ["¿Qué cuatro mensajes agrega ICMPv6 como parte de Neighbor Discovery?", "RS, RA, NS y NA.", "Echo request, echo reply, TTL exceeded y redirect.", "DHCPDISCOVER, OFFER, REQUEST y ACK.", "ARP request, ARP reply, RARP request y RARP reply.", "Echo request/reply, destino inalcanzable, tiempo superado y redirección son mensajes comunes a ICMPv4 e ICMPv6."], ["¿Para qué sirve un NS (solicitud de vecino)?", "Para resolver una dirección IPv6 a MAC (se envía a la multicast de nodo solicitado) y para DAD.", "Para pedir información de direccionamiento a los routers, que responden con un RA del enlace.", "Para anunciar el prefijo de red a los hosts, en respuesta a un mensaje RS.", "Para pedir un servidor DNS a un servidor DHCPv6, cuando el RA indica que debe consultarse.", "Es el equivalente en IPv6 del ARP request."], ["¿Qué hace un NA (anuncio de vecino)?", "Responde a un NS con la MAC Ethernet o avisa que una dirección ya está en uso.", "Anuncia el prefijo y el gateway a los hosts del enlace, de forma periódica o a pedido.", "Pide a un router que envíe información de configuración, como el prefijo y el gateway.", "Informa la ruta más corta hacia un destino remoto, para que el host actualice su tabla.", "El anuncio del prefijo lo hace el RA."], ["¿En qué consiste la DAD (detección de direcciones duplicadas)?", "El dispositivo envía un NS con su propia dirección como objetivo; si alguien responde con un NA, la dirección ya está en uso.", "El router envía un RA con la lista de direcciones que están en uso en la LAN, y el host elige una libre.", "El host envía un RS a todos los routers antes de arrancar, y si alguno responde cambia su dirección.", "El servidor DHCPv6 rechaza las direcciones repetidas y le asigna una nueva al dispositivo que la pidió.", "Si no hay respuesta en un tiempo, la dirección es única. El RFC 4861 la recomienda pero no es obligatoria."], ["¿Qué campo usa IPv6 en lugar del TTL de IPv4?", "Límite de saltos (hop limit).", "Etiqueta de flujo (flow label).", "Siguiente encabezado (next header).", "Longitud de carga útil (payload length).", "Al llegar a 0, el router descarta el paquete y envía un mensaje de tiempo superado."], ["¿Qué comando muestra por interfaz la link-local (FE80…) y la global configurada, junto con el estado?", "show ipv6 interface brief", "show ip interface brief", "show ipv6 route connected", "show interfaces status", "show interface permite ver la MAC con la que se genera la ID EUI-64."], ["En la tabla de enrutamiento IPv6 (show ipv6 route), ¿qué indica la letra C?", "Una red conectada directamente; la dirección global de la interfaz aparece además como ruta local /128.", "Una red aprendida por un protocolo dinámico; la dirección global aparece como ruta local /128.", "Una ruta estática configurada manualmente por el administrador hacia una red remota.", "Una ruta por defecto hacia el ISP, que se carga automáticamente al habilitar el routing IPv6.", "show ipv6 route muestra solo redes IPv6."], ["Desde un router se hace ping a una dirección link-local de un vecino. ¿Qué hay que indicar además?", "La interfaz de salida, porque la link-local solo es única en su enlace y el router puede tener varias con la misma.", "La máscara de la red, porque la link-local usa un prefijo /10 y el router no puede inferirlo.", "El número de VLAN, porque la link-local solo es válida dentro de una misma VLAN del switch.", "La dirección MAC del vecino, porque la link-local no se puede resolver con NS ni NA.", "La link-local no se enruta más allá del enlace."], ["¿Qué prueba un ping a ::1?", "Que el stack IP del host local está bien instalado; no dice nada de direcciones, gateways ni capas inferiores.", "La conectividad con el gateway predeterminado, y que la dirección global del host está bien configurada.", "La conectividad con un host remoto, a través del gateway y de todos los routers del camino.", "El funcionamiento del servidor DHCPv6 que le asignó la dirección al host local, y su alcance.", "Es el equivalente a ping 127.0.0.1 en IPv4."], ["Un host hace ping a un host remoto IPv6 y responde. ¿Qué queda demostrado?", "Que funcionan la red local, el gateway, todos los routers del camino y el host remoto.", "Solo que el stack local funciona, y que la dirección del host está bien configurada.", "Solo que el gateway responde, pero no dice nada sobre los routers siguientes.", "Que el DNS funciona correctamente y resuelve los nombres de los hosts remotos.", "Ping a un gateway prueba solo la LAN local."], ["Un traceroute IPv6 falla en el salto 4: el último router que respondió es el del salto 3. ¿Qué se concluye?", "El problema está en el salto siguiente al 3 (o hay una restricción de seguridad ahí).", "El problema está en el host de origen, que no puede enviar paquetes fuera de su propia LAN.", "El problema está en el salto 1, que no reenvía los paquetes hacia el siguiente router.", "El DNS no resuelve el destino, y por eso el traceroute no puede continuar más allá del salto 3.", "Muchos administradores limitan o bloquean ICMP, así que la falta de respuesta no siempre es una falla."]]}, "XI": {"title": "Capa de transporte: TCP, UDP, puertos y sockets", "qs": [["¿Cuál es la función general de la capa de transporte?", "Brindar un transporte de datos confiable del origen al destino, independientemente de las redes físicas por las que viajen.", "Determinar la mejor ruta para cada paquete a través de las distintas redes, según la tabla de enrutamiento de cada router.", "Convertir direcciones IP en direcciones MAC para entregar cada paquete dentro de la red local de destino.", "Codificar los bits de cada trama en señales eléctricas u ópticas para transmitirlos por el medio físico.", "Sus usuarios suelen ser procesos de la capa de aplicación."], ["¿Cuál de las siguientes NO es una función principal de la capa de transporte?", "Elegir la ruta de cada paquete según la tabla de enrutamiento.", "Rastrear cada una de las conversaciones individuales entre aplicaciones.", "Segmentar los datos y manejar cada una de las partes por separado.", "Reensamblar los segmentos en streams para la aplicación.", "También identifica aplicaciones mediante el número de puerto."], ["¿Por qué se segmentan los datos en la capa de transporte?", "Para que muchas comunicaciones se intercalen en la misma red, evitar reenviar todo ante un error y no exceder buffers ni límites del medio.", "Para cifrar el contenido de cada segmento antes de enviarlo y evitar que otros dispositivos puedan leerlo en la red.", "Para evitar usar números de puerto, ya que cada segmento lleva su propia dirección de aplicación en el encabezado.", "Para que los routers puedan descartar los segmentos grandes sin afectar al resto de las conversaciones en curso.", "Enviar un archivo grande como un solo bloque impediría otro tráfico durante minutos u horas."], ["¿Qué es una “conversación” en la capa de transporte?", "El flujo de piezas de datos entre una aplicación de origen y una de destino.", "El intercambio continuo de tramas entre dos switches conectados por un enlace troncal.", "Un conjunto de paquetes que tienen la misma dirección IP de origen y de destino.", "La sesión que establece un usuario con su ISP cuando se conecta a Internet.", "Un host puede tener varias conversaciones simultáneas, y la capa las mantiene separadas."], ["¿Qué significa multiplexar en la capa de transporte?", "Intercalar en la misma red los datos de varias comunicaciones, diferenciándolas por puerto.", "Enviar el mismo segmento por varias rutas a la vez, para que llegue aunque falle alguna de ellas.", "Comprimir varios segmentos en uno solo, para reducir la cantidad de paquetes que viajan por la red.", "Asignar varias direcciones IP a un mismo host, una por cada aplicación que utilice la red.", "El receptor las separa según el puerto de destino."], ["¿Cuál es el objetivo del control de flujo?", "Que el receptor, cuando sus recursos se saturan, pida al emisor reducir la velocidad, regulando cuántos datos manda por vez.", "Que el emisor retransmita los datos perdidos o dañados, hasta que el receptor confirme su recepción correcta.", "Que cada segmento tenga un número que permita ordenarlos, y que el receptor los entregue en secuencia.", "Que se establezca una sesión entre el origen y el destino antes de transmitir cualquier dato de aplicación.", "Los recursos limitados del receptor son la memoria y el ancho de banda."], ["¿Cuáles son las tres operaciones básicas de la confiabilidad?", "Rastreo de datos transmitidos, acuse de recibo de lo recibido y retransmisión de lo no confirmado.", "Segmentación, reensamble y multiplexación de los datos, que permiten intercalar varias conversaciones en la red.", "Establecimiento, mantenimiento y cierre de la sesión entre dos aplicaciones que se comunican por la red.", "Cifrado, autenticación y verificación de integridad de cada uno de los segmentos que viajan por la red.", "Todo esto agrega tráfico de control: hay un compromiso entre confiabilidad y carga de la red."], ["¿Cuál de las siguientes aplicaciones tolera mejor la pérdida de algunos datos?", "Video en streaming o VoIP.", "Una base de datos.", "El correo electrónico.", "Una página web con un formulario de compra.", "En esas aplicaciones, retransmitir sería peor que perder un pedacito."], ["¿Qué diferencia hay entre TCP y UDP en cuanto a la unidad de datos (PDU) y al encabezado?", "TCP usa segmentos con encabezado de 20 bytes; UDP usa datagramas con encabezado de 8 bytes.", "TCP usa datagramas con encabezado de 8 bytes; UDP usa segmentos con encabezado de 20 bytes.", "Ambos usan segmentos con encabezado de 20 bytes, y solo cambia el control de flujo.", "Ambos usan datagramas con encabezado de 8 bytes, y solo cambia la confiabilidad.", "UDP tiene baja sobrecarga: puerto origen, puerto destino, longitud y checksum."], ["¿Qué RFC describe a TCP y cuál a UDP?", "TCP: RFC 793; UDP: RFC 768.", "TCP: RFC 768; UDP: RFC 793.", "TCP: RFC 791; UDP: RFC 792.", "TCP: RFC 1918; UDP: RFC 4861.", "Los números corresponden a los RFC que cita el material."], ["¿Cuál de las siguientes afirmaciones sobre UDP es correcta?", "Es un protocolo sin conexión y sin estado, que entrega los datos en el orden en que llegan.", "Establece una sesión con un enlace de tres vías antes de entregar cualquier dato a la aplicación.", "Usa números de secuencia para reordenar los datagramas que llegan fuera de orden en el destino.", "Controla el flujo de datos mediante una ventana que se ajusta según la capacidad del receptor.", "Si el orden o la confiabilidad importan, lo debe resolver la aplicación."], ["Una aplicación sobre UDP necesita confiabilidad. ¿Quién debe implementarla?", "La propia aplicación.", "La capa de red.", "El protocolo UDP automáticamente.", "El switch del enlace.", "UDP no confirma ni retransmite; eso no lo hace “no confiable” por definición, solo delega esas funciones."], ["¿Cuál de estos protocolos de aplicación usa normalmente UDP?", "DHCP.", "SMTP.", "HTTP.", "SSH.", "También usan UDP DNS, VoIP, TFTP, SNMP, RIP y el streaming de video."], ["¿Cuál de estos protocolos de aplicación usa normalmente TCP?", "SMTP.", "TFTP.", "SNMP.", "DHCP.", "También usan TCP la web (HTTP/HTTPS), FTP y SSH."], ["¿Por qué DNS puede usar tanto UDP como TCP en el puerto 53?", "UDP para consultas rápidas y numerosas; TCP cuando la respuesta requiere confiabilidad.", "UDP para las consultas del cliente y TCP para las respuestas del servidor, siempre por puertos distintos.", "UDP para las direcciones IPv4 y TCP para las direcciones IPv6, porque IPv6 necesita más confiabilidad.", "UDP dentro de la LAN y TCP a través de Internet, porque los routers no reenvían datagramas UDP.", "Es un ejemplo de aplicación que usa ambos protocolos."], ["¿Qué longitud tienen los campos de puerto de origen y de destino en los encabezados TCP y UDP?", "16 bits cada uno.", "8 bits cada uno.", "32 bits cada uno.", "12 bits cada uno.", "Con 16 bits hay 65.536 números de puerto posibles."], ["En una solicitud de un navegador a un servidor web, ¿cómo se usan los puertos?", "El destino es el puerto del servicio (TCP 80) y el origen lo elige el cliente al azar; en la respuesta se invierten.", "El origen es el puerto 80 y el destino lo elige el servidor al azar; en la respuesta se invierten.", "Ambos son el puerto 80 tanto en la solicitud como en la respuesta, porque identifican al mismo servicio.", "El destino lo elige el cliente al azar y el origen es 80 en la solicitud, y en la respuesta se mantienen.", "El puerto de origen funciona como dirección de retorno."], ["¿Por qué es conveniente que el cliente elija el puerto de origen al azar?", "Porque un destino predecible facilitaría a un intruso suplantar a un cliente.", "Porque los puertos fijos no pueden usarse en el cliente, ya que quedan reservados para servidores.", "Porque así se evita usar direcciones IP en los segmentos que salen del cliente.", "Porque el servidor lo exige para poder abrir la conexión con el cliente que la solicita.", "Además, el puerto elegido no debe chocar con otro en uso."], ["¿Qué es un socket?", "La combinación de una dirección IP y un número de puerto, que identifica de forma exclusiva un proceso en un host.", "La combinación de una dirección MAC y una dirección IP, que identifica de forma exclusiva a un host en la red.", "Solo el número de puerto de un servicio, que lo identifica de forma exclusiva dentro de un host.", "La conexión física entre dos hosts, formada por el puerto de cada NIC y el cable que los une.", "Un par de sockets (origen y destino) identifica la conversación entre dos hosts."], ["En el ejemplo del material, el cliente 192.168.100.48:49152 se conecta al servidor 192.168.1.20:80. ¿Qué se puede decir del puerto 49152?", "Es un puerto dinámico (efímero) asignado al cliente para esa conversación.", "Es un puerto bien conocido del servidor, reservado para el servicio web de la organización.", "Es un puerto registrado del servicio web, asignado por la IANA al servidor HTTP.", "Es el puerto de destino de la respuesta del cliente, que el servidor elige al azar.", "El rango dinámico o privado va de 49152 a 65535."], ["¿Cuál es la clasificación correcta de los puertos?", "Bien conocidos 0–1023; registrados 1024–49151; dinámicos o privados 49152–65535.", "Bien conocidos 0–1024; registrados 1025–50000; dinámicos 50001–65535.", "Bien conocidos 0–255; registrados 256–1023; dinámicos 1024–65535.", "Bien conocidos 1–1000; registrados 1001–32767; dinámicos 32768–65535.", "Los asigna la IANA."], ["¿A qué grupo pertenece el puerto 3306 (MySQL)?", "Registrados (1024–49151).", "Bien conocidos (0–1023).", "Dinámicos o privados (49152–65535).", "Reservados para multicast.", "Los registrados corresponden a procesos o aplicaciones del usuario."], ["¿Cuál es la asociación correcta entre servicio y puerto TCP?", "HTTP 80, HTTPS 443, SSH 22, SMTP 25, POP3 110.", "HTTP 8080, HTTPS 443, SSH 23, SMTP 25, POP3 143.", "HTTP 80, HTTPS 22, SSH 443, SMTP 110, POP3 25.", "HTTP 80, HTTPS 443, SSH 21, SMTP 53, POP3 110.", "Otros: FTP 21, Telnet 23, IMAP 143, DNS 53."], ["¿Qué servicio usa por defecto el puerto TCP 23?", "Telnet.", "SSH.", "FTP.", "SMTP.", "SSH usa el 22 y FTP el 21."], ["¿Qué puertos UDP usa DHCP?", "67 y 68.", "53 y 69.", "80 y 443.", "161 y 162.", "TFTP usa el 69 y SNMP el 161."], ["¿Qué puerto usa TFTP y con qué protocolo de transporte?", "UDP 69.", "TCP 69.", "UDP 53.", "TCP 21.", "Es un protocolo simple de transferencia de archivos sobre UDP."], ["¿Qué muestra el comando netstat?", "Las conexiones activas: protocolo, dirección y puerto locales, dirección y puerto remotos y estado de la conexión.", "La ruta que siguen los paquetes hasta un destino, con el tiempo de respuesta de cada router del camino.", "La tabla ARP del host, con las direcciones MAC de los dispositivos de la red local con los que se comunicó.", "El estado de las VLAN del switch al que está conectado el host y la lista de sus puertos troncales.", "La opción -n muestra IP y puertos en formato numérico, sin resolver nombres."], ["¿Para qué es útil netstat desde el punto de vista de la seguridad?", "Para detectar conexiones TCP no descritas o innecesarias que pueden ser una amenaza o consumir recursos.", "Para cifrar las conexiones abiertas y evitar que un intruso pueda leer los datos que viajan por ellas.", "Para bloquear automáticamente los puertos que se usan sin autorización, antes de que establezcan una conexión.", "Para asignar puertos a los servicios que se ejecutan en el host y evitar que se superpongan entre sí.", "Limitar los puertos abiertos mejora la seguridad."], ["¿Por qué TCP se dice que es un protocolo “con información de estado”?", "Porque registra qué datos se enviaron y cuáles se confirmaron.", "Porque guarda el estado de las VLAN a las que pertenece el host.", "Porque verifica el estado físico del enlace antes de transmitir cada segmento.", "Porque no mantiene ningún registro de las conexiones que se establecen.", "La sesión comienza con el establecimiento y termina con la terminación."], ["Una conexión TCP está formada por:", "Dos sesiones de una vía: cliente→servidor y servidor→cliente.", "Una única sesión bidireccional indivisible, que se cierra con un solo FIN.", "Tres sesiones de una vía: una de datos, una de control y una de acuses.", "Una sesión de una vía nueva por cada segmento que envía el cliente.", "Por eso el cierre necesita un FIN y un ACK por cada sentido."], ["¿Cuántos bits tiene el campo de número de secuencia del encabezado TCP?", "32 bits.", "16 bits.", "8 bits.", "48 bits.", "El número de reconocimiento también tiene 32 bits."], ["¿Para qué sirve el campo “tamaño de la ventana” del encabezado TCP?", "Indica la cantidad de bytes que se pueden aceptar antes de recibir un ACK, permitiendo regular el flujo.", "Indica la longitud total del segmento, incluidos el encabezado y los datos que transporta.", "Indica el número de segmentos perdidos que el receptor todavía espera que se retransmitan.", "Indica el puerto de retorno al que el receptor debe enviar el próximo ACK de la conexión.", "Tiene 16 bits y su valor inicial se fija en el enlace de tres vías."], ["¿Qué función cumple el campo “checksum” del encabezado TCP?", "Verificar errores en el encabezado y los datos.", "Indicar el próximo byte que espera recibir el destino.", "Identificar la aplicación de destino del segmento.", "Indicar si el segmento transporta información urgente.", "Tiene 16 bits."], ["¿Cuál es el significado correcto de los siguientes flags TCP?", "SYN sincroniza los números de secuencia; ACK indica que el número de reconocimiento es válido; FIN indica que no hay más datos del emisor; RST restablece la conexión.", "SYN restablece la conexión; RST sincroniza los números de secuencia; FIN indica urgencia; ACK indica que no hay más datos del emisor.", "SYN indica que no hay más datos; FIN abre la conexión; ACK reinicia el contador de secuencia; RST sincroniza los puertos.", "SYN indica datos urgentes; PSH sincroniza los números de secuencia; URG cierra la conexión; RST confirma la recepción.", "Los seis flags son URG, ACK, PSH, RST, SYN y FIN."], ["¿Qué verifica el enlace de tres vías?", "Que el destino esté presente en la red, que tenga un servicio activo en el puerto de destino y que el cliente quiera abrir una sesión en él.", "Que el cliente tenga una dirección IP válida y que el servidor la acepte dentro de la red local.", "Que el servidor tenga habilitado el control de flujo y que acepte la ventana propuesta por el cliente.", "Que el enlace físico entre ambos hosts no tenga errores de CRC ni colisiones en el medio de transmisión.", "Lo inicia siempre el cliente."], ["¿Cuál es el orden correcto del enlace de tres vías TCP?", "SYN, SYN+ACK, ACK.", "SYN, ACK, SYN+ACK.", "ACK, SYN, SYN+ACK.", "SYN+ACK, SYN, ACK.", "El cliente envía el primer SYN con un número de secuencia inicial (ISN) elegido al azar."], ["El cliente inicia una conexión con SEQ = 100. ¿Qué valor de ACK lleva el segmento SYN+ACK del servidor?", "101", "100", "99", "102", "El ACK indica el próximo byte esperado: ISN del cliente + 1."], ["En un enlace de tres vías, el cliente envía SYN con SEQ = 500 y el servidor responde con SYN+ACK con SEQ = 7000. ¿Qué lleva el tercer segmento del cliente?", "ACK = 7001", "ACK = 501", "ACK = 7000", "ACK = 500", "El cliente confirma el ISN del servidor + 1. Este tercer segmento no lleva datos de usuario."], ["En un enlace de tres vías, el cliente envía SYN con SEQ = 500 y el servidor responde con SYN+ACK con SEQ = 7000. ¿Qué lleva el segundo segmento, el del servidor?", "SEQ = 7000, ACK = 501", "SEQ = 500, ACK = 7001", "SEQ = 7001, ACK = 500", "SEQ = 501, ACK = 7000", "Es el único segmento del handshake con SYN y ACK activos a la vez."], ["¿Por qué el ACK es el número de secuencia + 1 durante el handshake?", "Porque el ACK indica el próximo byte que espera recibir el emisor del ACK.", "Porque el SYN consume un byte de datos de usuario, que debe confirmarse con el ACK siguiente.", "Porque el ACK se calcula a partir del tamaño de la ventana que anunció el emisor del SYN.", "Porque el número de secuencia empieza siempre en 0, y el ACK refleja el byte siguiente.", "El SYN cuenta como un número de secuencia, por eso se confirma ISN + 1."], ["¿Cuántos pasos requiere el cierre normal de una conexión TCP y por qué?", "Cuatro, porque hay dos sesiones de una vía y cada sentido necesita su FIN y su ACK.", "Tres, porque el servidor siempre responde con FIN y ACK juntos, en un único segmento.", "Dos, porque solo el cliente cierra la conexión y el servidor se limita a confirmarlo.", "Seis, uno por cada flag de control que participa en el proceso de cierre de la conexión.", "Si el servidor tampoco tiene más datos, puede combinar FIN y ACK y el cierre queda en tres pasos."], ["¿Cuál es la secuencia correcta del cierre de una conexión TCP?", "El cliente envía FIN; el servidor responde ACK; el servidor envía FIN; el cliente responde ACK.", "El cliente envía SYN; el servidor responde FIN; el servidor envía ACK; el cliente responde RST.", "El servidor envía RST y el cliente responde ACK, con lo que se cierran los dos sentidos.", "El cliente envía ACK; el servidor envía FIN+ACK; el cliente envía SYN para terminar.", "Cualquiera de los dos hosts puede iniciar el cierre."], ["¿Para qué se usa el flag RST?", "Para restablecer una conexión.", "Para sincronizar los números de secuencia.", "Para pedir la retransmisión de un segmento.", "Para avisar que hay datos urgentes.", "Se distingue del FIN, que indica cierre ordenado: no hay más datos del emisor."], ["¿Qué ocurre en el receptor TCP con los segmentos que llegan con números de secuencia no contiguos?", "Se retienen en el búfer hasta que lleguen los faltantes, y se entregan ordenados a la aplicación.", "Se descartan inmediatamente, y el emisor debe retransmitir toda la secuencia desde el último ACK.", "Se entregan a la aplicación en el orden de llegada, y luego se reordenan en la capa superior.", "Se retransmiten desde el receptor hacia el emisor para que este complete los huecos de la secuencia.", "El receptor los ordena por número de secuencia."], ["El emisor envía 10 bytes con seq = 1. ¿Qué valor de ACK devuelve el receptor?", "11", "10", "1", "9", "El ACK indica el próximo byte esperado, sin incluirlo en lo confirmado."], ["Con número de secuencia inicial 2000 y 10 segmentos de 1000 bytes recibidos correctamente, ¿qué ACK devuelve el receptor?", "12000", "10000", "12001", "11999", "El próximo byte esperado es 2000 + 10 × 1000 = 12000."], ["El receptor recibió los segmentos 1500–3000 y 3400–3500, pero no los bytes 3001–3399. ¿Qué ACK envía?", "3001", "3501", "3401", "1500", "Solo se confirman bytes contiguos; el primer byte que falta es el 3001."], ["Un emisor no recibe el ACK de un segmento a tiempo. ¿Qué hace?", "Vuelve al último ACK recibido y retransmite desde ahí; el segmento permanece en la cola de retransmisión hasta ser confirmado.", "Cierra la conexión con un RST, porque considera que el destino dejó de estar disponible en la red.", "Descarta el segmento perdido y sigue con el siguiente, sin esperar más tiempo la confirmación.", "Reduce el tamaño del encabezado y vuelve a enviar el segmento para ocupar menos ancho de banda.", "El RFC no especifica el proceso; depende de la implementación."], ["¿Qué permiten los acuses de recibo selectivos (SACK)?", "Confirmar segmentos discontinuos y retransmitir solo lo perdido.", "Cifrar el ACK para evitar suplantaciones, y confirmar cada segmento con un número único.", "Confirmar varios segmentos con un único flag, sin necesidad de indicar rangos de bytes.", "Eliminar la necesidad del enlace de tres vías en las conexiones que ya fueron abiertas.", "Son opcionales."], ["La ventana de un receptor es de 3000 bytes. ¿Cómo se comporta el emisor?", "Envía 3000 bytes, espera el ACK y recién entonces envía otros 3000.", "Envía todo de una vez y espera un solo ACK al final de la transferencia completa.", "Envía 3000 bytes por segundo, sin esperar ningún ACK del receptor mientras transmite.", "Envía 1500 bytes por cada ACK recibido, sin importar el tamaño de la ventana anunciada.", "Es el ejemplo del material del control de flujo por ventana."], ["Un receptor congestionado reduce su ventana de 3000 a 1500 bytes. ¿Qué efecto tiene en el emisor?", "El emisor espera ACK con más frecuencia y baja su velocidad de envío.", "El emisor envía más datos por segmento, para compensar la menor cantidad de ACK recibidos.", "El emisor cierra la conexión, porque la ventana ya no alcanza para transmitir con confiabilidad.", "El emisor retransmite todo desde el inicio, porque el receptor descartó los segmentos anteriores.", "Tras períodos sin pérdidas, la ventana aumenta, hasta que vuelva a haber pérdida."], ["¿Cuántos bytes tiene el encabezado UDP y qué campos contiene?", "8 bytes: puerto de origen, puerto de destino, longitud y checksum, de 16 bits cada uno.", "20 bytes: puertos de origen y destino, secuencia, ACK, ventana, checksum y puntero urgente.", "4 bytes: solo los puertos de origen y destino, de 16 bits cada uno, sin longitud ni checksum.", "12 bytes: puertos, longitud, checksum y número de secuencia, de 16 bits cada uno.", "Es de baja sobrecarga porque no ofrece retransmisión, secuenciamiento ni control de flujo."], ["¿Por qué UDP es ideal para voz y video en vivo?", "Porque son sensibles a retrasos y toleran cierta pérdida con efecto mínimo.", "Porque exigen entrega confiable y ordenada, y no pueden tolerar la pérdida de ningún paquete.", "Porque necesitan un enlace de tres vías para evitar fraudes durante la conversación.", "Porque requieren un control de flujo con ventana que se ajusta a la velocidad del receptor.", "Retransmitir datos viejos sería peor que perderlos."], ["En una transacción UDP, un cliente envía un datagrama de puerto de origen 51000 al puerto de destino 53. ¿Cómo viene la respuesta del servidor?", "Con puerto de origen 53 y puerto de destino 51000.", "Con puerto de origen 51000 y puerto de destino 53.", "Con puerto de origen 53 y puerto de destino 53.", "Con un puerto de origen elegido al azar y destino 53.", "La respuesta invierte origen y destino."]]}, "XII": {"title": "Capas de aplicación, presentación y sesión: DNS, HTTP, correo, FTP, DHCP, Telnet/SSH", "qs": [["¿Qué capas del modelo OSI cubre la capa de aplicación del modelo TCP/IP?", "Aplicación, presentación y sesión.", "Solo la aplicación del modelo OSI.", "Aplicación y transporte.", "Presentación, sesión y transporte.", "Los protocolos TCP/IP se crearon antes de las PC, las interfaces gráficas y la multimedia, por eso implementan poco de lo específico de presentación y sesión."], ["¿Cuál es la función de la capa de presentación (capa 6)?", "Representar la información para que los datos lleguen de forma reconocible aunque los equipos usen representaciones internas distintas.", "Crear y mantener diálogos entre las aplicaciones de origen y destino, y reiniciar las sesiones que se interrumpen.", "Brindar servicios a las aplicaciones de usuario para que puedan transmitir sus mensajes a través de la red.", "Establecer una ruta entre las redes de origen y destino, para que los datos lleguen al host correcto.", "Se ocupa más del contenido que de cómo se establece la comunicación."], ["¿Cuál de las siguientes es una de las tres funciones de la capa de presentación?", "Codificación y conversión de datos, compresión y encriptación.", "Establecimiento de sesiones, direccionamiento y enrutamiento.", "Segmentación, control de flujo y acuse de recibo.", "Codificación de línea, sincronización de bits y acceso al medio.", "En el destino, la presentación actúa como traductor entre códigos y descomprime y desencripta."], ["¿Cuál de los siguientes es un estándar de la capa de presentación?", "JPEG.", "RPC.", "NFS.", "SQL.", "También son estándares de presentación GIF, TIFF, QuickTime y MPEG."], ["¿Cuál de los siguientes es un protocolo de la capa de sesión?", "NFS.", "MPEG.", "TIFF.", "GIF.", "Otros protocolos de sesión son SQL y RPC (llamada a procedimiento remoto)."], ["¿Qué hace la capa de sesión (capa 5)?", "Crea y mantiene diálogos entre aplicaciones de origen y destino, y puede reiniciar sesiones interrumpidas o inactivas por mucho tiempo.", "Convierte los datos entre formatos de codificación distintos, para que cada equipo pueda interpretarlos sin importar su representación interna.", "Asigna direcciones IP a los hosts que inician sesiones, y reinicia las que quedaron interrumpidas por mucho tiempo.", "Controla el flujo de los datos mediante una ventana deslizante, y reinicia las sesiones cuando se pierden segmentos.", "Controla y sincroniza, por ejemplo, mensajes de chat y la comunicación de navegadores con servidores."], ["En el modelo TCP/IP, ¿qué diferencia hay entre aplicación, servicio y protocolo?", "Las aplicaciones las usa la gente, los servicios corren en segundo plano apoyando a las aplicaciones y los protocolos definen reglas y formatos.", "Las aplicaciones definen las reglas y los formatos, los protocolos los usa la gente y los servicios cifran los datos que viajan por la red.", "Los tres son sinónimos y se usan de forma indistinta en el modelo TCP/IP para referirse al mismo programa.", "Los servicios son siempre clientes, las aplicaciones son siempre servidores y los protocolos solo existen en la capa de transporte.", "Una misma palabra, como “Telnet”, puede referirse a la aplicación, al servicio o al protocolo."], ["¿Qué especifica un protocolo de capa de aplicación?", "Los tipos de mensajes, su sintaxis, el significado de los campos y los diálogos de intercambio.", "La ruta que seguirán los paquetes hasta el destino, y la dirección IP del servidor que atiende la solicitud.", "El tipo de cable que se debe usar entre el cliente y el servidor, y la velocidad del enlace.", "La dirección IP de cada cliente que accede al servicio, y los puertos que se pueden utilizar.", "Deben coincidir en origen y destino para que la comunicación funcione."], ["¿Qué es un demonio (daemon) en el modelo cliente-servidor?", "El proceso de servidor que corre en segundo plano y escucha solicitudes de clientes.", "Un virus que ataca a los servidores, y que corre en segundo plano sin que el usuario lo note.", "El cliente que inicia la conversación y escucha las respuestas del servidor en segundo plano.", "Un protocolo de seguridad para servidores, que filtra las solicitudes de los clientes no autorizados.", "Un servidor puede atender a muchos clientes a la vez, apoyándose en la capa de transporte."], ["En el modelo cliente-servidor, ¿quién inicia el intercambio?", "El cliente.", "El servidor.", "El primero que se conecte a la red.", "El router.", "Cargar (upload) es del cliente al servidor; descargar (download) es del servidor al cliente."], ["¿Cuál es una característica de una red punto a punto (P2P)?", "Cada equipo puede ser servidor en una transacción y cliente en otra, sin un servidor dedicado.", "Todos los recursos se centralizan en un servidor dedicado, al que los demás equipos solo acceden como clientes.", "Es más fácil aplicar políticas de seguridad que en cliente-servidor, porque cada equipo tiene su propio administrador.", "Solo un equipo puede compartir archivos, y los demás deben pedirle permiso antes de acceder a ellos.", "Las cuentas y permisos se configuran en cada equipo, lo que dificulta la administración en redes grandes."], ["¿Qué diferencia hay entre una red P2P y una aplicación P2P?", "La red comparte recursos entre equipos sin servidor dedicado; en la aplicación, un mismo dispositivo actúa como cliente y servidor dentro de la misma comunicación.", "La red P2P usa un servidor central que indexa los recursos; la aplicación P2P no necesita ningún servidor, ni siquiera de índice.", "La aplicación P2P solo funciona dentro de una red P2P, y en una red cliente-servidor no se puede ejecutar.", "No hay ninguna diferencia: ambos términos se refieren a un mismo conjunto de equipos que comparten archivos sin servidor.", "Algunas aplicaciones P2P son híbridas: un servidor de índice indica dónde está cada recurso."], ["¿Qué paquetes define el protocolo Gnutella?", "Ping, pong, query, query hit y push.", "Hello, update, query, reply y ack.", "Discover, offer, request, ack y nak.", "GET, POST, PUT, DELETE y HEAD.", "La transferencia real de archivos suele usar HTTP."], ["¿Cuál es la asociación correcta entre servicio, transporte y puerto?", "DNS TCP/UDP 53; HTTP TCP 80; SMTP TCP 25; POP3 TCP 110; IMAP TCP 143.", "DNS UDP 25; HTTP TCP 53; SMTP TCP 80; POP3 TCP 143; IMAP TCP 110.", "DNS TCP 80; HTTP UDP 53; SMTP UDP 25; POP3 UDP 110; IMAP UDP 143.", "DNS TCP/UDP 53; HTTP TCP 443; SMTP TCP 110; POP3 TCP 25; IMAP TCP 22.", "Otros: Telnet TCP 23, SSH TCP 22, FTP TCP 20 y 21, DHCP UDP 67 y 68."], ["¿Cuál es la función principal de DNS?", "Convertir nombres de dominio en direcc   answered++;if(good)right++;LS[it.id]=good?1:0;save();upd();
  if(answered===cur.length){const e=$("#end");e.classList.remove("hide");const p=Math.round(100*right/cur.length);
    e.innerHTML=`<b>Terminaste: ${right} de ${cur.length} (${p} %).</b><div class="mu">${p>=60?"Buen nivel; repasá las que fallaste con el botón de arriba.":"Conviene repasar el resumen de la unidad y volver a intentar."}</div>`;e.scrollIntoView({behavior:"smooth"})}
}
function upd(){$("#score").textContent=`${right} / ${answered} correctas · ${cur.length} preguntas`;$("#pb").style.width=cur.length?(100*answered/cur.length)+"%":"0"}
function start(){const sel=mode.value==="sel";$("#selbox").classList.toggle("hide",!sel);
  if(sel){if(cur.length&&started)selGo();else{cur=[];answered=0;right=0;$("#main").innerHTML='<div class="res">Marcá las unidades que querés, elegí la cantidad y apretá <b>Empezar</b>.</div>';upd();$("#seld").open=true}started=true;return}
  render(pool(mode.value))}
let started=false;
mode.onchange=start;$("#reset").onclick=start;
$("#wrong").onclick=()=>{if(mode.value==="sel"){render(shuf(selAll().filter(x=>LS[x.id]===0)));return}const base=pool(mode.value.startsWith("u:")?mode.value:"all").filter(x=>LS[x.id]===0);render(shuf(base))};
start();
</script></body></html>
