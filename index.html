*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}

.fb b.t{display:block}.fb.ok b.t{color:var(--ok)}.fb.ko b.t{color:var(--ko)}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}

#selbox{max-width:900px;margin:12px auto 0;padding:0 16px}#selbox details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px}#selbox summary{cursor:pointer;font-weight:600}
#chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 16px;margin-top:10px}.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}.chk input{width:18px;height:18px;flex:none}

<script>
const DATA={"I": {"title": "Introducción a las redes y modelos de referencia", "qs": [["En una WAN, el término “subred” se refiere a:", "El conjunto de enrutadores y líneas de comunicación que mueven paquetes del host de origen al de destino, sin incluir los hosts.", "La combinación de la red de transmisión y todos los hosts conectados a ella, es decir, la red completa tal como la ve el usuario final.", "Cada una de las divisiones lógicas en que un administrador parte un bloque de direcciones IP mediante una máscara más larga que la original.", "La interconexión de varias redes de distinta tecnología mediante gateways, que forma una interred como Internet.", "Subred tiene sentido en una WAN y es solo la parte del operador; la combinación subred + hosts es la “red”, y la interconexión de redes diferentes es la “interred”."], ["¿Cuál de las siguientes definiciones corresponde a “interred”?", "Se forma al interconectar redes diferentes; Internet es el ejemplo conocido.", "Es la combinación de una subred y todos los hosts que se conectan a ella, vista como una unidad administrativa.", "Es el conjunto de enrutadores y líneas de transmisión de un operador.", "Es una LAN cuyo cable compartido une todas las máquinas, con una topología de bus o de anillo.", "Interred = redes diferentes interconectadas. Los otros enunciados describen red, subred y LAN respectivamente."], ["Un enlace de difusión (broadcast) se caracteriza porque:", "Hay un solo canal de comunicación compartido por todas las máquinas de la red.", "Existen muchas conexiones entre pares individuales de máquinas.", "Cada paquete debe pasar siempre por una o más máquinas intermedias.", "Solo se usa en las WAN de los operadores telefónicos, nunca en las redes de área local.", "Difusión = canal único compartido. Los enlaces punto a punto (unicast) son los que tienen muchas conexiones entre pares y pueden requerir intermediarios."], ["¿Cuál de las siguientes afirmaciones sobre las redes punto a punto es correcta?", "Un paquete puede tener que visitar primero una o más máquinas intermedias para llegar a su destino.", "Todas las máquinas comparten un único canal de comunicación y por eso todas reciben cada paquete que se envía.", "Se las llama también redes multicast, porque cada paquete se envía a un grupo seleccionado de máquinas.", "Solo pueden existir con topología de bus o de anillo, porque necesitan un cable compartido por todas las máquinas.", "Punto a punto (unicast): muchas conexiones entre pares, con posibles saltos intermedios. Bus y anillo son topologías de redes de difusión."], ["Según la clase, una LAN se diferencia de otras redes en tres aspectos. ¿Cuáles son?", "Tamaño (tiempo de transmisión en el peor caso acotado y conocido), tecnología de transmisión (un cable al que se conectan todas las máquinas) y topología (bus o anillo).", "Costo de los equipos, velocidad máxima de transmisión (10 Mbps) y tipo de cable utilizado en cada tramo, ya sea coaxial o par trenzado.", "Cantidad de hosts conectados, protocolo de enrutamiento empleado (vector de distancia) y tipo de servicio ofrecido a los usuarios finales.", "Propietario (una compañía telefónica), alcance geográfico nacional y uso de conmutadores de paquetes que enlazan distintas ciudades.", "Tamaño, tecnología de transmisión y topología son los tres aspectos que distinguen a una LAN."], ["Como ejemplo de MAN, la clase presentó:", "Una red basada en TV por cable, con antena, amplificador y cajas de derivación hacia las casas.", "La red de una universidad con varios edificios conectados por cables Ethernet y un backbone propio entre ellos.", "Una red celular GSM que cubre todo un país y conecta a millones de teléfonos móviles mediante antenas.", "Una conexión Bluetooth entre una PC y su teclado, con la PC como maestro y el teclado como esclavo.", "La MAN comprende una ciudad; el ejemplo clásico es la TV por cable."], ["Una WAN que pertenece a una compañía telefónica o a un ISP tiene una subred formada por dos componentes. ¿Cuáles?", "Líneas de transmisión y elementos de conmutación.", "Hosts y enrutadores conectados por cables de cobre.", "Protocolos de enlace y protocolos de red.", "Switches y puntos de acceso inalámbricos.", "Las líneas de transmisión conectan enrutadores, y los elementos de conmutación conectan líneas de transmisión."], ["¿Qué describe el mecanismo de “almacenamiento y reenvío” (store and forward)?", "El enrutador almacena el paquete hasta que la línea de salida necesaria esté libre y luego lo reenvía.", "El emisor guarda una copia del mensaje hasta recibir la confirmación del receptor.", "El receptor almacena todos los paquetes hasta armar el mensaje completo y recién ahí lo entrega a la aplicación.", "El paquete se envía por todas las líneas a la vez y se descartan las copias duplicadas.", "En store and forward cada enrutador guarda el paquete hasta que la línea de salida requerida está disponible."], ["En la conmutación de paquetes:", "El mensaje se divide en paquetes, cada uno con un número de secuencia.", "Se reserva un circuito físico dedicado antes de enviar el mensaje.", "Cada paquete viaja siempre por el mismo camino y no necesita número de secuencia.", "El mensaje se envía completo y sin dividir de un enrutador al siguiente.", "Los paquetes llevan número de secuencia justamente porque pueden llegar desordenados."], ["¿Cuál de estas asociaciones entre categoría de red inalámbrica y ejemplo es correcta?", "Interconexión de sistemas – Bluetooth.", "LAN inalámbrica – IEEE 802.16.", "WAN inalámbrica – Bluetooth.", "Interconexión de sistemas – IEEE 802.11.", "Bluetooth es de corto alcance; 802.11 es la LAN inalámbrica; 802.16 y la telefonía celular son WAN inalámbricas."], ["Según la lista de estándares IEEE 802 de la clase, ¿cuál es la asociación correcta?", "802.3 – Ethernet; 802.11 – LAN inalámbricas; 802.15 – Bluetooth.", "802.3 – LAN inalámbricas; 802.11 – Ethernet; 802.15 – WAN de banda ancha.", "802.2 – Ethernet; 802.3 – Control lógico de enlace; 802.11 – Bluetooth.", "802.16 – LAN virtuales; 802.10 – Redes de área personal; 802.11 – Ethernet.", "802.3 Ethernet, 802.11 LAN inalámbricas, 802.15 PAN (Bluetooth), 802.16 banda ancha inalámbrica, 802.2 LLC, 802.10 VLAN y seguridad."], ["¿Cuál de las siguientes opciones NO es una de las cuatro razones por las que se compran computadoras para uso doméstico, según la clase?", "Reducir el costo de las licencias de software.", "Acceso a información remota (por ejemplo, la Web).", "Comunicación de persona a persona (correo, chat).", "Entretenimiento interactivo (juegos y video bajo demanda).", "Las razones son: información remota, comunicación persona a persona, entretenimiento interactivo y comercio electrónico."], ["¿Cuál de las siguientes propiedades se señala como esencial para el éxito de una red doméstica?", "Precio bajo.", "Ser exclusiva de un solo fabricante para asegurar compatibilidad.", "Requerir un administrador de red dedicado.", "Usar solo conexiones cableadas.", "Entre las propiedades: fácil instalación, probada en producción, precio bajo (esencial), capacidad suficiente, expansión gradual y seguridad."], ["Un servicio orientado a la conexión se modela sobre el:", "Sistema telefónico: se establece una conexión, se usa y luego se abandona.", "Sistema postal: cada mensaje lleva la dirección completa de destino.", "Sistema de radiodifusión: un emisor transmite a todos los receptores.", "Sistema de telégrafo: se envía un mensaje por vez sin confirmación.", "Orientado a conexión = teléfono (se negocian parámetros al establecerla). No orientado = correo postal."], ["En un servicio NO orientado a la conexión:", "Cada mensaje lleva la dirección de destino completa y se enruta de forma independiente de los demás.", "Emisor, receptor y subred negocian los parámetros que se usarán antes de que comience la transmisión de datos.", "Se establece primero una conexión, se usa para intercambiar los mensajes y después se abandona cuando termina.", "Los mensajes siempre llegan en el mismo orden en que fueron enviados, porque siguen todos la misma ruta fija.", "Como en el correo postal, cada carta lleva su dirección completa y se enruta por separado."], ["En el ejemplo de la clase de un flujo de bytes confiable cliente-servidor, ¿qué primitiva ejecuta el servidor para indicar que está listo para aceptar conexiones?", "LISTEN", "CONNECT", "SEND", "DISCONNECT", "El servidor ejecuta LISTEN; el cliente ejecuta CONNECT; el servidor ejecuta RECEIVE. El conjunto completo de cinco primitivas agrega SEND y DISCONNECT."], ["¿Cuál es la diferencia correcta entre servicio y protocolo?", "El servicio es el conjunto de primitivas que una capa ofrece a la superior; el protocolo son las reglas que rigen los mensajes entre entidades iguales de una misma capa.", "El servicio rige el formato de los paquetes entre entidades iguales; el protocolo es lo que una capa ofrece a la de arriba.", "Son sinónimos: ambos términos definen cómo se implementa por dentro cada capa, y solo difieren en el nombre que usa cada modelo.", "El servicio se define entre capas de distintas máquinas y el protocolo entre capas de una misma máquina, a través de la interfaz.", "Servicio = interfaz vertical (qué operaciones ofrece una capa). Protocolo = reglas horizontales entre entidades iguales, que usan para implementar el servicio."], ["Un emisor rápido satura a un receptor lento. Para evitarlo, una capa necesita:", "Control de flujo.", "Control de errores.", "Multiplexión.", "Direccionamiento.", "El control de flujo regula la velocidad del emisor según la capacidad del receptor."], ["Usar una misma conexión para varias conversaciones sin relación entre sí, cuando es costoso tener una conexión por cada par de procesos, se llama:", "Multiplexión.", "Enrutamiento.", "Control de errores.", "Conmutación de paquetes.", "Multiplexión es compartir una conexión entre varias conversaciones."], ["La “arquitectura de red” se define como:", "El conjunto de capas y protocolos.", "La lista de protocolos usados por un sistema, uno por capa.", "La distribución física de cables y dispositivos de una red.", "El conjunto de primitivas de servicio de una capa.", "Arquitectura = capas + protocolos. La lista de protocolos de un sistema, uno por capa, es la “pila de protocolos”."], ["En el modelo OSI, ¿qué capa ofrece servicios de control de diálogo, administración de token y sincronización?", "Sesión", "Presentación", "Transporte", "Aplicación", "La administración de token evita que ambas partes hagan la misma operación crítica al mismo tiempo; es un servicio de la capa de sesión."], ["¿Qué capa OSI convierte un medio de transmisión puro en una línea que, vista desde la capa de red, parece libre de errores?", "Enlace de datos", "Física", "Transporte", "Red", "La capa de enlace de datos fragmenta en tramas, las envía en secuencia y, si es confiable, recibe tramas de confirmación."], ["¿Cuál de las siguientes funciones corresponde a la capa de red del modelo OSI?", "Decidir cómo se enrutan los paquetes de origen a destino e interconectar redes heterogéneas de forma transparente.", "Asegurar que un bit 1 enviado por el emisor se reciba como 1 y no como 0, definiendo los niveles de tensión.", "Establecer una conexión de extremo a extremo y dividir los datos en unidades más pequeñas si es necesario.", "Definir la sintaxis y la semántica de la información transmitida para que dos máquinas la interpreten igual.", "Ese es el trabajo de la capa de red. Las otras opciones son capa física, transporte y presentación respectivamente."], ["¿Cuál es la PDU que maneja la capa de transporte en el modelo OSI según la clase?", "TPDU", "Paquete", "Trama", "APDU", "TPDU (transporte), paquete (red), trama (enlace de datos), bit (física); APDU, PPDU y SPDU son aplicación, presentación y sesión."], ["Ordená de menor a mayor nivel las PDU de las capas inferiores del modelo OSI (de la capa 1 a la 4):", "Bit – trama – paquete – TPDU", "Bit – paquete – trama – TPDU", "Trama – bit – paquete – TPDU", "Bit – trama – TPDU – paquete", "Física: bit; enlace: trama; red: paquete; transporte: TPDU."], ["En el modelo TCP/IP, la capa “host a red” se describe en la clase como:", "Un “gran vacío”: solo dice que el host se conecta a la red mediante un protocolo que permita enviar paquetes IP.", "La capa que define el formato del paquete y el protocolo oficial IP, y se ocupa de entregarlos a destino.", "La capa que permite mantener una conversación entre entidades iguales de origen y destino.", "La capa que contiene a TELNET, FTP, SMTP y DNS, es decir, los protocolos de alto nivel que usan los programas.", "No especifica un protocolo concreto; solo exige que permita enviar paquetes IP. IP está en la capa de interred."], ["La capa de interred de TCP/IP:", "Se basa en una capa no orientada a la conexión y su trabajo es entregar paquetes IP al destino; el enrutamiento es el aspecto principal.", "Ofrece un servicio orientado a la conexión mediante TCP, con entrega confiable y en orden de los segmentos entre origen y destino.", "Es equivalente a las capas de sesión y presentación del modelo OSI, y se ocupa de los diálogos entre aplicaciones.", "Define los protocolos TELNET y SMTP y se ubica por encima de la capa de transporte, junto a la aplicación.", "La capa de interred define el paquete y el protocolo IP, sin conexión. TCP pertenece a la capa de transporte."], ["¿Qué capas del modelo OSI NO tienen una capa propia equivalente en TCP/IP?", "Presentación y sesión.", "Red y transporte.", "Física y enlace de datos.", "Aplicación y transporte.", "En TCP/IP, presentación y sesión no existen como capas (se absorben en aplicación); física y enlace se agrupan en “host a red”."], ["Comparando los modos de servicio en las capas de red y transporte, ¿cuál enunciado es correcto?", "En red, OSI soporta ambos modos y TCP/IP solo el no orientado; en transporte, OSI solo el orientado y TCP/IP ambos.", "En red, OSI solo el orientado y TCP/IP ambos; en transporte, OSI ambos y TCP/IP solo el orientado.", "En red y en transporte ambos modelos soportan los dos modos de servicio, el orientado y el no orientado a la conexión.", "En red, ambos modelos solo soportan el no orientado; en transporte, ambos solo el orientado.", "La diferencia está “cruzada”: OSI ofrece ambos en red, TCP/IP ofrece ambos en transporte (TCP y UDP)."], ["¿Cuál se considera la mayor contribución del modelo OSI?", "Hacer explícita la distinción entre servicios, interfaces y protocolos.", "Su implementación gratuita en el UNIX de Berkeley, que facilitó su adopción en las universidades.", "Haber definido el protocolo IP y el esquema de direccionamiento utilizado hoy en Internet.", "Haber unificado las capas física y de enlace de datos en una sola, más simple de implementar.", "Esa distinción (propia de la buena ingeniería de software) es lo que TCP/IP originalmente no hacía."], ["¿Cuál de las siguientes NO es una crítica que se le hace al modelo OSI y sus protocolos?", "No distingue las capas física y de enlace de datos, que son completamente diferentes.", "Aparición inoportuna: TCP/IP ya se usaba en las universidades.", "Las capas de sesión y presentación están casi vacías, mientras enlace de datos y red están saturadas.", "Las primeras implementaciones fueron grandes, pesadas y lentas.", "No distinguir física y enlace es una crítica a TCP/IP. OSI critica: mala sincronización, mala tecnología, malas implementaciones y malas políticas."], ["Una de las críticas al modelo TCP/IP es que:", "No es general y no sirve para describir pilas distintas de TCP/IP, por ejemplo Bluetooth.", "Tiene demasiadas capas, varias de ellas innecesarias, y está muy ligado a una sola tecnología de red.", "Solo soporta servicios orientados a la conexión, por lo que no sirve para aplicaciones de tiempo real.", "Separa demasiado las capas física y de enlace de datos, cuando en la práctica son un único problema.", "TCP/IP describe sus propios protocolos; además no distingue servicio/interfaz/protocolo ni separa física de enlace."], ["¿Qué subcapa se agregó a la capa de enlace de datos de OSI para tratar las redes de difusión?", "LLC (Control de Enlace Lógico)", "MAC (Control de Acceso al Medio)", "TPDU", "VTY", "Originalmente enlace de datos solo trataba redes punto a punto; con las de difusión se agregó la subcapa LLC."], ["El enunciado: “el modelo es prácticamente inexistente pero los protocolos se usan ampliamente” se aplica a:", "TCP/IP; mientras que en OSI ocurre lo contrario: el modelo resultó útil pero sus protocolos no fueron populares.", "OSI; mientras que en TCP/IP ocurre lo contrario: el modelo resultó útil pero sus protocolos no fueron populares.", "Ambos modelos por igual, porque ninguno de los dos logró imponer sus protocolos en las redes reales.", "Ninguno de los dos: tanto el modelo como los protocolos de ambos tuvieron mucho éxito comercial y técnico.", "Es la conclusión de la comparación: OSI (salvo sesión y presentación) sirve para exponer redes, TCP/IP se usa en la práctica."], ["¿Cuál es un ejemplo de estándar “de facto”?", "La PC de IBM y sus sucesoras, copiadas por decenas de fabricantes.", "El estándar OSI de siete capas, publicado formalmente por la ISO.", "La recomendación V.24 de la ITU-T para la interfaz serie entre un DTE y un DCE.", "Un estándar aprobado por un comité técnico de la ISO tras varias rondas de votación.", "De facto surge sin plan formal; de jure es formal y adoptado por una institución autorizada (ej.: USB)."], ["¿Qué tarea tiene el sector ITU-R?", "Asignar frecuencias de radio en todo el mundo.", "Hacer recomendaciones sobre sistemas telefónicos y de comunicación de datos.", "Crear políticas, regulaciones y capacitaciones para el desarrollo.", "Regular las ofertas y los precios de los operadores en EE. UU.", "ITU-R radiocomunicaciones; ITU-T estandarización de telecomunicaciones (ej. V.24); ITU-D desarrollo. La FCC regula precios en EE. UU."], ["En el proceso de la ISO para crear un estándar internacional, el orden correcto de los documentos es:", "CD (Borrador de Comité) → DIS (Borrador de Estándar Internacional) → IS (Estándar Internacional).", "DIS → CD → IS.", "IS → DIS → CD.", "CD → IS → DIS.", "Un grupo de trabajo presenta el CD, pasa a DIS y, si se aprueba, se publica como IS."], ["En 1989 el IAB se reorganizó en dos grupos. ¿Cuáles son y qué hace cada uno?", "IRTF (investigación a largo plazo) e IETF (ingeniería a corto plazo).", "IETF (investigación a largo plazo) e IRTF (ingeniería a corto plazo).", "ISO (estándares) e IEEE (hardware).", "ITU-T (telefonía) e ITU-R (radio).", "IRTF = investigación a largo plazo; IETF = ingeniería a corto plazo. Los estándares de Internet se difunden como RFC."], ["La metáfora del “apocalipsis de los dos elefantes” enseña que un estándar:", "Debe escribirse entre la ola de investigación y la ola de inversión: demasiado pronto sale mal entendido y demasiado tarde las empresas ya invirtieron en otras soluciones.", "Debe escribirse siempre apenas se descubre el tema, para adelantarse a las empresas y evitar soluciones propietarias incompatibles.", "Solo debe escribirse cuando las empresas ya invirtieron miles de millones en el tema, para que refleje lo que ya existe en el mercado.", "Debe ser aprobado por dos organizaciones distintas, una técnica y otra comercial, para que tenga validez internacional.", "Hay que ubicarse entre los dos “elefantes”: la explosión de investigación y la ola de inversión."]]}, "II": {"title": "Capa física: señalización, medios guiados y no guiados", "qs": [["La capa física recibe una trama de la capa de enlace. ¿Qué hace con ella?", "La convierte en señales (eléctricas, ópticas o de microondas) que representan los bits y las envía al medio.", "La divide en paquetes de menor tamaño y les agrega direcciones lógicas de origen y destino antes de enviarla.", "La segmenta en bloques manejables y verifica que todos los segmentos lleguen al destino, retransmitiendo si hace falta.", "Le agrega la dirección MAC de destino y el campo de control de errores, y la entrega al siguiente dispositivo.", "La capa física no entiende de tramas: crea las señales que representan los bits. En el destino hace el camino inverso y entrega la trama completa a la capa de enlace."], ["¿Cuál de los siguientes NO es un elemento de la capa física según la unidad?", "El control de acceso al medio y el direccionamiento físico (MAC) de los hosts.", "Los medios físicos y los conectores asociados a cada interfaz de los dispositivos.", "La representación de los bits en el medio mediante distintos niveles de señal.", "Los circuitos del receptor y del transmisor en los dispositivos de red.", "Los elementos son: medios y conectores, representación de bits, codificación de datos y control, y circuitos de transmisor y receptor."], ["Para que el receptor pueda reconstruir una trama a partir de un “chorro” de señales, el emisor:", "Agrega patrones específicos de bits (por ejemplo 10011) que marcan el comienzo y el final de la trama.", "Envía cada trama por un medio físico distinto, de modo que el receptor pueda separarlas sin confundirlas.", "Espera una confirmación del receptor antes de enviar cada nuevo bit para sincronizar ambos extremos.", "Duplica la amplitud de la señal al inicio de cada trama y la reduce a la mitad al finalizarla.", "Sin patrones de inicio y fin, el receptor solo vería señales. Esos patrones pueden ser definidos por la capa de enlace, la física o ambas."], ["¿Cuál de estas opciones NO corresponde a un área cubierta por los estándares de la capa física?", "El algoritmo de enrutamiento entre redes.", "Las propiedades mecánicas de los conectores (materiales, dimensiones, diagrama de pines).", "La representación de los bits mediante señales (codificación).", "Las propiedades físicas y eléctricas de los medios.", "Los estándares abarcan propiedades físicas/eléctricas, propiedades mecánicas de conectores, codificación y señales de control. El enrutamiento es de capa 3."], ["Entre los principios fundamentales de la capa física, la “señalización” es:", "La forma en que se representa un “1” y un “0” en el medio.", "La conversión del flujo de bits en un código predefinido con patrones predecibles.", "El conjunto de dispositivos, medios y conectores que transportan las señales.", "La sincronización de relojes entre los switches de la red.", "Codificación = convertir bits en un código predefinido; señalización = cómo se representan 1 y 0 en el medio; componentes físicos = hardware, medios y conectores."], ["El “tiempo de bit” es:", "El plazo específico durante el cual cada señal ocupa el medio.", "El tiempo que tarda una trama completa en recorrer el enlace.", "El retardo entre el envío de un bit y la recepción de su confirmación.", "La duración total de una sesión de transmisión.", "Cada bit ocupa el medio durante un tiempo de bit, y emisor y receptor se sincronizan con un reloj."], ["¿Qué características de la señal se pueden cambiar para representar bits?", "Amplitud, frecuencia o fase.", "Longitud, grosor o material del cable.", "Dirección, puerto o protocolo.", "Retardo, jitter o pérdida de paquetes.", "Los bits se representan cambiando amplitud, frecuencia o fase de la señal; ambos extremos deben usar el mismo método."], ["En el método de señalización NRZ (sin retorno a cero):", "Un voltaje bajo representa 0 y un voltaje alto representa 1; solo sirve para enlaces lentos.", "El 1 se representa con una transición de bajo a alto en medio del tiempo de bit.", "Cada cuarteto de bits se transforma en un símbolo de cinco bits para equilibrar la energía.", "Siempre hay una transición de voltaje a mitad del tiempo de bit para mantener la sincronización.", "NRZ es simple pero usa mal el ancho de banda y es sensible a interferencias. Las otras opciones describen Manchester y 4B/5B."], ["¿Por qué NRZ pierde la sincronización con secuencias largas de unos o de ceros?", "Porque no hay transiciones de voltaje que le permitan al receptor mantener la referencia de los tiempos de bit.", "Porque el voltaje alto se disipa con el tiempo y la señal se atenúa por completo en el medio de transmisión.", "Porque el receptor interpreta las secuencias largas como símbolos no válidos y descarta la trama completa.", "Porque la amplitud de la señal se duplica en cada bit consecutivo y termina saturando la entrada del receptor.", "Sin cambios de nivel, el receptor no tiene cómo contar los tiempos de bit y se desincroniza."], ["En la codificación Manchester:", "Un cambio de bajo a alto representa 1 y de alto a bajo representa 0, con una transición siempre en la mitad del tiempo de bit.", "Un voltaje bajo constante durante todo el tiempo de bit representa 0 y uno alto constante representa 1, sin transiciones intermedias.", "Los bits se agrupan en símbolos de datos, de control y no válidos, para equilibrar la energía transmitida al medio.", "Se usan 5 bits para representar cada 4 bits de datos, lo que agrega un 25 % de sobrecarga a la señal.", "La transición en el centro del bit sirve para sincronizar emisor y receptor. La usa Ethernet 10BaseT, pero no es eficiente para velocidades altas."], ["¿Qué tecnología de la unidad usa codificación Manchester?", "Ethernet 10BaseT (10 Mbps).", "Fast Ethernet 100BASE-TX.", "Fibra óptica monomodo.", "IEEE 802.11g.", "Manchester es la codificación de Ethernet 10BaseT; no alcanza para velocidades altas."], ["Se afirma que la codificación por grupos de bits mejora la eficiencia. ¿Cuál de las siguientes NO es una de sus ventajas?", "Elimina los bits de sobrecarga, ya que cada símbolo lleva exactamente los bits de datos.", "Reduce los errores a nivel de bits, porque fuerza transiciones frecuentes que ayudan al receptor.", "Limita la energía transmitida al medio, equilibrando la cantidad de unos y de ceros (equilibrio DC).", "Permite distinguir los datos de los símbolos de control y mejora la detección de errores en el receptor.", "Los grupos de código agregan bits de sobrecarga (por ejemplo, 5 bits para 4 de datos); aun así permiten velocidades mayores."], ["Los grupos de código incluyen tres tipos de símbolos. ¿Cuáles son?", "De datos, de control (inicio, fin, medio inactivo) y no válidos.", "De datos, de sincronización y de direccionamiento (origen y destino).", "De inicio de trama, de cuerpo de datos y de cola de trama (FCS).", "De amplitud, de frecuencia y de fase, usados por los esquemas de modulación.", "Si se recibe un símbolo no válido, hay un error de trama."], ["En la codificación 4B/5B, de las 32 combinaciones posibles de 5 bits:", "16 se usan para datos, 6 para funciones especiales de control y 10 son códigos inválidos.", "10 se usan para datos, 16 para funciones de control y 6 son códigos inválidos.", "32 se usan para datos y ninguna se reserva para funciones de control o delimitación.", "16 se usan para datos y las 16 restantes son códigos inválidos, sin ningún símbolo reservado para control.", "Cada cuarteto (16 posibles valores) se asigna a un símbolo de 5 bits; hay 6 símbolos de control y 10 códigos inválidos."], ["Con 4B/5B, para transportar 100 Mbps de datos útiles, ¿a qué velocidad de señalización debe trabajar el medio?", "125 Mbaud, porque cada 4 bits de datos se envían como 5 bits.", "100 Mbaud, porque la codificación no agrega bits.", "80 Mbaud, porque la codificación comprime los datos.", "400 Mbaud, porque cada bit de datos se transmite como un símbolo independiente de cuatro bits.", "La sobrecarga es de 1 bit cada 4 (25 %): 100 × 5/4 = 125."], ["Ethernet 802.3 tiene un enlace de 100 Mbps, por el que se transfieren 60 Mbps de bits totales, de los cuales 40 Mbps son datos utilizables. ¿Cuál es la asociación correcta?", "Ancho de banda = 100 Mbps; rendimiento (throughput) = 60 Mbps; goodput = 40 Mbps.", "Ancho de banda = 60 Mbps; rendimiento = 100 Mbps; goodput = 40 Mbps.", "Ancho de banda = 40 Mbps; rendimiento = 60 Mbps; goodput = 100 Mbps.", "Ancho de banda = 100 Mbps; rendimiento = 40 Mbps; goodput = 60 Mbps.", "Ancho de banda: capacidad del medio. Rendimiento: bits transferidos en un período. Goodput: datos utilizables, sin encabezados ni sobrecarga."], ["¿Cuál de las siguientes afirmaciones sobre el rendimiento (throughput) es correcta?", "Nunca es más rápido que el enlace más lento de la ruta (cuello de botella).", "Siempre es igual al ancho de banda nominal del medio, sin importar la carga de la red.", "Solo cuenta los datos de aplicación, sin encabezados ni sobrecarga de los protocolos.", "Se mide en bytes por segundo y no en bits por segundo, a diferencia del ancho de banda.", "El throughput queda limitado por el cuello de botella de la ruta. La medida que más interesa al usuario es el goodput."], ["¿Cuál de estas equivalencias de unidades es correcta?", "1 Gbps = 10⁹ bps y 1 Tbps = 10¹² bps.", "1 Mbps = 1.000 bps y 1 Gbps = 1.000.000 bps.", "1 kbps = 1.024 bps y 1 Mbps = 1.048.576 bps.", "1 Tbps = 10⁹ bps.", "En la unidad: 1 kbps = 1000 bps; 1 Mbps = 1.000.000 bps; 1 Gbps = 10⁹; 1 Tbps = 10¹²."], ["¿Cuál de las siguientes NO es una fuente típica de ruido o interferencia para los cables de cobre?", "La lluvia intensa y la niebla en el exterior.", "Las ondas de radio de emisoras cercanas.", "Las luces fluorescentes de las oficinas.", "Los motores eléctricos y los generadores.", "La lluvia y la niebla afectan a los medios ópticos no guiados (láser). Al cobre lo afectan ondas de radio, luces fluorescentes y motores."], ["En un cable UTP, la diafonía (crosstalk) es:", "La interferencia causada por el campo magnético de los pares vecinos.", "La pérdida de intensidad de la señal con la distancia.", "La interferencia producida por luces fluorescentes y motores externos.", "La dispersión de la luz en el núcleo de la fibra.", "El trenzado cancela tanto la interferencia externa como la diafonía; por eso cada par tiene una cantidad distinta de vueltas por metro."], ["Respecto del cable UTP, ¿cuál es correcto?", "Tiene cuatro pares trenzados, usa conector RJ-45 y es el cable típico de las LAN Ethernet.", "Tiene un conductor central rodeado de malla de blindaje y usa conectores BNC.", "Es inmune a interferencia electromagnética porque transporta pulsos de luz.", "Posee blindaje de lámina o de malla sobre cada par y también sobre el conjunto de los pares.", "Las otras opciones describen coaxial, fibra y STP."], ["Para una instalación Ethernet que deba soportar gigabit como mínimo, ¿qué categoría de UTP es el mínimo aceptable según la unidad?", "Cat 5e", "Cat 3", "Cat 5", "Cat 2", "Cat 3 es de telefonía; Cat 5 de datos (Fast Ethernet 100BASE-TX); Cat 5e es el mínimo para gigabit; Cat 6 o 7e se recomiendan para 10 Gb en instalaciones nuevas."], ["Se necesita conectar dos switches entre sí con un cable UTP (sin auto-MDIX). ¿Qué cable corresponde?", "Cruzado: un extremo T568A y el otro T568B.", "Directo: ambos extremos T568A o ambos T568B.", "Cualquiera de los dos funciona siempre.", "Ninguno: los switches solo se conectan con fibra.", "Cruzado para equipos iguales (host-host, switch-switch, router-router); directo para host a switch/hub."], ["Se conecta una PC a un switch con un cable mal armado (cruzado en vez de directo). ¿Qué ocurre según la unidad?", "No se daña el equipo, pero no hay conectividad.", "Se daña la placa de red de la PC.", "Funciona normalmente porque Ethernet es tolerante.", "El switch ajusta la velocidad a 10 Mbps y funciona.", "Usar el cable equivocado no daña los equipos pero no hay enlace; es el primer chequeo cuando falla un enlace."], ["Hoy los ISP usan cable coaxial junto con fibra en un sistema híbrido llamado:", "HFC (fibra en el tendido troncal y coaxial en el tramo hacia el cliente).", "WDM, la multiplexación por división de longitud de onda usada en el núcleo óptico.", "FDDI, un anillo doble de fibra de 100 Mbps que se usó en redes troncales.", "VDSL, una variante de DSL de alta velocidad que usa el par de cobre telefónico.", "El coaxial nació para TV por cable en un solo sentido; hoy se usa en dos vías en redes HFC."], ["Comparado con el UTP, el cable STP:", "Protege mejor del ruido gracias al blindaje, pero es bastante más caro.", "Es más barato y fácil de instalar, porque no requiere conectar el blindaje a tierra.", "Es inmune a la EMI y a la RFI porque transporta los datos mediante pulsos de luz.", "Usa un único conductor central con malla alrededor y conectores BNC en los extremos.", "El STP agrega blindaje (malla o lámina) sobre cada par y sobre el conjunto. Fue la base de Token Ring."], ["¿Cuál de las siguientes es una ventaja de la fibra óptica frente al cobre?", "Es inmune a la interferencia electromagnética y de radiofrecuencia.", "Es más barata que el cobre y no requiere equipos de transmisión específicos.", "Se manipula sin cuidados especiales y soporta curvas cerradas sin pérdida de señal.", "Permite comunicación full duplex usando una sola fibra para ambos sentidos.", "La fibra es más costosa, requiere otras habilidades y equipos, y para full duplex necesita dos fibras."], ["¿Cuál es la diferencia correcta entre fibra monomodo y multimodo?", "La monomodo usa láser y un solo rayo por el centro, para largas distancias; la multimodo usa LED y sufre dispersión modal, para distancias menores.", "La monomodo usa LED y es más económica, para distancias cortas; la multimodo usa láser y sirve para distancias muy largas.", "Ambas usan LED y difieren solo en el color de la cubierta, que identifica el diámetro del núcleo y el alcance máximo.", "La multimodo transmite un único rayo por el centro del núcleo y la monomodo varios rayos con distintos ángulos.", "La dispersión modal de la multimodo limita la distancia; la monomodo es más cara pero llega más lejos."], ["En un sistema de transmisión óptico, el componente que convierte la luz recibida en voltajes es:", "El detector (fotodiodo).", "La fuente de luz (LED o láser).", "El empalme por fusión.", "El repetidor pasivo.", "Sistema óptico: fuente (LED o láser) → medio (fibra) → detector (fotodiodo)."], ["Ordená los métodos de unión de fibra de mayor a menor pérdida:", "Conectores (10 a 20 %) > empalme mecánico (cerca del 10 %) > fusión (muy poca pérdida).", "Fusión (10 a 20 %) > empalme mecánico (cerca del 10 %) > conectores (muy poca pérdida).", "Empalme mecánico (10 a 20 %) > conectores (cerca del 10 %) > fusión (muy poca pérdida).", "Conectores (10 a 20 %) > fusión (cerca del 10 %) > empalme mecánico (muy poca pérdida).", "Los conectores pierden 10 a 20 %, el empalme mecánico cerca de 10 % y la fusión casi nada."], ["Un técnico sospecha de un corte en un tramo largo de fibra y necesita saber a qué distancia aproximada está la falla. ¿Qué instrumento usa?", "Un OTDR.", "Un probador de continuidad de cobre.", "Un analizador de espectro de radiofrecuencia.", "Un comprobador de mapeo de pines RJ-45.", "El OTDR calcula a qué distancia aproximada está la falla (desalineación, separación de extremos, mal acabado)."], ["¿Cuál de las siguientes asociaciones entre estándar IEEE y tipo de red es correcta?", "802.15 – Bluetooth (WPAN, de 1 a 100 metros); 802.16 – WiMAX (punto a multipunto, banda ancha).", "802.11 – Bluetooth (WPAN, de 1 a 100 metros); 802.15 – WiMAX (punto a multipunto, banda ancha).", "802.16 – LAN inalámbrica Wi-Fi (WLAN, de 30 a 100 metros); 802.11 – WiMAX (punto a multipunto).", "802.15 – LAN inalámbrica Wi-Fi (WLAN); 802.11 – Bluetooth (WPAN, de 1 a 100 metros).", "802.11 es Wi-Fi (WLAN), 802.15 es Bluetooth (WPAN), 802.16 es WiMAX."], ["Un host quiere conectarse a una WLAN. ¿Qué elementos componen una LAN inalámbrica?", "Punto de acceso (AP) conectado por cobre a la red existente, NIC inalámbricas en los hosts y routers inalámbricos.", "Solo adaptadores inalámbricos en los hosts, sin ningún elemento central que coordine el acceso al medio ni conecte con la red cableada.", "Un hub de fibra óptica con una NIC óptica en cada host, y cables de fibra hasta el router de la red existente.", "Un repetidor de microondas por cada host, más un router de borde que se conecta a la red existente mediante fibra.", "El AP concentra las señales de los usuarios y se conecta por cobre a la red."], ["¿Cuál de las siguientes combinaciones de estándar 802.11, frecuencia y velocidad es correcta?", "802.11a – 5 GHz – hasta 54 Mbps.", "802.11b – 5 GHz – hasta 54 Mbps.", "802.11g – 5 GHz – hasta 11 Mbps.", "802.11a – 2,4 GHz – hasta 11 Mbps.", "a: 5 GHz/54; b: 2,4 GHz/11; g: 2,4 GHz/54; n: 2,4 o 5 GHz, 100 a 210 Mbps típicos."], ["¿Por qué 802.11a tiene menor cobertura y peor penetración de edificios que 802.11b?", "Porque usa frecuencias más altas (5 GHz) y esas ondas se atenúan más ante los obstáculos; además no es interoperable con 11b/11g.", "Porque usa frecuencias más bajas (2,4 GHz), que rebotan en la ionosfera y se dispersan antes de llegar al receptor.", "Porque transmite a menor velocidad que 802.11b, y por eso necesita más potencia para cubrir la misma distancia.", "Porque utiliza fibra óptica en su tramo final, y la luz no atraviesa bien las paredes de los edificios.", "A mayor frecuencia, menos penetración. 802.11b (2,4 GHz) alcanza unos 50 m en interiores y 100 m en exteriores."], ["Respecto de las ondas de radio, ¿cuál es correcto?", "Son omnidireccionales, atraviesan edificios y, a bajas frecuencias, cruzan cualquier obstáculo.", "A altas frecuencias atraviesan cualquier obstáculo y siguen la curvatura de la Tierra.", "Solo viajan en línea recta, no atraviesan edificios y a bajas frecuencias son absorbidas por el suelo.", "Requieren siempre antenas alineadas punto a punto y no pueden usarse en transmisiones de difusión.", "A bajas frecuencias cruzan obstáculos; a altas viajan en línea recta y rebotan en los obstáculos. En HF rebotan en la ionosfera."], ["¿Cuál es una desventaja de las microondas como medio de transmisión?", "No atraviesan bien los edificios y sufren problemas por el clima y la refracción atmosférica.", "Requieren derecho de paso para tender cables a lo largo de todo el trayecto entre torres.", "Son más caras de instalar que tender fibra óptica, y necesitan mantenimiento frecuente de las torres.", "Solo funcionan a muy corta distancia y exigen que las antenas estén dentro de una misma habitación.", "Su ventaja: no necesitan derecho de paso y las antenas cuestan menos que tender fibra; desventajas: no atraviesan edificios, clima, espectro saturado."], ["¿Cuál de las siguientes afirmaciones sobre las ondas infrarrojas y milimétricas es correcta?", "Sirven para comunicación de corto alcance, no atraviesan objetos sólidos y no requieren licencia.", "Atraviesan paredes con facilidad y tienen un alcance de varios kilómetros entre edificios.", "Requieren licencia estatal y se usan principalmente en los backbones de los operadores de larga distancia.", "Son inmunes a cualquier interferencia por ser ondas ópticas, por lo que se usan en exteriores.", "Se limitan a entornos de escritorio; la ventaja es que no necesitan licencia."], ["Un enlace láser entre dos edificios deja de funcionar durante una tormenta con niebla. ¿Qué característica de este medio lo explica?", "No penetra la lluvia ni la niebla y debe estar bien alineado.", "Necesita licencia y el organismo regulador la suspendió.", "Solo funciona con fibra óptica monomodo y la tormenta rompió el cable.", "Sufre diafonía con los pares vecinos por la humedad del aire.", "El láser entre edificios ofrece alto ancho de banda a bajo costo y sin licencia, pero requiere alineación y no atraviesa lluvia ni niebla."], ["¿Cuál es una consideración de seguridad propia de las redes inalámbricas?", "Cualquiera dentro de la cobertura puede acceder a la transmisión, por lo que hay que reforzar la seguridad.", "El medio es exclusivo de cada usuario, por lo que prácticamente no hay riesgo de intercepción de datos.", "Al usar el aire como medio, las señales no pueden ser interferidas ni capturadas por terceros.", "La seguridad solo depende del tipo de conector que se use entre la placa del equipo y la antena externa.", "Además, la cobertura la limitan materiales y terreno, y es susceptible a interferencias de teléfonos inalámbricos, hornos microondas y luces fluorescentes."]]}, "III": {"title": "Satélites, telefonía, ADSL, telefonía móvil y TV por cable", "qs": [["En su forma más simple, un satélite de comunicaciones es:", "Un enorme repetidor de microondas en el cielo que amplifica la señal entrante y la retransmite en otra frecuencia.", "Un espejo pasivo que rebota la señal hacia la Tierra sin amplificarla ni cambiar su frecuencia, como la Luna, y por eso exige antenas muy grandes en tierra.", "Un conmutador de paquetes en órbita que almacena los mensajes hasta que la estación de destino esté libre.", "Una antena omnidireccional que solo recibe señales de las estaciones terrestres y las guarda para su análisis.", "A diferencia de un satélite natural, el artificial amplifica antes de devolver la señal, y lo hace en otra frecuencia para evitar interferencia."], ["Un satélite geoestacionario (GEO) se caracteriza por:", "Estar a unos 35.786 km, permanecer siempre sobre el mismo punto, tener una gran huella y un retardo de 250 a 300 ms.", "Estar a unos 18.000 km, tener un período de 6 horas, una huella pequeña y un retardo de unos 100 ms.", "Estar a unos 500–750 km, recorrer la órbita en unos 90 minutos y requerir estaciones terrestres de gran potencia, y tener una huella pequeña.", "Estar entre los dos cinturones de Van Allen, ocupar una huella mediana y tener un retardo menor a 40 ms.", "Los GEO (ej.: DirectTV) tienen el mayor retardo. MEO ≈ 18.000 km (GPS); LEO ≈ 500–750 km (Iridium, Starlink)."], ["Los 24 satélites del GPS corresponden a una órbita:", "MEO (órbita media), a unos 18.000 km, entre los dos cinturones de Van Allen, con período de 6 horas.", "GEO, a 35.786 km, siempre sobre el mismo punto del Ecuador y con una huella muy grande, para telefonía y TV.", "LEO, a unos 750 km de altura, con seis collares de satélites que giran alrededor de la Tierra.", "HEO, una órbita muy elíptica por encima del cinturón exterior de Van Allen y con período de 12 horas.", "Los MEO tienen huella menor que los GEO y requieren transmisores menos potentes."], ["¿Por qué no se puede elegir cualquier órbita según el período del satélite?", "Porque los cinturones de Van Allen (partículas cargadas atrapadas por el campo magnético terrestre) destruirían rápidamente un satélite que vuele dentro de ellos.", "Porque la ITU solo permite órbitas circulares sobre el Ecuador, para evitar interferencias entre los satélites de distintos países.", "Porque el retardo sería mayor a 300 ms en cualquier otra órbita, lo que haría inviable la telefonía por satélite en todo sistema comercial y entonces no habría forma de sincronizar los relojes con la Tierra.", "Porque las microondas no atraviesan la atmósfera a otras alturas y el enlace con las estaciones terrestres se perdería por completo.", "El período no es lo único que importa: hay que evitar los cinturones de Van Allen."], ["Con la tecnología actual, no conviene separar dos satélites GEO menos de 2 grados en el plano ecuatorial de 360 grados. ¿Cuántos satélites GEO como máximo puede haber?", "180", "360", "90", "720", "360 / 2 = 180. La ITU asigna las posiciones orbitales para evitar el caos."], ["La banda Ku usada por los satélites GEO tiene el problema de:", "Interferirse con la lluvia, lo que se soluciona con varias estaciones terrestres bien separadas.", "No poder usarse para TV directa porque es demasiado alta, por lo que solo sirve para enlaces entre estaciones terrestres.", "Requerir siempre línea de vista entre los satélites vecinos, lo que obliga a separarlos como mínimo 10 grados.", "Estar compartida con la telefonía celular GSM, por lo que se producen interferencias en las ciudades.", "La lluvia degrada la señal en esa banda; se usan estaciones terrestres separadas para mitigarlo."], ["¿Cuál de las siguientes afirmaciones sobre Iridium es correcta?", "Se planearon 77 satélites, pero se lanzaron 66; retransmite la llamada de satélite a satélite y su plan fracasó por la masificación de la telefonía celular.", "Tiene 48 satélites y usa el esquema de “tubo doblado”, con la complejidad en tierra; da servicio a usuarios de Internet de banda ancha Sus terminales son antenas de pequeño diámetro (VSAT).", "Se diseñó para usuarios de Internet con 288 satélites en banda Ka, con conmutación a bordo y enlaces ópticos.", "Es un sistema GEO de TV directa con VSAT, que usa estaciones pequeñas con antena de un metro de diámetro.", "Globalstar (48 satélites) usa “tubo doblado”; Teledesic apuntaba a usuarios de Internet en banda Ka."], ["¿Cuál es la diferencia de diseño entre Iridium y Globalstar?", "Iridium retransmite de satélite a satélite; Globalstar usa el diseño tradicional de “tubo doblado” y deja la complejidad en tierra.", "Iridium usa “tubo doblado” y deja la complejidad en tierra; Globalstar retransmite de satélite a satélite entre sus 48 unidades, y ambos son sistemas LEO.", "Iridium es un sistema GEO con pocos satélites y Globalstar es un sistema LEO con muchos más satélites.", "Ambos usan tubo doblado y dejan la complejidad en tierra, pero Globalstar tiene más satélites en órbita.", "En Globalstar, gran parte de la complejidad queda en tierra, lo que permite teléfonos de baja potencia."], ["¿En cuál de estas situaciones NO conviene especialmente usar un satélite frente a la fibra óptica?", "Cuando hay fibra disponible en toda la zona y se necesita el máximo ancho de banda por usuario.", "Cuando el lugar es agreste y con infraestructura terrestre poco desarrollada.", "Cuando es muy caro o difícil conseguir el derecho de paso para tender fibra.", "Cuando se necesita difusión de un mismo contenido a muchos receptores o comunicaciones móviles.", "La fibra tiene más ancho de banda; el satélite conviene en móviles, difusión, zonas agrestes, derecho de paso difícil, despliegue rápido o economía."], ["¿Qué ventajas ofrece Starlink frente a un satélite GEO tradicional?", "Al usar satélites LEO (~550 km), logra latencia de 20 a 40 ms; usa enlaces láser entre satélites y cobertura global.", "Usa satélites a más de 35.000 km para lograr mayor huella, menor latencia y cobertura de las zonas polares.", "Tiene velocidad simétrica garantizada, independiente del clima, y no requiere antena en el domicilio del usuario.", "Elimina la necesidad de estaciones terrestres conectadas a Internet, porque los satélites se conectan directamente con el usuario.", "Desventajas de Starlink: costo alto de equipo y suscripción, dependencia del clima y obstrucciones. Velocidad asimétrica de 50 a 300 Mbps."], ["Respecto de la red telefónica pública conmutada (PSTN), ¿cuál de las siguientes opciones enumera correctamente sus componentes?", "Circuitos locales (par trenzado), troncales (fibra digital) y oficinas de conmutación.", "Circuitos locales (fibra óptica), troncales (par trenzado de cobre) y repetidores cada pocos kilómetros.", "Módems, DSLAM y nodos de fibra, conectados con cable coaxial hacia el domicilio de cada cliente.", "Antenas, estaciones base y MTSO, conectadas por enlaces de microondas entre las celdas vecinas.", "Planta externa = circuitos locales y troncales; planta interna = conmutadores dentro de las oficinas."], ["La “última milla” del sistema telefónico es:", "El circuito local de dos alambres entre la oficina central y los hogares o pequeñas empresas.", "El tramo de fibra óptica de alta velocidad entre dos oficinas de conmutación de ciudades distintas.", "El enlace de microondas entre la estación base y la MTSO que atiende a los teléfonos móviles.", "El último satélite de la cadena de retransmisión antes de llegar a la estación terrestre del cliente.", "Una oficina central agrupa hasta 10.000 circuitos locales."], ["¿Qué problema de las líneas de transmisión es inevitable porque lo causa el movimiento al azar de los electrones?", "El ruido térmico.", "La distorsión por retardo.", "La diafonía.", "El ruido de impulso.", "Distorsión por retardo: componentes que viajan a distinta velocidad. Diafonía: acoplamiento inductivo entre cables cercanos. Ruido de impulso: picos en la línea de energía."], ["La modulación consiste en:", "Colocar la información de una señal de baja frecuencia (moduladora) sobre una señal de alta frecuencia (portadora).", "Convertir una señal analógica en una secuencia de bits mediante el muestreo y la cuantificación de su amplitud.", "Dividir una troncal en canales de tiempo asignados a distintos usuarios, que transmiten por turnos rotativos.", "Amplificar la señal para vencer la atenuación del cable y regenerarla antes de enviarla al próximo tramo.", "El módem (modulador-demodulador) acepta un flujo de bits y produce una portadora modulada, o viceversa."], ["¿Cuál NO es una razón por la que se modula una señal?", "Reducir la cantidad de bits de información que se transmiten.", "Evitar interferencia entre usuarios que usarían la misma frecuencia original.", "Lograr mayor eficiencia de transmisión a frecuencias altas.", "Que las antenas en transmisión inalámbrica tengan medidas razonables.", "Ejemplo de la clase: una señal de 3 kHz sin modular requeriría una antena de 50 km."], ["¿Cuál es la asociación correcta entre técnica de modulación digital y característica?", "ASK: dos niveles de amplitud; FSK: dos o más tonos distintos; PSK: la portadora se desplaza 0 o 180 grados.", "ASK: dos frecuencias distintas; FSK: dos niveles de amplitud; PSK: dos tonos de distinta intensidad.", "ASK: desplazamiento de fase de la portadora; FSK: variación de amplitud; PSK: cambio de frecuencia.", "AM, FM y PM son modulaciones digitales que usan bits; ASK, FSK y PSK son sus equivalentes analógicas.", "AM, FM y PM son las analógicas (amplitud, frecuencia, fase)."], ["Un módem muestrea la línea 2400 veces por segundo y usa QAM-16 (4 bits por símbolo). ¿Cuál es su tasa de bits?", "9600 bps", "2400 bps", "4800 bps", "19.200 bps", "Tasa de bits = símbolos por segundo (baudios) × bits por símbolo = 2400 × 4 = 9600 bps."], ["¿Cuántos bits por símbolo transmiten QPSK, QAM-16 y QAM-64, respectivamente?", "2, 4 y 6", "4, 8 y 16", "2, 8 y 16", "1, 4 y 8", "QPSK tiene 4 combinaciones (2 bits), QAM-16 tiene 16 (4 bits) y QAM-64 tiene 64 (6 bits)."], ["En la analogía de la tubería de agua de la unidad:", "La velocidad es qué tan rápido fluye el agua y el ancho de banda es el diámetro de la tubería.", "El ancho de banda es qué tan rápido fluye el agua y la velocidad es el diámetro.", "El baudio es el diámetro de la tubería y los bits son la presión con que el agua entra.", "Ambos conceptos son equivalentes y se miden en bps, porque el agua y los bits son la misma magnitud.", "El ancho de banda es una propiedad física del medio (hertz); la velocidad de datos se mide en bps."], ["Los módems de 56 kbps (V.90) tienen 33,6 kbps de subida y 56 kbps de bajada porque:", "Suele haber más tráfico del ISP hacia el usuario que al revés.", "La línea telefónica solo permite 33,6 kbps en un sentido.", "El usuario normalmente transmite con mayor potencia.", "El filtro de la oficina central bloquea la subida.", "La asimetría refleja el patrón de tráfico: se descarga más de lo que se sube."], ["¿Por qué los módems tradicionales son lentos y cómo lo supera xDSL?", "En la oficina central un filtro atenúa lo que está debajo de 300 Hz y encima de 3400 Hz; con xDSL la línea va a un conmutador sin ese filtro y el límite pasa a ser el circuito local.", "Porque el par trenzado de Cat 3 no puede transportar más de 56 kbps por su atenuación; xDSL lo reemplaza por fibra hasta el hogar.", "Porque el módem usa modulación de amplitud (AM) y el ruido la afecta mucho; xDSL usa modulación de frecuencia (FM) y es inmune.", "Porque la línea está compartida con los vecinos de la cuadra; xDSL le asigna a cada usuario un canal privado de mayor ancho de banda; además, el módem tradicional comparte la línea con el teléfono de la casa.", "xDSL funciona sobre los circuitos locales de par trenzado Cat 3 existentes, sin afectar faxes ni teléfonos, y siempre activo."], ["¿Cuál es la diferencia entre ADSL y SDSL?", "ADSL es asimétrico (menos ancho de banda de subida que de bajada) y apunta al cliente hogareño; SDSL es simétrico y apunta a empresas.", "ADSL es simétrico y apunta a las empresas con servicios dedicados; SDSL es asimétrico y apunta al cliente hogareño; ambos usan el par de cobre de la línea telefónica convencional.", "ADSL usa fibra hasta el hogar y SDSL usa cable coaxial compartido con los vecinos de la misma cuadra.", "ADSL solo transporta voz sobre el par de cobre y SDSL solo transporta datos de alta velocidad.", "La “A” de ADSL es de asimétrico."], ["En ADSL con la técnica DMT (multitono discreto), el espectro de 1,1 MHz se divide en:", "256 canales independientes de 4312,5 Hz; el canal 0 es para POTS y los canales 1 a 5 no se usan para que voz y datos no interfieran.", "1,1 millones de canales de 1 Hz, uno por cada usuario conectado a la misma oficina central del ISP.", "256 canales de 4 kHz, todos reservados para los datos de bajada, mientras la voz usa un canal aparte; los canales de subida se toman de ese mismo conjunto por turnos.", "32 canales de subida y 32 de bajada, sin canal de voz, de modo que el teléfono necesita otra línea.", "De los 250 canales restantes, uno controla el flujo ascendente y otro el descendente; el resto, datos."], ["Según el ejemplo de la unidad, 224 canales descendentes × 15 bits/baudio × 4000 baudios dan una capacidad teórica de:", "13,44 Mbps, que en la práctica no se logra por la relación señal a ruido.", "8 Mbps, el máximo real que se logra en la práctica con ADSL en cualquier circuito local.", "1 Mbps, el máximo de subida que admite el estándar para las instalaciones residenciales.", "56 kbps, el límite que impone el filtro de la oficina central a los módems de banda vocal.", "224 × 15 × 4000 = 13.440.000 bps. El estándar ADSL (G.992.1) permite hasta 8 Mbps de bajada y 1 Mbps de subida."], ["En una instalación ADSL, el DSLAM es:", "El multiplexor de acceso ubicado en la oficina central, con procesadores digitales de señal similares a los del módem.", "El dispositivo de interfaz de red instalado en el domicilio del cliente, que conecta la PC con la línea.", "El divisor que separa la voz de los datos en la casa y permite usar el teléfono mientras se navega.", "El nodo de fibra que alimenta los cables coaxiales de un barrio completo en los sistemas de TV por cable; se instala en la cabecera (head end) del operador.", "En la casa están el NID, un divisor y el módem ADSL."], ["ADSL es, estrictamente, un estándar de:", "Capa física; sobre él suele correr ATM por su capacidad de manejar calidad de servicio.", "Capa de red; reemplaza a IP en la última milla y se encarga de enrutar los paquetes entre ciudades.", "Capa de enlace; define el direccionamiento de los hosts y el acceso al medio compartido entre usuarios.", "Capa de transporte; garantiza la entrega confiable y ordenada de los datos entre los extremos.", "ADSL define la modulación y el espectro; las capas superiores son otras."], ["¿Qué es un circuito local inalámbrico (WLL) y qué lo distingue de un teléfono móvil?", "Es una alternativa de bajo costo al par trenzado; el cliente es fijo, tolera una antena direccional grande en el techo y busca Internet de alta velocidad, sin problemas de movilidad ni traspaso de celdas.", "Es un sistema celular con traspaso entre celdas, con celdas pequeñas y reutilización de frecuencias, pensado para usuarios en movimiento con teléfono de mano Su antena es pequeña y omnidireccional, y el costo por usuario es muy superior al del par trenzado.", "Es una red de satélites LEO para teléfonos de mano, con antena direccional grande en el techo del cliente fijo.", "Es una red de fibra óptica hasta el hogar, con antenas en cada casa para distribuir la señal por el interior.", "Las dos tecnologías fijas son MMDS y LMDS."], ["¿Cuál es la diferencia correcta entre MMDS y LMDS?", "MMDS usa microondas con alcance de hasta ~50 km (el ancho de banda se reduce con la distancia); LMDS usa ondas milimétricas (28 y 36 GHz), muy direccionales, con alcance de 2 a 5 km.", "MMDS usa ondas milimétricas de 28 GHz, muy direccionales, con alcance de 2 a 5 km; LMDS usa microondas con alcance de hasta 50 km; ambos se estandarizaron en la década de 1990 como alternativa al coaxial de TV por cable.", "Ambos tienen igual alcance, de unos 50 km; MMDS es simétrico y apunta a empresas, y LMDS es asimétrico y apunta al hogar.", "MMDS es una tecnología de fibra hasta el edificio y LMDS es una de coaxial compartido, ambas para el cliente hogareño.", "Ambos se relacionan con IEEE 802.16. A LMDS lo afectan las hojas y la humedad; MMDS sufre atenuación por edificios."], ["Se multiplexan varias conversaciones en una misma troncal física principalmente porque:", "Instalar y mantener una troncal de ancho de banda alto cuesta casi lo mismo que una de ancho bajo, ya que el gasto principal es abrir zanjas.", "La fibra óptica solo admite una conversación por vez en cada longitud de onda, y por eso hay que multiplexarla en tiempo Por eso las empresas deben contratar una fibra por cada llamada.", "La ley prohíbe tender más de un cable por zanja en las vías públicas, por lo que se comparte el existente.", "Las troncales analógicas no pueden transportar voz sin multiplexar porque la señal se atenúa con la distancia.", "Por eso se desarrollaron FDM, WDM/DWDM y TDM."], ["¿Cuál es la asociación correcta entre técnica de multiplexión y descripción?", "WDM/DWDM: variante de FDM en fibra, cada canal con su propia longitud de onda; TDM: cada canal usa todo el ancho de banda durante una fracción de tiempo.", "FDM: cada canal usa todo el ancho de banda por fracciones de tiempo; TDM: se divide el espectro en canales de frecuencia.", "WDM: se aplica a cobre analógico y reparte el tiempo entre los canales; FDM: se aplica a fibra y asigna una longitud de onda, y ambas requieren sincronizar los relojes de los extremos.", "TDM se usa en circuitos analógicos y asigna una banda de frecuencias a cada canal; FDM se usa en sistemas digitales.", "FDM suele usarse en analógicos; TDM en digitales (con PCM, tramas con control y sincronización)."], ["En la conmutación de paquetes, a diferencia de la conmutación de mensajes:", "Se establece un límite superior al tamaño del bloque, por lo que los paquetes se guardan en la memoria principal del enrutador y ningún usuario monopoliza la línea.", "Cada bloque se almacena en disco en la primera oficina antes de reenviarse, por lo que un mensaje largo puede monopolizar la línea.", "Se establece una trayectoria física dedicada antes de transmitir y se reserva todo el ancho de banda hasta el final.", "Se retransmite el mensaje completo sin revisar y sin límite de tamaño, de modo que cada usuario ocupa la línea el tiempo que necesite, y los mensajes se guardan en disco en cada oficina de conmutación.", "La conmutación de circuitos busca una trayectoria física al hacer la llamada. La de mensajes (store and forward) ya no se usa."], ["¿Cuál es la correspondencia correcta entre generación de telefonía móvil y característica?", "1G voz analógica; 2G voz digital; 3G voz y datos digitales (UMTS); 4G LTE sobre IP.", "1G voz digital; 2G datos de baja velocidad; 3G LTE sobre IP; 4G UMTS con voz y datos.", "1G GSM; 2G AMPS; 3G CDMA; 4G WiMAX, cada una introducida por un estándar distinto de la ITU.", "1G voz y datos; 2G solo datos; 3G voz analógica; 4G satelital con cobertura global.", "La diferencia 3G vs. 4G: 3G usa UMTS y 4G usa el protocolo IP."], ["En AMPS, la clave de su mayor capacidad frente a IMTS es:", "Dividir la región en celdas pequeñas y reutilizar frecuencias en celdas cercanas pero no adyacentes.", "Usar un único transmisor de 200 W en la cima de una colina para cubrir una ciudad entera.", "Usar oprimir-para-hablar con un solo canal que comparten todos los usuarios de la ciudad.", "Transmitir todas las celdas en la misma frecuencia, distinguiendo a los usuarios con códigos distintos.", "IMTS tenía solo 23 canales; AMPS usa celdas de 10 a 20 km conectadas a la MTSO/MSC."], ["Entre los datos de AMPS, ¿cuál es correcto?", "Tiene 832 canales dúplex de 30 kHz, usa FDM y 21 canales son de control.", "Tiene 8 usuarios por canal de 200 kHz, con TDM, y 21 canales de control.", "Tiene canales de 5 MHz, usa chips de código y reutiliza la misma frecuencia en todas las celdas.", "Tiene 25 tramas por segundo, con seis ranuras de 6,67 ms por trama y tres usuarios por canal.", "Los canales de voz de AMPS son analógicos; la información de control va en digital con corrección de errores."], ["Respecto del traspaso de celda (handoff) en AMPS:", "Lo asigna la MTSO; el suave (soft) hace que la nueva estación adquiera el teléfono antes de que la anterior lo deje, pero requiere sintonizar dos frecuencias a la vez; en el duro (hard) la anterior lo deja antes y, si no se logra, la llamada se corta.", "Lo decide cada estación base por sí sola, sin intervención de la MTSO; el duro evita los cortes de la llamada sin necesidad de sintonizar dos frecuencias a la vez. Además, el handoff solo se produce cuando la señal cae por debajo de un umbral fijo, y nunca cuando el usuario cambia de celda en medio de una llamada.", "El soft corta brevemente la llamada mientras la nueva estación toma el teléfono y el hard mantiene la continuidad, porque ambas estaciones lo atienden a la vez.", "Solo existe en GSM y no en los sistemas analógicos como AMPS, porque requiere que el teléfono mida la señal de las estaciones vecinas.", "Las estaciones base son solo retransmisoras de radio; el traspaso tarda cerca de 300 ms."], ["¿Cuál de las siguientes comparaciones entre D-AMPS y GSM es correcta?", "D-AMPS usa canales de 30 kHz con 3 usuarios (TDM); GSM usa canales de 200 kHz con 8 usuarios, y da mayor tasa por usuario.", "D-AMPS usa canales de 200 kHz con 8 usuarios (TDM); GSM usa canales de 30 kHz con 3 usuarios, y da menor tasa por usuario.", "Ambos usan canales de 30 kHz y tres usuarios por canal; GSM solo usa FDM y D-AMPS combina FDM y TDM.", "D-AMPS usa CDMA con secuencias de chips y GSM usa TDM sobre canales de 200 kHz, con 8 usuarios por canal.", "D-AMPS fue diseñado para coexistir con AMPS en la misma celda. GSM es el más difundido a nivel mundial."], ["En CDMA (acceso múltiple por división de código):", "Cada estación transmite todo el tiempo por todo el espectro; a cada una se le asigna una secuencia única de chips: envía su secuencia para un bit 1 y su complemento para un bit 0.", "Cada estación recibe una frecuencia exclusiva y una ranura de tiempo fija, de modo que nunca se superponen en el espectro. Por eso cada estación necesita un transmisor distinto y el sistema no admite más usuarios por celda que canales disponibles.", "Las estaciones se turnan para transmitir en ranuras de 6,67 ms, y cada una usa todo el ancho de banda durante su turno.", "Cada estación usa un canal propio de 30 kHz con modulación FM, y un código de chips distingue las llamadas simultáneas.", "Cada tiempo de bit se subdivide en m chips (normalmente 64 o 128). WCDMA usa un canal único de 5 MHz."], ["En la analogía de la sala de espera del aeropuerto con parejas conversando, CDMA corresponde a:", "Todos hablando a la vez en el medio de la sala, cada pareja en un idioma distinto, rechazando lo demás como ruido.", "Todos esperando su turno para hablar en el medio de la sala, de a una pareja por vez, sin interrumpirse.", "Grupos bien separados en distintos rincones de la sala, con una sola conversación en cada uno de ellos.", "Un único orador que habla por altoparlante a toda la sala mientras los demás permanecen en silencio.", "TDM = turnos; FDM = grupos separados; CDMA = idiomas distintos al mismo tiempo."], ["¿Cuáles son los tres segmentos de una red móvil?", "Acceso, backhaul (agregación, típicamente Metro Ethernet) y core.", "Acceso, enlace y transporte, tal como las tres capas inferiores del modelo OSI.", "Celda, troncal y oficina de conmutación (MTSO), conectadas por microondas y fibra.", "Planta externa, planta interna y última milla, como en la telefonía fija.", "Core incluye SGSN/GGSN y MSC (3G) y MME/sGW (4G), más HLR/HSS, VLR, AuC y EiR para validar y perfilar usuarios."], ["Un sistema HFC (híbrido de fibra y coaxial) de TV por cable se compone de:", "Fibra para largas distancias y coaxial para las casas, unidos por nodos de fibra (convertidores electroópticos).", "Fibra hasta cada casa y coaxial solo para la red troncal, con un amplificador por cada hogar.", "Par trenzado hacia las casas y coaxial para las troncales, unidos por nodos con convertidores en cada manzana.", "Solo coaxial, con amplificadores cada pocos kilómetros y sin ningún tramo de fibra en la red.", "Un nodo de fibra puede alimentar varios cables coaxiales; un cable típico atiende de 500 a 2000 casas."], ["¿Por qué en Internet por cable el ancho de banda real depende de cuántos usuarios estén activos?", "Porque en el vecindario muchas casas comparten un solo cable, y lo que descarga uno se lo resta a los demás.", "Porque cada casa tiene su propio circuito privado, pero el ISP limita la velocidad según la hora del día.", "Porque el coaxial tiene menos ancho de banda que el par trenzado y se satura en las horas pico.", "Porque el módem de cable usa un canal ascendente fijo por cliente y no puede aprovechar canales libres.", "Para difundir TV no importa cuántos espectadores haya, pero para Internet sí. En el sistema telefónico, cada casa tiene su circuito local privado."], ["En la asignación de espectro de la TV por cable (Norteamérica):", "Los canales de TV ocupan de 54 a 550 MHz con 6 MHz por canal; los canales ascendentes se introdujeron en la banda de 5 a 42 MHz y el extremo superior se usa para el flujo descendente.", "Los canales de TV ocupan de 5 a 42 MHz con 6 MHz por canal y el flujo descendente va por debajo de 54 MHz, junto a la radio FM; los canales ascendentes ocupan la banda de 54 a 550 MHz, la misma que los de TV.", "Cada canal ocupa 200 kHz, los canales descendentes están entre 5 y 42 MHz y el flujo ascendente usa la banda de 28 GHz.", "Se reservan 256 canales de 4312,5 Hz para datos, con el canal 0 para la TV analógica y los canales 1 a 5 sin uso.", "En Europa los canales son de 6 a 8 MHz (PAL y SECAM), con el extremo inferior en 65 MHz."], ["Cuando un módem de cable se conecta por primera vez, ¿cuál es la secuencia correcta?", "Explora canales descendentes hasta hallar el paquete de parámetros del head end, anuncia su presencia en un canal ascendente, hace el ranging (mide su distancia al head end), obtiene IP por DHCP y la hora, y el tráfico se cifra.", "Pide IP por DHCP, mide su distancia al head end, explora canales descendentes y recién después anuncia su presencia en un canal ascendente, y todo el intercambio inicial viaja sin cifrar, hasta que el ISP le asigna una clave por cada sesión.", "Hace el ranging con el ISP, descarga la hora desde un satélite y negocia un circuito dedicado con el head end antes de transmitir.", "Marca un número telefónico del ISP, establece una conexión conmutada y negocia una velocidad según la calidad de la línea.", "Al igual que ADSL, está siempre activo porque no se cobra por tiempo de conexión. DOCSIS es el estándar."], ["Al comparar cable y ADSL, ¿cuál enunciado es correcto?", "Ambos usan fibra en la red dorsal; el cable usa coaxial compartido en el último tramo y ADSL par trenzado punto a punto, que es inherentemente más seguro.", "El cable da un ancho de banda fijo para cada usuario y ADSL lo reparte según cuántos usuarios estén conectados en el barrio.", "ADSL comparte el medio con los vecinos de la cuadra y el cable usa un circuito privado entre la casa y el head end.", "El cable es más confiable porque si falla un amplificador solo se ve afectado ese usuario, mientras que en ADSL cae todo el barrio, y por eso suele ofrecer menos velocidad.", "En el cable, si falla la energía de un amplificador, todos los usuarios descendentes quedan sin servicio. ADSL indica un ancho de banda específico (se logra ~80 % de forma consistente)."]]}, "IV": {"title": "Capa de enlace de datos: entramado, errores, ventana corrediza, HDLC y PPP", "qs": [["¿Cuáles son las tres cuestiones de diseño de la capa de enlace de datos presentadas en la unidad?", "Ofrecer una interfaz de servicio bien definida a la capa de red, manejar errores de transmisión y regular el flujo de datos.", "Direccionamiento lógico de los hosts, enrutamiento de los paquetes a través de la red y fragmentación de los datagramas.", "Codificación de los bits en señales eléctricas, sincronización de los relojes y elección del medio de transmisión adecuado.", "Establecimiento de sesiones entre procesos, compresión de los datos y cifrado de la información de usuario.", "Para eso encapsula los paquetes de la capa de red en tramas: encabezado, campo de carga útil y terminador."], ["¿En qué caso es apropiado un servicio sin conexión y sin confirmación de recepción?", "Cuando la tasa de errores es muy baja (por ejemplo, en cobre o fibra).", "Cuando el canal es inalámbrico y la tasa de errores es alta, porque conviene evitar la sobrecarga de las confirmaciones.", "Cuando se necesita un flujo de bits confiable y ordenado entre los dos extremos de la conexión.", "Cuando cada trama debe confirmarse individualmente para garantizar que llegue completa al destino.", "Sin conexión con confirmación: se confirma individualmente cada trama. Orientado a conexión con confirmación: se establece una conexión y el flujo es confiable."], ["El método de entramado por conteo de caracteres tiene el problema de que:", "Si el campo que indica la cantidad de caracteres se daña, el receptor pierde la sincronía y no sabe dónde empieza la trama siguiente.", "El patrón de la bandera puede aparecer accidentalmente dentro de los datos y el receptor confunde el fin de la trama.", "Requiere insertar un bit 0 después de cada secuencia de cinco unos consecutivos, lo que aumenta el tamaño de la trama, y por eso se lo prefiere cuando las tramas son muy cortas.", "Solo funciona con tramas de tamaño fijo, por lo que desperdicia ancho de banda cuando los datos son más cortos.", "El problema de la bandera dentro de los datos se resuelve con relleno de caracteres (ESC) o de bits."], ["En el entramado con banderas y relleno de caracteres, ¿qué hace el emisor cuando el patrón FLAG aparece accidentalmente en los datos?", "Inserta un byte de escape ESC justo antes de esa bandera; si el ESC mismo aparece en los datos, también lo precede con otro ESC.", "Inserta un bit 0 después de cada secuencia de cinco unos consecutivos que aparezca en el campo de datos de la trama, y el receptor lo elimina antes de entregar el paquete.", "Descarta la trama y la retransmite usando otro polinomio generador para que el patrón no vuelva a aparecer.", "Cambia el patrón de la bandera por el de la trama siguiente, y avisa al receptor mediante un campo de control.", "Es una simplificación del esquema que usa PPP."], ["En el relleno de bits, el emisor inserta automáticamente un bit 0 cuando encuentra:", "Cinco unos consecutivos en los datos.", "Seis unos consecutivos en los datos.", "Cinco ceros consecutivos en los datos.", "El patrón 01111110 en los datos.", "Así la secuencia de bandera 01111110 nunca aparece dentro de los datos; el receptor elimina el 0 que sigue a cinco unos."], ["Los datos 0111110111111011 se transmiten con relleno de bits (bandera 01111110). ¿Qué secuencia se envía en el campo de datos?", "011111001111101011", "0111110111111011", "01111100111111011", "011111001111110101", "Tras cada grupo de cinco unos se inserta un 0: …11111 0 [0] 11111 0 1 011. Se agregaron 2 bits."], ["Un campo de datos contiene diez unos seguidos (1111111111). ¿Cuántos bits tiene tras el relleno de bits?", "12", "10", "11", "13", "Se inserta un 0 después de los primeros cinco unos y otro después de los siguientes cinco: 111110111110 (12 bits)."], ["El control de errores de la capa de enlace se apoya en:", "Tramas de control con confirmaciones positivas o negativas, más temporizadores y números de secuencia para que cada trama llegue una sola vez.", "Un campo de dirección IP en cada trama, que identifica al emisor y al receptor a lo largo de toda la red, que además se verifica con el CRC en cada nodo por el que pasa la trama.", "Una sesión de tres fases entre el emisor y el receptor, similar al saludo de tres vías que usa TCP.", "El enrutamiento por el camino de menor costo entre los nodos, y tablas que se actualizan con cada trama.", "Con temporizadores y números de secuencia, cada trama llega a la capa de red exactamente una vez."], ["Un control de flujo “basado en tasa”:", "Usa un mecanismo integrado que limita la tasa de transmisión sin retroalimentación del receptor.", "El receptor autoriza explícitamente al emisor a enviar más datos, mediante tramas de retroalimentación periódicas.", "Calcula la tasa permitida de acuerdo con el resultado del CRC de cada trama que llega al receptor.", "Se basa en el tamaño de la ventana receptora, que el receptor anuncia al emisor en cada confirmación.", "El basado en retroalimentación es el que usa información devuelta por el receptor."], ["Para un enlace inalámbrico que comete muchos errores, ¿qué estrategia conviene según la unidad?", "Un código de corrección de errores, con redundancia suficiente para deducir el carácter transmitido.", "Un código de detección de errores y retransmisión del bloque defectuoso cada vez que la verificación falla.", "Prescindir de todo control de errores en la capa de enlace y dejarlo solo para las capas superiores.", "Aumentar el tamaño de las tramas para reducir la proporción de bits de control frente a los de datos.", "La detección con retransmisión es más económica en canales muy confiables (cobre, fibra). Ejemplos de corrección: Hamming, Reed-Solomon, Golay, FEC."], ["¿Cuál de los siguientes NO es un código de corrección de errores citado en la clase?", "CRC (código polinomial)", "Hamming", "Reed-Solomon", "Código binario de Golay", "El CRC es el método de detección que se ve en la clase."], ["En el código polinomial (CRC), emisor y receptor deben acordar por adelantado:", "El polinomio generador.", "El número de secuencia inicial.", "El tamaño de la ventana.", "La velocidad de transmisión.", "Las cadenas de bits se tratan como polinomios con coeficientes 0 y 1."], ["Siguiendo el ejemplo del libro: trama 1101011011 y generador 10011 (grado 4). ¿Cuál es la trama que se transmite?", "11010110111110", "11010110110000", "11010110111011", "1101011011", "Se agregan cuatro ceros, la división módulo 2 da resto 1110, y ese resto reemplaza a los ceros: 11010110111110."], ["Al recibir una trama con CRC, el receptor la divide por el generador. Si el resto es cero:", "No se detecta error.", "Hay un error de un solo bit.", "Hay que retransmitir la trama.", "La trama es un duplicado.", "Si el resto no es 0, se detectó un error. El mensaje transmitido queda divisible exactamente por G(x)."], ["¿Por qué la capa de enlace nunca debe pasarle a la capa de red ninguna parte del encabezado de la trama?", "Para mantener separados el protocolo de red y el de enlace; hay que distinguir bien paquete de trama.", "Porque el encabezado de la trama viaja siempre cifrado y la capa de red no tiene las claves para leerlo.", "Porque la capa de red solo sabe procesar tramas completas, con sus delimitadores y su secuencia de verificación.", "Porque el encabezado contiene la dirección IP de destino, que solo debe ser usada por la capa de enlace.", "El paquete es la PDU de red y la trama es la PDU de enlace."], ["¿Qué caracteriza al protocolo 1 (símplex sin restricciones, “utopía”)?", "Datos en una sola dirección, capas de red siempre listas, búfer infinito y canal que nunca pierde tramas: completamente irreal.", "El emisor espera la confirmación del receptor antes de enviar cada trama, para evitar que lo sature.", "Maneja las tramas dañadas o perdidas con temporizadores y números de secuencia en cada trama de datos.", "Usa una ventana corrediza con retroceso n, lo que permite tener varias tramas pendientes de confirmación, y exige que el receptor tenga un búfer para cada trama pendiente.", "El protocolo 2 agrega parada y espera; el 3 maneja canal con ruido."], ["En el protocolo 2 (símplex de parada y espera), ¿qué problema evita?", "Que el emisor sature al receptor: envía una trama y espera la confirmación antes de seguir.", "Que se dupliquen tramas en el receptor cuando se pierden las confirmaciones y el emisor retransmite.", "Que el canal cometa errores de bits al transmitir, mediante un código que detecta tramas dañadas.", "Que dos emisores transmitan a la vez por un mismo canal compartido y se produzcan colisiones.", "Basta un canal físico semidúplex, porque los datos van en una dirección y las confirmaciones en la otra, no a la vez."], ["¿Por qué el protocolo 3 (canal con ruido) necesita números de secuencia?", "Porque si se pierde la confirmación, el emisor reenvía por timeout y el receptor podría pasar dos veces la misma trama a la capa de red; el número de secuencia permite descartar duplicados.", "Porque las tramas pueden llegar con el encabezado dañado y el receptor necesita reordenarlas antes de entregarlas a la capa de red; el número de secuencia permite además ubicar cada trama dentro de la ventana del emisor y controlar el flujo.", "Porque el receptor necesita saber cuántos bits tiene cada trama para poder delimitarla sin usar banderas.", "Porque, sin ellos, el temporizador del emisor nunca expira y la trama perdida no se retransmite jamás.", "Si A enviaba un archivo, parte quedaría duplicada sin que nadie lo notara."], ["¿En qué consiste la superposición (piggybacking)?", "El receptor espera el siguiente paquete de su capa de red y anexa la confirmación a la trama de datos de salida (campo ack), en lugar de mandar una trama de control aparte.", "El emisor envía varias tramas juntas dentro de un solo paquete, para aprovechar mejor el canal.", "Se transmiten los datos y las confirmaciones por canales físicos distintos, para que no comp
