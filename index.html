itan por el medio, y cada canal usa una frecuencia distinta que se asigna al iniciar la comunicación entre las estaciones.", "El receptor confirma cada bit recibido con un pequeño pulso, sin esperar a que termine la trama.", "La pregunta de diseño es cuánto tiempo debe esperar la capa de enlace antes de rendirse y mandar la confirmación sola."], ["En un protocolo de ventana corrediza con ventana máxima n, el emisor necesita:", "n búferes para las tramas sin confirmar; al llenarse la ventana, debe detener a la capa de red hasta que se libere uno.", "Un solo búfer, porque las tramas se envían de a una y la siguiente espera la confirmación de la anterior.", "n+1 canales físicos distintos, uno por cada trama en tránsito, más uno para las confirmaciones del receptor.", "Un búfer por cada bit de la trama, para poder retransmitir cualquier bit que llegue dañado al destino.", "La ventana emisora son los números de secuencia que tiene permitido enviar; la receptora, los que puede aceptar."], ["La ventana corrediza de un bit (ventana máxima = 1) se comporta como:", "Un protocolo de parada y espera.", "Un protocolo de retroceso n con ventana de 8.", "Una repetición selectiva.", "Un protocolo símplex de utopía.", "El emisor envía una trama y espera su confirmación antes de la siguiente; el campo de confirmación lleva el número de la última trama recibida sin error."], ["¿Cuándo se necesita una ventana grande y canalización (pipelining)?", "Cuando el producto ancho de banda × retardo de ida y vuelta es grande.", "Cuando la tasa de errores del canal es nula, porque así no hace falta retransmitir ninguna trama.", "Cuando el canal es semidúplex y emisor y receptor deben turnarse para transmitir sobre el mismo medio.", "Cuando las tramas son muy pequeñas y el tiempo de transmisión es mucho menor que el de propagación.", "Si el tiempo de ida y vuelta no es insignificante, parar y esperar desperdicia ancho de banda; por eso se envían varias tramas sin esperar confirmación."], ["En el protocolo de retroceso n (go-back-n), ¿qué hace el receptor al recibir una trama dañada?", "Descarta todas las tramas subsecuentes sin confirmarlas (ventana receptora de tamaño 1) y el emisor retransmite desde la dañada en adelante tras expirar.", "Almacena en el búfer las tramas buenas que llegan después de la dañada y solo pide que se retransmita esa trama, mientras que el emisor sigue enviando las tramas siguientes sin esperar ninguna confirmación del receptor.", "Reordena las tramas recibidas y las pasa a la capa de red, junto con una solicitud de reenvío de la dañada.", "Envía una confirmación acumulativa de todas las tramas posteriores, para que el emisor no las retransmita.", "Desperdicia ancho de banda si la tasa de errores es alta."], ["¿Qué estrategia usa un NAK y almacena en el búfer las tramas buenas que llegan después de la dañada?", "Repetición selectiva.", "Retroceso n.", "Parada y espera.", "Ventana de un bit.", "Con repetición selectiva solo se retransmite la trama sin confirmar. El NAK se envía ante un error de suma de verificación o una trama fuera de orden."], ["Con una tasa de errores alta y mucha canalización, ¿qué estrategia desperdicia más ancho de banda?", "Retroceso n, porque retransmite también las tramas buenas posteriores a la dañada.", "Repetición selectiva, porque retransmite todas las tramas de la ventana cada vez que se detecta un error.", "Parada y espera, porque no usa ventana y desperdicia el canal esperando cada confirmación individual.", "Ninguna de las dos, porque ante un error tanto retroceso n como repetición selectiva retransmiten lo mismo.", "Con repetición selectiva solo se retransmite la trama dañada."], ["Según la unidad, ¿cuál es la correspondencia correcta entre tipo de conexión WAN y encapsulación de capa 2?", "Línea arrendada y conmutado por circuitos: HDLC, PPP, SLIP; conmutado por paquetes: X.25, Frame Relay, ATM.", "Línea arrendada: X.25 y Frame Relay; conmutado por circuitos: ATM; conmutado por paquetes: HDLC y PPP.", "Conmutado por circuitos: ATM y Frame Relay; línea arrendada: X.25; conmutado por paquetes: PPP y SLIP.", "Todas las conexiones WAN usan HDLC como única encapsulación, y varían solo los protocolos de capa 3.", "La elección depende de la tecnología WAN y del equipo de comunicación."], ["En una trama HDLC, el campo señalizador (flag):", "Tiene 8 bits (01111110) y está al comienzo y al final de la trama.", "Tiene 16 bits (0111111001111110) y solo aparece al comienzo de la trama, porque el final se indica con la longitud.", "Contiene la dirección de destino de la trama y permite que cada estación reconozca cuándo debe procesarla.", "Contiene la secuencia de verificación de trama (FCS) calculada sobre los campos de dirección, control y datos.", "HDLC define campos de señalizador, dirección, control, datos y FCS."], ["¿Cuáles son los tres tipos de trama HDLC?", "Información (I), supervisión (S) y sin enumerar (U).", "Datos, control y error.", "Solicitud, respuesta y confirmación.", "Unicast, multicast y broadcast.", "I lleva información de capa superior y control; S solicita/suspende transmisión o envía NAK; U se usa para control y puede llevar datos en servicio no confiable sin conexión."], ["¿Qué diferencia hay entre el HDLC estándar y el HDLC de Cisco?", "El de Cisco agrega un campo de protocolo para admitir entornos multiprotocolo; el estándar solo admite un único protocolo.", "El de Cisco no usa FCS y por eso es más rápido, pero solo puede usarse en enlaces punto a punto.", "El estándar admite multiprotocolo gracias a su campo de tipo, y el de Cisco solo admite un protocolo.", "El de Cisco usa tramas de longitud fija para acelerar el procesamiento en los routers de la misma marca, y por eso no admite multiprotocolo en ninguna de sus versiones.", "Todas las tramas HDLC tienen el mismo formato, sean de datos o de control."], ["Los tres componentes principales de PPP son:", "HDLC para encapsular datagramas, LCP (control de enlace) y una familia de NCP (control de red).", "LCP, IPCP y X.25.", "HDLC, ATM y Frame Relay.", "SLIP, LCP y CRC.", "PPP trabaja en las capas de enlace y de red mediante LCP y NCP."], ["¿Qué hace el LCP en PPP?", "Establece la conexión PPP y sus parámetros, configura las interfaces de cada extremo, detecta errores de configuración y finaliza el enlace.", "Configura los protocolos de capa superior, mediante un NCP distinto para cada protocolo de red que se transporte, y además fija el tamaño máximo de las tramas que se van a intercambiar durante la sesión.", "Encapsula los datagramas IP en tramas HDLC y les agrega el campo de protocolo con la secuencia de verificación.", "Asigna direcciones IP dinámicas a los clientes que se conectan y negocia con ellos las opciones de compresión.", "Los NCP manejan la configuración de los protocolos de capa superior."], ["¿Qué es IPCP en PPP?", "El NCP que corresponde al protocolo IP; PPP usa un NCP distinto para cada protocolo de red (IPXCP para IPX).", "El protocolo de PPP que autentica a los usuarios mediante PAP o CHAP antes de abrir la sesión de red.", "El campo de la trama PPP que indica la longitud de los datos y se ubica justo antes del campo de FCS.", "Un tipo de trama de supervisión de HDLC que sirve para confirmar y para solicitar retransmisiones.", "PPP permite que varios protocolos de capa de red operen en el mismo enlace."], ["En la trama PPP, el campo Protocolo (2 bytes) sirve para:", "Indicar qué protocolo se encapsula (por ejemplo, LCP o un NCP).", "Delimitar el comienzo y el final de la trama PPP, como lo hace el señalizador en el HDLC estándar.", "Detectar errores de transmisión en la trama mediante un código de redundancia cíclica calculado por el emisor.", "Indicar la dirección del destinatario de la trama, ya que PPP funciona sobre medios con varios nodos.", "El señalizador delimita; el FCS (2 o 4 bytes) detecta errores."], ["En el establecimiento de una sesión PPP en tres fases, ¿qué ocurre en cada una?", "Fase 1: establecer el enlace; fase 2: determinar su calidad; fase 3: negociación del protocolo de red por parte de los NCP.", "Fase 1: autenticación de los extremos; fase 2: compresión de los datos; fase 3: cierre ordenado del enlace.", "Fase 1: negociación de la red por los NCP; fase 2: determinar la calidad del enlace; fase 3: establecer el enlace.", "Fase 1: negociación de los NCP; fase 2: más negociación de los NCP; fase 3: establecimiento del enlace por LCP.", "El LCP realiza toda la conversación de las dos primeras fases."], ["En el paquete LCP, ¿cuál es la función del campo Identificador (1 byte)?", "Hacer coincidir las solicitudes con sus respuestas.", "Identificar el tipo de paquete LCP.", "Indicar la longitud total del paquete.", "Contener los datos cuyo formato determina el código.", "Código (1 byte) = tipo de paquete; Longitud (2 bytes) = longitud total; Datos (0 o más bytes)."], ["En el diagrama de fases de una línea PPP, ¿cuál es el recorrido normal?", "Muerta → Establecer → Autenticar → Red → Abrir → Terminar → Muerta.", "Muerta → Red → Establecer → Autenticar → Abrir → Terminar.", "Establecer → Muerta → Autenticar → Abrir → Red → Terminar.", "Muerta → Autenticar → Establecer → Red → Terminar → Abrir.", "Si falla el establecimiento, se vuelve a Muerta; si falla la autenticación, se pasa a Terminar."], ["En PPP, si falla la autenticación, la línea pasa al estado:", "Terminar", "Muerta, directamente", "Red", "Abrir", "Terminar → (portadora liberada) → Muerta. Si falla el establecimiento de opciones, en cambio, vuelve a Muerta."]]}, "V": {"title": "Subcapa MAC, Ethernet, LAN inalámbricas y conmutación", "qs": [["¿Por qué la asignación estática de canal con FDM es ineficiente cuando el tráfico es en ráfagas y el número de emisores es grande y variable?", "Si hay menos de N usuarios interesados se desperdicia espectro, y si hay más de N a algunos se les niega el canal aunque los que tienen banda casi no transmitan.", "Porque FDM genera colisiones entre usuarios de bandas vecinas, y el receptor no puede separar las señales aunque haya bandas de guarda.", "Porque el ancho de banda de un canal no se puede dividir en más de dos partes sin que los usuarios interfieran entre sí.", "Porque exige que todos los usuarios usen la misma frecuencia al mismo tiempo, lo que obliga a un árbitro central que reparta los turnos.", "Con FDM cada usuario tiene su banda, sin interferencia, pero la banda queda ociosa cuando su dueño no transmite."], ["En el modelo de asignación dinámica de canal, una “colisión” se produce cuando:", "Dos tramas se transmiten a la vez, se traslapan y la señal se altera; ambas deben retransmitirse.", "Una estación escucha el canal, lo encuentra ocupado y debe esperar a que termine la transmisión actual para intentarlo de nuevo.", "Una estación espera el comienzo de la siguiente ranura de tiempo para transmitir, de modo que dos tramas nunca se superponen.", "El receptor devuelve una confirmación negativa porque detectó un error en la suma de verificación de la trama recibida.", "El modelo supone N estaciones independientes y un canal único; el tiempo puede ser continuo o ranurado, con o sin detección de portadora."], ["En ALOHA puro:", "Cada usuario transmite cuando tiene datos; las colisiones dañan las tramas y el uso máximo del canal es de aproximadamente 18 %.", "Las estaciones esperan el inicio de una ranura de tiempo para transmitir y el uso máximo del canal es de aproximadamente 37 %.", "Las estaciones escuchan el canal antes de transmitir y esperan a que esté libre, con lo que logran un uso cercano al 100 %.", "Una estación central asigna turnos a cada usuario y por eso no hay colisiones, aunque el uso máximo del canal es de apenas 10 %.", "El ALOHA ranurado duplica la eficiencia (~35 %) al obligar a esperar el comienzo de la siguiente ranura."], ["¿Qué relación hay entre ALOHA ranurado y Internet por cable?", "El ALOHA ranurado (diseñado en 1970) casi se olvidó hasta que Internet por cable exigió asignar un canal compartido entre usuarios competidores.", "Internet por cable usa ALOHA puro porque no necesita ranuras de tiempo y las estaciones pueden transmitir sin sincronizarse entre sí.", "El ALOHA ranurado se creó en 1970 específicamente para el cable coaxial de TV, y se usó desde el principio en esas redes.", "No tienen relación alguna: el cable usa únicamente protocolos libres de colisiones, como el de mapa de bits, desde su origen.", "Los sistemas donde varios usuarios comparten un canal con posibles conflictos se llaman sistemas de contención."], ["¿Cuál es la diferencia entre CSMA persistente y no persistente?", "El persistente escucha el canal continuamente y transmite apenas lo detecta libre; el no persistente no escucha de manera continua para tomar el canal apenas termina la transmisión previa.", "El persistente no escucha el canal antes de transmitir y lo hace de inmediato; el no persistente sí lo escucha y espera si lo encuentra ocupado.", "El persistente puede detectar colisiones mientras transmite y aborta la trama; el no persistente no puede y la envía hasta el final.", "El persistente divide el tiempo en ranuras y transmite al comienzo de cada una; el no persistente transmite en tiempo continuo.", "CSMA/CD agrega detección de colisiones y es la base de Ethernet."], ["¿Cómo detecta una colisión una estación en CSMA/CD?", "Comparando la potencia o el ancho de pulso de la señal recibida con el de la señal que transmite.", "Esperando una trama de confirmación del receptor; si no llega dentro de un tiempo límite, asume que hubo una colisión.", "Recibiendo un NAK de la estación base, que escucha el canal y avisa a los transmisores cuando detecta tramas superpuestas.", "Contando los bits de relleno de la trama recibida y comparándolos con los que transmitió, para ver si coinciden.", "CSMA/CD alterna períodos de transmisión, contención e inactividad."], ["En el protocolo de mapa de bits:", "Cada período de contención tiene N ranuras; la estación i que quiere transmitir pone un 1 en su ranura, y por eso se llama protocolo de reservación.", "Las estaciones difunden su dirección en binario, bit a bit, y gana en la competencia la estación cuya dirección es más baja.", "Cada estación transmite en cuanto tiene datos y, si hay una colisión, reintenta tras esperar un intervalo de tiempo aleatorio.", "Una estación central sondea a las demás una por una y cada estación responde si tiene tramas por enviar, sin ninguna reservación.", "Es un protocolo libre de colisiones: como el deseo de transmitir se difunde antes de la transmisión, no hay conflictos."], ["En el conteo descendente binario, ¿qué estación gana el canal?", "La de dirección más alta: si una estación ve un 1 donde ella puso un 0 (por el OR booleano), queda vencida y deja de competir.", "La de dirección más baja: si una estación ve un 0 donde ella puso un 1, queda vencida y deja de competir.", "La primera que difundió su dirección completa en el canal, sin importar el valor que ésta tenga frente a las demás estaciones.", "La que tiene más tramas pendientes en su cola, porque así se aprovecha mejor el ancho de banda disponible del canal.", "Las direcciones se difunden como cadena binaria de igual longitud, empezando por el bit de mayor orden."], ["¿Qué combinan los protocolos de contención limitada?", "Contención con carga baja (bajo retardo) y técnicas libres de colisiones con carga alta (menos sobrecarga de arbitraje).", "Retroceso exponencial con ventanas deslizantes, para ajustar el tamaño de la ventana al número de estaciones que compiten.", "ALOHA con detección de colisiones en el mismo canal, de modo que las estaciones transmiten y abortan si hay superposición.", "Mapa de bits cuando la carga es baja y ALOHA cuando la carga es alta, para repartir el ancho de banda de manera equitativa.", "Con carga alta la contención deja de ser atractiva, porque aumenta la sobrecarga del arbitraje del canal."], ["En un protocolo de acceso múltiple por división de longitud de onda (WDMA):", "Cada estación tiene un canal de datos y uno de control; se reconocen tres clases de tráfico: conexión con tasa constante, conexión con tasa variable y datagramas.", "Cada estación recibe una secuencia de chips única, que le permite transmitir al mismo tiempo que las demás usando todo el espectro disponible.", "Todas las estaciones comparten un único canal de fibra y lo arbitran con CSMA/CD, igual que en las redes Ethernet de coaxial.", "La estación base sondea a cada estación en cada ranura de tiempo y le asigna una longitud de onda según el tráfico declarado.", "El canal de datos termina con un campo Status que indica qué ranuras están ocupadas."], ["¿Por qué usar CSMA tal cual en una LAN inalámbrica no es adecuado?", "Porque lo que importa es la interferencia en el receptor, no en el emisor.", "Porque las LAN inalámbricas usan tramas de longitud fija, que no permiten ningún tipo de detección de portadora.", "Porque la radio no permite escuchar el canal, ya que el emisor y el receptor usan frecuencias distintas.", "Porque la subcapa MAC no existe en las redes inalámbricas y el acceso se resuelve directamente en la capa física.", "De ahí los problemas de la estación oculta y la expuesta."], ["A transmite hacia B. C está fuera del alcance de A, no la oye, cree que el canal está libre y también transmite hacia B. Este problema se llama:", "Estación oculta.", "Estación expuesta.", "Colisión retardada.", "Desvanecimiento por multitrayecto.", "En la estación expuesta, C oye a B y se abstiene de transmitir a D aunque no molestaría a A, desperdiciando capacidad."], ["Un emisor A quiere enviar una trama grande a B. Según MACA, ¿qué ocurre antes?", "A envía un RTS a B y B responde con un CTS, de modo que las estaciones cercanas detectan la transmisión y evitan transmitir durante la trama de datos.", "B envía un CTS a A y luego A responde con un RTS, tras lo cual las estaciones vecinas esperan antes de transmitir sus propias tramas.", "A envía la trama directamente a B, que responde con un ACK; las estaciones vecinas detectan la colisión y retroceden en forma exponencial.", "La estación base sondea a A y le asigna un turno, durante el cual ninguna otra estación puede usar el canal.", "MACAW agrega un ACK tras cada trama exitosa, detección de portadora e intercambio de información sobre congestionamiento."], ["En la notación 10Base5, ¿qué significa cada parte?", "10 Mbps, señalización de banda base y segmentos de hasta 500 metros (el 5 son centenas de metros).", "10 estaciones por segmento, señalización de banda base y 5 segmentos como máximo, conectados mediante repetidores.", "10 metros de cable entre estaciones, señalización de banda base y una velocidad de 5 Mbps por cada segmento.", "10 Mbps, señalización de banda ancha y segmentos de hasta 5 kilómetros de longitud sin necesidad de repetidores.", "10Base2 usa coaxial delgado (185 m); 10Base-T, par trenzado Cat 3 (100 m); 10Base-F, fibra (2000 m)."], ["¿Cuál de las siguientes asociaciones entre Ethernet y cable es correcta?", "10Base-T – par trenzado Cat. 3 con hub, 100 m por segmento.", "10Base2 – par trenzado sin blindaje, hasta 100 m por segmento.", "10Base5 – fibra óptica multimodo, hasta 2000 m por segmento.", "10Base-F – coaxial delgado con conectores BNC, 185 m por segmento.", "10Base5 usa coaxial grueso con derivaciones “vampiro”; 10Base2, coaxial delgado con conectores BNC en T (si se rompe el bus, falla todo)."], ["¿Por qué Ethernet no usa codificación binaria directa (0 V para 0 y 5 V para 1) sino Manchester?", "Porque la binaria directa genera ambigüedades de sincronización; Manchester tiene una transición en la mitad de cada tiempo de bit.", "Porque Manchester usa menos voltaje que la binaria directa, y eso reduce el consumo y el calor generado en los transceptores.", "Porque la binaria directa no se puede transmitir por cable de cobre, ya que el voltaje continuo se atenúa por completo.", "Porque Manchester comprime los datos antes de transmitirlos, y así se reduce la cantidad de bits que lleva cada trama.", "En Manchester el sentido de la transición indica si el bit es 0 o 1."], ["En la trama Ethernet, ¿para qué sirve el campo de relleno (0 a 46 bytes)?", "Para completar el tamaño mínimo de trama de 64 bytes cuando los datos son menores.", "Para sincronizar el reloj del receptor con el del emisor antes de que comience el campo de datos.", "Para indicar a qué proceso de la capa superior se entrega el contenido de la trama una vez recibida.", "Para detectar errores de transmisión en el campo de datos mediante una suma de verificación adicional.", "El preámbulo (10101010 repetido) sincroniza el reloj del receptor; el Tipo indica a qué proceso entregar la trama."], ["Una estación envía 20 bytes de datos en una trama Ethernet. ¿Cuántos bytes de relleno se agregan (trama mínima de 64 bytes; encabezado de 14 bytes y suma de verificación de 4, sin contar preámbulo)?", "26", "44", "0", "46", "64 − 14 − 4 = 46 bytes mínimos para datos + relleno; con 20 bytes de datos faltan 26."], ["¿Cuál es el tamaño máximo de una trama Ethernet clásica (sin preámbulo)?", "1518 bytes: 6 + 6 + 2 de encabezado, 1500 de datos y 4 de suma de verificación.", "1500 bytes: 14 de encabezado, 1482 de datos y 4 de suma de verificación al final de la trama.", "1522 bytes: los 1518 de la trama estándar más 4 bytes de la etiqueta de VLAN que se agrega al encabezado.", "2312 bytes: 6 + 6 + 2 de encabezado, 2290 de datos y 4 de suma de verificación en la cola.", "1522 bytes es el máximo con la etiqueta de VLAN de 802.1Q; 2312 es la carga útil máxima de 802.11."], ["¿Para qué sirve el retroceso exponencial binario en Ethernet?", "Para adaptar dinámicamente el número de estaciones que intentan transmitir después de una colisión.", "Para aumentar el tamaño de la ventana de transmisión cada vez que la estación detecta que el canal está libre.", "Para dividir la trama en fragmentos más pequeños cuando el canal sufre colisiones frecuentes y mucho ruido.", "Para asignar direcciones MAC a las estaciones nuevas que se conectan al segmento de la red local.", "Además, CSMA/CD no da confirmación de recepción: el destino debe verificar la suma de verificación y devolver una trama de confirmación."], ["En una Ethernet conmutada, cada puerto del switch:", "Forma su propio dominio de colisión, independiente de los demás.", "Pertenece al mismo dominio de colisión que todos los demás puertos del switch.", "Reenvía todas las tramas que recibe por todas las demás líneas, como un hub.", "Opera en la capa 3 y descarta las tramas con direcciones MAC desconocidas.", "El concentrador (hub), en cambio, constituye un solo dominio de colisión."], ["Fast Ethernet (802.3u) se diseñó para:", "Mantener formatos, interfaces y reglas del 802.3 y solo reducir el tiempo de bit de 100 ns a 10 ns.", "Reemplazar a Ethernet por un protocolo nuevo con soporte de voz y de tiempo real, que cambia los formatos de trama.", "Usar derivaciones múltiples sobre cable coaxial a 100 Mbps, con el mismo CSMA/CD y segmentos de 500 metros.", "Aumentar el tamaño mínimo de trama a 512 bytes para detectar colisiones a mayor velocidad en cables largos.", "El IEEE eligió mejorar Ethernet por compatibilidad hacia atrás, miedo a problemas de un protocolo nuevo y rapidez. La alternativa, 802.12, fracasó."], ["Fast Ethernet usa 4B/5B, tomada de FDDI. ¿Qué técnica de codificación usa Gigabit Ethernet?", "8B/10B", "Manchester", "NRZ", "4B/5B", "8B/10B impone: ninguna palabra con más de cuatro bits idénticos seguidos ni más de seis 0 o seis 1."], ["¿Cuál de las siguientes afirmaciones sobre Gigabit Ethernet (802.3z) es correcta?", "Todas las configuraciones son punto a punto y admite dúplex total (con conmutador) y semidúplex (con concentrador).", "Usa derivaciones múltiples sobre cable coaxial, con segmentos compartidos entre varias estaciones por CSMA/CD.", "Solo funciona en dúplex total, con conmutadores en los que cada puerto tiene un enlace punto a punto.", "Cambia el direccionamiento a 64 bits y modifica el formato de trama para admitir velocidades mayores.", "Mantiene compatibilidad hacia atrás: mismo direccionamiento de 48 bits y mismo formato de trama, con los mismos tamaños mínimo y máximo."], ["En Gigabit Ethernet semidúplex, la “extensión de portadora” consiste en:", "Agregar relleno por hardware después de la trama normal para extenderla a 512 bytes.", "Concatenar varias tramas cortas en una sola transmisión para aprovechar mejor el canal, hasta un máximo de 8192 bytes.", "Agregar un preámbulo de 8 bytes más largo, para que el receptor pueda sincronizar su reloj antes de la trama.", "Extender el alcance máximo del cable mediante repetidores que regeneran la trama en cada tramo.", "Las ráfagas de trama permiten enviar varias tramas concatenadas en una sola transmisión."], ["El LLC (IEEE 802.2) proporciona tres opciones de servicio. ¿Cuáles son?", "Datagramas no confiables, datagramas con confirmación de recepción y servicio confiable orientado a la conexión.", "Solo orientado a conexión, con cifrado y sin cifrado de las tramas, según el nivel de seguridad requerido.", "Difusión (broadcast), multidifusión (multicast) y unidifusión (unicast), según el destino de la trama.", "Servicio de bits, de tramas y de paquetes, según la capa de red que utilice el LLC.", "El LLC es la subcapa superior de la capa de enlace."], ["¿Cuál de las siguientes opciones describe las dos configuraciones de 802.11?", "Con estación base (punto de acceso) y sin estación base (ad hoc).", "Con cableado de par trenzado y sin cableado, usando solo transmisión por radio.", "Con infraestructura satelital y con infraestructura terrestre, según el medio que lleve el tráfico.", "Punto a punto entre dos estaciones y multipunto entre varias estaciones, sin estación base.", "En el 802.11 la subcapa MAC es muy distinta de la Ethernet por la complejidad del entorno inalámbrico."], ["La subcapa MAC de 802.11 en modo DCF usa:", "CSMA/CA (evitación de colisiones): escucha el canal un tiempo DIFS y, si está libre, transmite.", "CSMA/CD (detección de colisiones), igual que Ethernet, porque la estación detecta la colisión mientras transmite.", "Un esquema de sondeo por parte de la estación base, que pregunta a cada estación si tiene tramas por enviar.", "ALOHA puro con retroceso exponencial binario, sin escuchar el canal antes de transmitir cada trama.", "PCF es el modo en que la estación base sondea a las demás y no ocurren colisiones."], ["En 802.11, ¿para qué sirve el NAV (detección de canal virtual)?", "Las estaciones que oyen un RTS o CTS saben cuánto tiempo estará ocupado el canal gracias al campo Duración.", "Mide la distancia entre la estación y el punto de acceso, para ajustar la potencia de transmisión en cada trama.", "Numera los fragmentos de una trama para que el receptor los reensamble en el orden correcto.", "Autentica a las estaciones antes de que transmitan, mediante un intercambio de claves con el punto de acceso.", "El campo Secuencia es el que numera los fragmentos."], ["En el modo PCF de 802.11, la estación base:", "Sondea a las demás para preguntarles si tienen tramas por enviar, sin colisiones, y envía una trama de beacon periódicamente (de 10 a 100 veces por segundo).", "Escucha el canal y transmite apenas lo encuentra libre durante un tiempo DIFS, sin sondear a nadie ni enviar beacons.", "Solo retransmite las tramas entre estaciones sin controlar el acceso al medio, y no envía ninguna trama periódica de beacon.", "Asigna una frecuencia exclusiva a cada estación y envía un beacon periódico para que sincronicen sus relojes.", "PCF y DCF pueden coexistir en una celda definiendo con cuidado los intervalos entre tramas."], ["En 802.11, ¿qué intervalo entre tramas permite que las distintas partes de un diálogo transmitan primero (mayor prioridad)?", "SIFS", "DIFS", "EIFS", "PIFS", "SIFS (corto) para diálogos en curso; PIFS para beacon o sondeo de la base; DIFS para que cualquier estación intente adquirir el canal; EIFS para reportar tramas erróneas."], ["¿Cuáles son las tres clases de tramas que define 802.11?", "De datos, de control y de administración.", "De información, de supervisión y sin enumerar.", "De solicitud, de respuesta y de confirmación.", "De beacon, de sondeo y de asociación.", "Información/supervisión/sin enumerar son tramas HDLC. En 802.11 el campo Tipo distingue las tres clases; el Subtipo identifica, por ejemplo, RTS o CTS."], ["En 802.11, el servicio de “reasociación” sirve para:", "Que una estación cambie su estación base preferida, útil para móviles que pasan de una celda a otra.", "Que una estación se conecte por primera vez a una estación base y se identifique ante ella.", "Que una estación abandone la red de manera ordenada, liberando los recursos que tenía asignados.", "Traducir el formato de las tramas 802.11 al de otra red, para poder comunicarse con ella.", "Asociación: conectarse; disociación: romper la relación; integración: traducir formatos; distribución: decidir cómo enrutar las tramas."], ["¿Cuál es una diferencia correcta entre 802.16 y 802.11?", "802.16 opera en 10–66 GHz con antenas direccionales para edificios fijos, es orientado a la conexión y la seguridad es obligatoria; 802.11 es omnidireccional y usa bandas ISM.", "802.16 usa las bandas ISM y es omnidireccional, para usuarios móviles; 802.11 opera de 10 a 66 GHz con antenas direccionales.", "802.16 es semidúplex, no está orientado a la conexión y deja la seguridad como opcional; 802.11 es dúplex y orientado a la conexión.", "Ambos usan el mismo espectro y la misma modulación, y se diferencian solo en el tamaño máximo de trama permitido.", "Las ondas milimétricas se enfocan en rayos direccionales y el agua las absorbe por completo."], ["En la subcapa de seguridad de 802.16, ¿qué se cifra?", "Solo las cargas útiles de las tramas, no los encabezados: un intruso ve quién habla con quién pero no lo que dicen.", "Todo, incluidos los encabezados de las tramas, de modo que un intruso no puede ver quién habla con quién.", "Solo los encabezados, y las cargas útiles viajan en claro porque se supone que las cifra la capa de aplicación.", "Nada, porque la seguridad se delega por completo a las capas superiores, como IPsec o la capa de aplicación.", "El campo EC indica si la carga útil está encriptada."], ["En 802.16, la clase de servicio de “mejor esfuerzo”:", "No tiene sondeo: el suscriptor compite por ancho de banda y usa retroceso exponencial binario para minimizar colisiones.", "Dedica ranuras de tiempo fijas a cada conexión, y está pensada para voz descomprimida con tasa constante de bits.", "Atiende multimedia comprimida en tiempo real con ancho de banda variable, sondeando a los suscriptores en cada trama.", "La estación base sondea al suscriptor con mucha frecuencia, para que no tenga que competir por el ancho de banda.", "Las otras clases: tasa de bits constante, variable en tiempo real y variable en tiempo no real."], ["Los dos esquemas de transmisión de la capa física de 802.16 son:", "FDD (división de frecuencia) y TDD (división de tiempo).", "FHSS (salto de frecuencia) y DSSS (espectro disperso).", "CSMA/CA (evitación) y CSMA/CD (detección de colisiones).", "QPSK (fase) y OFDM (multiplexión ortogonal).", "Se adapta la modulación a la distancia (QAM-64, QAM-16, QPSK) porque la relación señal a ruido cae con la distancia."], ["¿Cuál NO es un motivo para usar puentes según la unidad?", "Convertir direcciones IP en direcciones MAC.", "Interconectar distintas LAN, incluso de distinto estándar.", "Dividir una LAN en LAN individuales para manejar la carga.", "Aislar fallas: una NIC defectuosa que difunde basura echa a perder toda una LAN.", "Resolver direcciones es tarea de ARP (capa de red/enlace), no del puente."], ["Un puente recibe una trama cuyo destino no figura en su tabla. ¿Qué hace?", "Recurre a la inundación: la reenvía por todas las LAN excepto por la de origen.", "La descarta, porque un puente solo reenvía tramas cuyo destino figura en su tabla de direcciones.", "La devuelve a la estación de origen con un mensaje que indica que el destino es desconocido.", "Pide la dirección al enrutador más cercano mediante una consulta ARP antes de reenviar la trama.", "Si destino y origen están en la misma LAN, descarta; si son diferentes, reenvía. Con el aprendizaje hacia atrás llena su tabla, que guarda el tiempo de cada entrada para olvidar las que envejecen."], ["¿Por qué es difícil mover una trama entre LAN 802.x y 802.y a través de un puente?", "Cada LAN usa un formato de trama distinto, pueden operar a distinta tasa y tener distinta longitud máxima de trama; también se pierden seguridad y calidad de servicio.", "Porque los puentes solo entienden direcciones IP, y las LAN 802.x y 802.y usan esquemas de direccionamiento lógico incompatibles.", "Porque todas las LAN 802 usan el mismo formato de trama y el puente debe reescribir completamente el encabezado, lo que consume mucho tiempo.", "Porque los puentes no pueden reenviar tramas de una LAN a otra, y solo sirven para regenerar la señal.", "Las tramas demasiado grandes para reenviarse se descartan."], ["En el algoritmo del árbol de expansión de los puentes:", "Se elige como raíz el puente con el menor número de serie (único en el mundo) y se desactivan las líneas que no forman parte del árbol, evitando ciclos.", "Se elige como raíz el puente con el mayor número de serie, y se desactivan las líneas que formarían ciclos en el árbol.", "Se activan todas las líneas para tener redundancia, y los ciclos se evitan mediante un contador de saltos en cada trama.", "El administrador de la red designa manualmente el puente raíz, y los demás se conectan en cascada a él.", "Se usan puentes redundantes para aumentar la confiabilidad, pero eso produce ciclos."], ["En un puente remoto que une dos LAN por una línea alquilada:", "Se usa un protocolo de enlace punto a punto estándar, como PPP, y se coloca la trama MAC completa en el campo de carga útil.", "Se descarta el encabezado MAC de la trama y se enruta el paquete por IP, con un nuevo encabezado en el otro extremo.", "Se usa Ethernet conmutada sobre la línea alquilada, y cada puente remoto agrega su dirección MAC a la trama.", "Se usa HDLC con direcciones IP en el encabezado, de modo que la línea solo transporta paquetes de red.", "Se aplican los algoritmos comunes de enrutamiento de los puentes."], ["¿Cuál es la asociación correcta de dispositivo y capa?", "Repetidor y hub: física; puente y switch: enlace de datos; enrutador: red.", "Repetidor: enlace de datos; hub: red; switch: física; enrutador: transporte.", "Puente: física; switch: red; enrutador: transporte; repetidor y hub: enlace de datos.", "Hub y puente: enlace de datos; switch y enrutador: red; repetidor: física, porque regenera la señal.", "Un enrutador elimina el encabezado y terminador de la trama y procesa el paquete de la carga útil. Un conmutador nunca pierde tramas por colisiones."], ["¿Por qué surgieron las VLAN?", "Por la carga de la LAN, las tormentas de difusión y la necesidad de desacoplar la topología lógica de la física, evitando recablear a mano.", "Porque los switches no podían trabajar con más de una LAN a la vez y había que usar un dispositivo distinto por cada una.", "Para reemplazar el direccionamiento MAC por IP en toda la red local y simplificar la tarea de los puentes.", "Para aumentar la longitud máxima de una trama Ethernet a 9000 bytes y así mejorar el rendimiento de las redes locales.", "Se asigna cada estación a una VLAN por puerto, por dirección MAC o por protocolo de capa 3/dirección IP."], ["En el estándar IEEE 802.1Q, el identificador de VLAN ocupa:", "12 bits de menor orden; el ID de protocolo vale siempre 0x8100 y la prioridad ocupa 3 bits.", "3 bits de menor orden; la prioridad ocupa 12 bits y el ID de protocolo vale siempre 0x8100.", "16 bits, y el ID de protocolo vale 0x0800 porque la trama ya no transporta paquetes IP.", "8 bits, y no hay campo de prioridad, porque el estándar se limita a identificar la VLAN.", "Los campos VLAN solo los usan puentes y switches; el tamaño máximo de trama sube de 1518 a 1522 bytes."]]}, "VI": {"title": "Ethernet, switches, ARP y cableado estructurado", "qs": [["¿Cuál es el orden histórico correcto del origen de Ethernet?", "AlohaNet (1970, Hawai) → LAN de Xerox (1976, Metcalfe y Boggs) → DIX (1978, DEC, Intel y Xerox, 10 Mbps) → IEEE 802.3 (1983).", "DIX (1970, DEC, Intel y Xerox) → AlohaNet (1976, Hawai) → LAN de Xerox (1978, Metcalfe y Boggs) → IEEE 802.3 (1983).", "LAN de Xerox (1970, Metcalfe y Boggs) → AlohaNet (1976, Hawai) → IEEE 802.3 (1978) → DIX (1983, DEC, Intel y Xerox, 10 Mbps).", "AlohaNet (1976, Hawai) → IEEE 802.3 (1978) → DIX (1983, 10 Mbps) → LAN de Xerox (1990, Metcalfe y Boggs).", "AlohaNet fue una red de radio digital en estrella centrada en Honolulu: el protocolo pionero, padre de Ethernet. La LAN de Xerox tenía 2,94 Mbps."], ["La primera LAN de Xerox (1976), basada en AlohaNet, tenía:", "2,94 Mbps, 500 m (2,5 km con repetidores) y 256 estaciones.", "10 Mbps, 2,5 km con repetidores y 1024 estaciones en total.", "100 Mbps, 100 m de alcance máximo y 30 estaciones conectadas.", "1 Mbps, segmentos de 185 m y 100 estaciones por segmento.", "El primer estándar a 10 Mbps fue DIX; de él, con cambios menores, nace IEEE 802.3 en 1983."], ["Ethernet opera en las capas:", "Física y de enlace de datos (esta última con dos subcapas: MAC y LLC).", "De enlace de datos y de red (con las subcapas MAC y LLC, respectivamente).", "Física, de enlace de datos y de red, según el tipo de trama que se envíe.", "Solo en la capa física, ya que el direccionamiento MAC lo resuelve el medio.", "Las diferencias entre Ethernet estándar, Fast, Gigabit y 10 Gigabit están en la capa física (PHY)."], ["¿Cuál es la diferencia correcta entre las subcapas MAC y LLC?", "MAC forma parte de la especificación 802.3 y se implementa en la NIC (hardware); LLC se implementa en software y conecta con las capas superiores.", "MAC se implementa en software dentro del sistema operativo y LLC en la NIC, y ambas pertenecen a la especificación 802.3.", "LLC controla el acceso al medio y detecta las colisiones, y MAC prepara los paquetes de red para entregarlos a la capa superior, y ambos se implementan siempre en la NIC del equipo.", "Ambas se implementan solo en hardware, dentro del switch, y son independientes del tipo de adaptador de red que tenga el host.", "La MAC se ocupa de encapsulación, delimitación de tramas, direccionamiento, detección de errores y control de acceso al medio."], ["¿Cuál de las siguientes es una limitación de la capa 1 que resuelve la capa 2 en Ethernet?", "La capa física no puede identificar dispositivos ni determinar cuál transmite cuando hay varios: solo reconoce streams de bits.", "La capa física no puede controlar la velocidad de transmisión, por lo que el enlace de datos fija cuántos bits por segundo viajan.", "La capa física no puede utilizar fibra óptica ni medios inalámbricos, y la capa de enlace adapta la trama a cada medio disponible.", "La capa física no admite topologías de bus, y la capa de enlace permite emular una topología de bus sobre estrellas.", "Tampoco puede comunicarse con las capas superiores."], ["El tamaño de una trama Ethernet 802.3 original, desde la MAC de destino hasta la FCS inclusive, es:", "Mínimo 64 bytes y máximo 1518 bytes.", "Mínimo 46 bytes y máximo 1500 bytes.", "Mínimo 64 bytes y máximo 1522 bytes.", "Mínimo 512 bytes y máximo 1518 bytes.", "46–1500 es el rango del campo de datos. Una trama menor de 64 bytes es un fragmento de colisión (runt) y se descarta."], ["¿Cómo funciona la FCS (4 bytes) de la trama Ethernet?", "El emisor incluye el resultado de una CRC; el receptor calcula la suya y, si no coincide, descarta la trama.", "El receptor corrige automáticamente los bits erróneos de la trama usando el valor de la FCS que envió el emisor.", "La FCS contiene la dirección MAC de origen de la trama, y el receptor la usa para verificar quién transmitió.", "La FCS indica si la trama debe retransmitirse por colisión, y el emisor la lee al terminar de transmitir.", "Ethernet detecta errores pero no los corrige: la trama dañada simplemente se descarta."], ["Una dirección MAC es:", "Un valor binario de 48 bits expresado como 12 dígitos hexadecimales, cuyos primeros 3 bytes identifican al fabricante (OUI).", "Un valor de 32 bits expresado en notación decimal con puntos, cuyos primeros 3 bytes identifican a la red del dispositivo.", "Un valor de 64 bits asignado por el administrador de la red, que se puede cambiar según la ubicación del dispositivo.", "Un valor jerárquico de 48 bits que depende de la ubicación del dispositivo y cambia al mover el equipo a otra red.", "Los 3 últimos bytes son un valor exclusivo asignado por el fabricante."], ["De la MAC 000c.296a.a13c, ¿qué parte identifica al fabricante (OUI)?", "000c.29", "6aa1.3c", "296a.a13c", "000c.296a", "El OUI son los 3 primeros bytes (6 dígitos hexadecimales)."], ["¿Cuál de las siguientes afirmaciones sobre la dirección MAC y la dirección IP es correcta?", "La MAC (capa 2) transporta la trama por los medios locales, no es jerárquica y vale solo en ese tramo; la IP (capa 3) lleva el paquete hasta su destino final.", "La MAC lleva el paquete hasta su destino final y se conserva en toda la ruta; la IP cambia en cada salto y solo vale en el tramo local, y por eso un paquete conserva sus direcciones MAC de origen a destino a través de todos los routers.", "La IP no es jerárquica y la MAC sí: la MAC identifica la red del dispositivo y la IP únicamente al fabricante de la placa.", "Ambas se mantienen sin cambios de origen a destino a través de los routers, y por eso un paquete llega con las mismas direcciones.", "La trama se rearma en cada salto con tecnologías distintas, por eso la dirección de capa 2 solo vale para ese tramo."], ["¿Cuáles son la MAC de broadcast y la propiedad de la IP de broadcast?", "FF-FF-FF-FF-FF-FF (48 unos) y una IP con todos unos en la porción de host.", "00-00-00-00-00-00 y una IP con todos ceros en la porción de host.", "FF-FF-FF-FF-FF y una IP con todos unos en la porción de red.", "01-00-5E-00-00-01 y la IP 224.0.0.1 de todos los hosts de la red.", "Un broadcast llega a todos los hosts de la red local (dominio de broadcast)."], ["Sobre las direcciones IP multicast:", "Van de 224.0.0.0 a 239.255.255.255 y solo pueden usarse como destino; el origen siempre tiene dirección unicast.", "Van de 240.0.0.0 a 255.255.255.255, están reservadas para uso experimental y pueden usarse como origen.", "Van de 127.0.0.0 a 127.255.255.255 y son de loopback; sirven para que un host se envíe tráfico a sí mismo.", "Son direcciones privadas reservadas para redes internas, y no pueden aparecer en paquetes que viajan por Internet.", "Multicast = a un grupo de dispositivos."], ["En CSMA/CD, ¿qué significa la parte “Collision Detection” y cómo se detecta una colisión?", "Se detecta porque la amplitud de la señal aumenta por encima del nivel normal; los transmisores siguen transmitiendo para garantizar que todos detecten la colisión.", "Se detecta porque el receptor deja de enviar confirmaciones y el emisor, al vencer el temporizador, retransmite la trama.", "Se detecta porque la FCS de la trama recibida no coincide con la calculada, y el receptor avisa al emisor con un NAK.", "Se detecta porque el switch envía un mensaje de error al transmisor apenas recibe dos tramas simultáneas por un mismo puerto, y avisa al resto de las estaciones con una trama de difusión especial.", "Al detectarla se envía una señal de congestión (jam) y todos invocan un algoritmo de postergación aleatoria."], ["¿Qué ocurre después de una colisión en CSMA/CD?", "Se envía una señal de congestión (jam) y cada estación espera un período aleatorio antes de volver a escuchar para transmitir; un tercer dispositivo podría transmitir antes que los dos involucrados.", "Las dos estaciones retransmiten inmediatamente, una después de la otra, y la trama que no logre pasar se descarta definitivamente, sin esperar ningún período aleatorio ni escuchar el canal otra vez antes de volver a transmitir.", "La estación con la dirección MAC más alta transmite primero y la otra espera a que termine para volver a intentarlo.", "La red se reinicia y las estaciones piden turno al switch, que les asigna un orden de transmisión para evitar nuevas colisiones.", "La señal de congestión es de 32 bits."], ["El “acceso múltiple” de CSMA/CD puede terminar en colisión porque:", "La latencia de la señal puede impedir que un segundo dispositivo la detecte, y también empieza a transmitir: ambas señales se mezclan.", "Una estación no escucha antes de transmitir porque el protocolo no lo exige, y por eso puede pisar la señal de otra.", "Dos estaciones tienen la misma dirección MAC y ambas aceptan la trama, de modo que las respuestas se superponen en el cable.", "El medio es de fibra óptica y refleja la señal en los extremos, lo que genera ecos que se interpretan como una segunda trama.", "Detección de portadora: todos escuchan antes de transmitir y siguen escuchando mientras lo hacen."], ["¿Por qué el tamaño mínimo de trama Ethernet es de 64 bytes?", "Porque el emisor debe detectar la colisión antes de terminar de enviar una trama de tamaño mínimo; el slot time es de 512 tiempos de bit (64 octetos) en 10 y 100 Mbps.", "Porque el preámbulo ocupa 64 bytes y el receptor necesita ese tiempo para sincronizar su reloj antes de leer los datos.", "Porque el switch necesita al menos 64 bytes para leer la MAC de destino y la de origen y poder armar su tabla de direcciones; con menos de 64 bytes no alcanzaría a leer ninguna de las dos direcciones MAC de la trama.", "Porque la FCS solo puede calcularse sobre un mínimo de 64 bytes de datos, y el CRC de 32 bits perdería eficacia con menos.", "En 1000 Mbps el slot time es de 4096 tiempos de bit (512 octetos)."], ["¿Cuánto dura el slot time de 512 tiempos de bit en una red Ethernet de 10 Mbps?", "51,2 µs", "5,12 µs", "512 µs", "0,512 µs", "A 10 Mbps cada bit dura 0,1 µs: 512 × 0,1 µs = 51,2 µs."], ["El espacio mínimo entre tramas (96 tiempos de bit) equivale, en una red de 100 Mbps, a:", "0,96 µs", "9,6 µs", "96 µs", "0,096 µs", "En 10 Mbps son 9,6 µs; a 100 Mbps un bit dura 10 ns: 96 × 10 ns = 960 ns."], ["Un host recibe una trama de 40 bytes en su NIC por colisión. ¿Cómo la considera Ethernet?", "Como un fragmento de colisión (runt frame) y la descarta.", "Como una trama válida pero demasiado corta, que se entrega a la capa superior.", "Como una trama con error de FCS, que el receptor corrige antes de pasarla.", "Como una trama multicast, y la reenvía a todos los puertos.", "Las colisiones tardías (porque la red creció demasiado) se consideran una falla."], ["¿Cuál es la diferencia entre un hub y un switch en cuanto a dominios de colisión y ancho de banda?", "El hub reenvía todos los bits a todos los puertos y comparte el ancho de banda (un dominio de colisión); en el switch cada puerto es un dominio de colisión distinto con ancho de banda completo.", "El hub aísla cada puerto en un dominio de colisión distinto con ancho de banda completo, y el switch comparte el ancho de banda entre todos los puertos, y ambos dispositivos necesitan que las estaciones usen la misma velocidad para que funcione el reenvío.", "Ambos crean un dominio de colisión por puerto, pero el hub regenera la señal y el switch además la filtra por dirección MAC.", "El switch es half-duplex y comparte el medio entre todos los puertos, mientras que el hub es full-duplex y le da a cada puerto un canal propio.", "Con hubs, entre 40 % y 50 % del ancho de banda se consume en recuperarse de colisiones."], ["¿Cuál es una ventaja del switch frente al hub?", "Entorno libre de colisiones y operación full-duplex con ancho de banda dedicado por puerto.", "Menor costo y mayor cantidad de dominios de colisión compartidos, porque cada puerto reparte su ancho de banda.", "Reenvía todas las tramas por todos los puertos, con lo que simplifica la red y evita mantener una tabla de direcciones.", "Funciona solo con cable coaxial, que le permite operar a mayor distancia y con menor atenuación.", "Antes de los switches, Ethernet era solo half-duplex."], ["El método de reenvío “almacenar y reenviar” de un switch consiste en:", "Recibir la trama completa, verificar la FCS y recién entonces reenviarla.", "Reenviar la trama apenas se lee la MAC de destino, sin esperar a que llegue completa.", "Guardar la trama en disco hasta que el administrador de la red autorice su reenvío.", "Reenviar solo los primeros 64 bytes de la trama, que alcanzan para detectar colisiones.", "El switch almacena la trama en un búfer y la envía cuando el puerto de destino está libre."], ["Un switch recién encendido recibe una trama con MAC de destino desconocida. ¿Qué hace?", "Aprende la MAC de origen y puerto, y por inundación envía la trama por todos los puertos excepto el de entrada.", "La descarta, porque no sabe a quién entregarla, y espera a que el destino envíe una trama para aprender su puerto.", "La envía solo por el puerto del gateway predeterminado, que se encarga de localizar al destino fuera del segmento.", "Responde con un ARP al origen para averiguar la MAC de destino, y recién entonces reenvía la trama por un solo puerto.", "Aprendizaje: registra la MAC de origen y el puerto. Actualización: renueva la hora de las entradas."], ["¿Cuál es la operación del switch que descarta una trama cuando origen y destino están en el mismo puerto?", "Filtrado", "Inundación", "Reenvío selectivo", "Aprendizaje", "Reenvío selectivo: si la MAC de destino está en la tabla, envía solo por ese puerto. Inundación: destino desconocido o broadcast."], ["¿Para qué se usa el protocolo ARP?", "Para resolver direcciones IPv4 a direcciones MAC y mantener una caché de las asignaciones.", "Para resolver nombres de dominio a direcciones IP, mantenidos en una caché local en el host.", "Para asignar direcciones IP dinámicamente a los hosts y mantener una tabla de concesiones.", "Para resolver direcciones MAC a direcciones IP en toda Internet y mantener una caché de ellas.", "La caché ARP (tabla ARP) se guarda en RAM."], ["¿Cómo se envía una solicitud ARP y cómo se responde?", "Es un broadcast de capa 2 con la IP del host de destino; el nodo que reconoce esa IP como suya responde con una respuesta ARP unicast.", "Es un unicast a la MAC del gateway, que reenvía la consulta por la red; la respuesta es un broadcast de capa 2 hacia todos los hosts.", "Es un multicast al grupo 224.0.0.1 de capa 3, y los hosts del grupo responden con otro multicast con su dirección MAC.", "Es un unicast al servidor DNS de la red, y este responde también por unicast con la MAC del host que tiene esa IP.", "Si ningún dispositivo responde, el paquete se descarta. La tabla también se actualiza monitoreando el tráfico local."], ["Un host quiere enviar un paquete a una IP que no está en su red local. ¿Qué MAC de destino usa la trama?", "La MAC del gateway (interfaz del router), con la IP de destino del host remoto.", "La MAC del host remoto, obtenida mediante un ARP directo a través de los routers intermedios.", "La MAC de broadcast FF-FF-FF-FF-FF-FF, para que el router más cercano la reciba y la reenvíe.", "La MAC del switch al que está conectado, que reenvía la trama hasta el host remoto.", "ARP proxy: el router puede responder las solicitudes ARP en nombre del host remoto."], ["¿Qué es un cableado estructurado?", "Un sistema de cableado que integra voz, datos, video y sistemas de control de un edificio bajo una plataforma estandarizada y abierta; asegura interoperabilidad entre fabricantes.", "Un cableado propietario de un solo fabricante, que asegura compatibilidad total entre los equipos de voz, datos y video de un edificio Los fabricantes de ese cableado ofrecen una garantía de varios años sobre todo el sistema.", "Un cableado inalámbrico distribuido por pisos, con puntos de acceso que integran voz y datos bajo una plataforma estandarizada.", "El conjunto de patch cords que conectan los equipos de un rack con el patch panel, organizados por colores según el servicio.", "Es un estándar voluntario; la palabra clave es orden. Lo especifica el comité EIA/TIA TR42."], ["¿Cuál NO es un beneficio de un cableado estructurado?", "Aumentar la tasa de error al usar múltiples fabricantes.", "Consistencia en el diseño y la instalación.", "Escalabilidad para crecimientos, movimientos o adiciones.", "Documentación uniforme y menos errores humanos.", "Otros beneficios: cumplimiento de requisitos físicos y de línea de transmisión, y estética (ahorra tiempo, cable y rastreo de puertos)."], ["¿Cuáles son los cinco componentes de un cableado estructurado?", "Área de trabajo, toma de equipos, cableado horizontal, armario de telecomunicaciones y cableado vertical.", "Switch, router, firewall, servidor y área de trabajo, que se conectan entre sí mediante el cableado.", "Patch cord, patch panel, rack, UPS y toma de usuario, dispuestos en el armario de telecomunicaciones.", "Cableado horizontal, vertical, de planta externa, residencial y de campus, según el edificio.", "El cableado genérico es una estructura jerárquica en forma de estrella; FD = distribuidor de piso, BD = distribuidor de edificio."], ["Respecto del cableado horizontal, ¿cuál es correcto?", "Su longitud máxima es de 100 m = 90 m de cable + 3 m del usuario + 7 m de patch panel, y no se permiten puentes, derivaciones ni empalmes.", "Su longitud máxima es de 90 m en total, incluidos los patch cords del usuario y los del armario de telecomunicaciones.", "Se permiten derivaciones y empalmes cuando el puesto de trabajo está lejos, siempre que no se superen los 100 m totales, y esos puntos de derivación se reconocen mediante conectores especiales en cada toma.", "Su longitud máxima depende del medio: 100 m en UTP y 2000 m en fibra óptica multimodo, con empalmes permitidos.", "Contiene la mayor cantidad de cables individuales de toda la instalación."], ["El cableado vertical (backbone):", "Interconecta cuartos de entrada de servicios, de equipos y de telecomunicaciones, conectando los pisos; puede usar UTP/STP multipar y fibra multimodo o monomodo.", "Distribuye el cable entre el patch panel del armario y la toma del usuario en cada piso, con una longitud máxima de 90 m, y es el tramo que une la toma con el área de trabajo del usuario.", "Solo puede usar UTP de Cat 5e, porque la fibra óptica se reserva para el cableado horizontal dentro de cada piso.", "Mide como máximo 100 m, igual que el horizontal, y conecta el área de trabajo con el armario más cercano.", "Distancias máximas para voz: UTP 800 m; fibra multimodo 62,5/125 µm, 2000 m. Debe haber al menos un armario de telecomunicaciones por piso."], ["¿Cuál es la asociación correcta entre norma y tema?", "ANSI/TIA/EIA-568-B: cableado de telecomunicaciones en edificios comerciales; 569-A: recorridos y espacios; 606-A: administración; 607: puesta a tierra.", "568-B: puesta a tierra y conexión equipotencial; 607: recorridos y espacios; 569-A: administración de la infraestructura.", "569-A: administración de la infraestructura; 606-A: cableado en infraestructura residencial; 568-B: recorridos y espacios; 607: cableado de planta externa de campus.", "570-A: cableado de planta externa; 758: infraestructura residencial; 568-B: cableado de telecomunicaciones en edificios.", "570-A es infraestructura residencial; 758, cableado de planta externa. 568-B1/B2/B3: requerimientos generales, par trenzado balanceado y fibra óptica."], ["Comparando UTP, STP y FTP:", "UTP es el más usado en LAN y de menor costo; STP tiene malla por cada par y lámina en el conjunto, más caro y menos flexible; FTP cubre el conjunto de pares con una lámina de aluminio.", "STP no tiene blindaje y es el más económico; UTP tiene malla metálica por cada par y lámina en el conjunto, y es el más rígido; FTP no tiene ningún blindaje y se instala solo en exteriores.", "FTP usa conectores BNC y cubre cada par con malla metálica; STP cubre solo el conjunto con una lámina de aluminio.", "UTP es el de menor tasa de error y mayor costo, porque tiene malla en cada par; STP es el más usado en las LAN.", "El UTP más usado es el de 100 Ω de impedancia; para FTP conviene conectar la masa a tierra."], ["¿Cuál es la asociación correcta entre categoría de cable y capacidad?", "Cat 5e: hasta 1000 Mbps (100 MHz); Cat 6a: 10 Gbps (500 MHz); Cat 8: 40 Gbps (2000 MHz).", "Cat 5e: 10 Gbps (100 MHz); Cat 6a: 1000 Mbps (500 MHz); Cat 8: 100 Mbps (2000 MHz).", "Cat 6: 10 Gbps (250 MHz); Cat 7: 1000 Mbps (600 MHz); Cat 8: 100 Gbps (2000 MHz).", "Cat 5: 1000 Mbps (250 MHz); Cat 6a: 100 Mbps (500 MHz); Cat 7a: 10 Gbps (1000 MHz).", "Cat 6 llega hasta 1000 Mbps (250 MHz); Cat 7, 10 Gbps (600 MHz); Cat 7a, 10 Gbps (1000 MHz)."], ["El conector RJ-45:", "Tiene ocho pines; en Ethernet se usan los 8 (4 pares) y en teléfonos 4 pines (2 pares); su pinout lo define TIA/EIA-568-B.", "Tiene cuatro pines, y en Ethernet se usan 2 pares; su pinout lo define la norma TIA/EIA-606-A.", "Tiene ocho pines, pero Ethernet solo usa 4 (2 pares) y la telefonía usa los 8; su pinout lo define TIA/EIA-568-B.", "Es el conector de fibra óptica multimodo, que se ajusta a presión y tiene un pinout definido por TIA/EIA-568-B.", "Es la interfaz física más usada en cableado estructurado (categorías 4, 5, 5e, 6 y 6a)."], ["¿Cómo se arma un cable cruzado y cuándo se usa?", "Un extremo con norma 568A y el otro con 568B; sirve para conectar dispositivos del mismo tipo (PC con PC, switch con switch).", "Ambos extremos con 568B; sirve para conectar una PC con un switch, que es el caso más común en las LAN, y los dos extremos deben llevar el mismo orden de colores en los ocho pines del conector.", "Ambos extremos con 568A; sirve para conectar dos routers por fibra o dos equipos de distinto tipo.", "Un extremo con 568A y el otro con la norma 606-A; sirve para conectar un hub con un router.", "El directo (misma norma en ambos extremos; en la práctica 568B) conecta dispositivos desiguales, como una PC con un hub o switch."], ["En la norma 568B, ¿cuáles son los colores de los pines 1 y 2, respectivamente?", "Blanco naranja y naranja.", "Blanco verde y verde.", "Blanco azul y azul.", "Naranja y blanco naranja.", "En 568A son blanco verde y verde. Los pines 4 y 5 (azules) y 7 y 8 (marrones) son iguales en ambas normas."], ["¿Qué es la atenuación en un cable?", "La pérdida de amplitud de la señal a lo largo del cable, expresada en dB; aumenta con la frecuencia, la longitud, la temperatura y la humedad.", "La interferencia entre pares dentro del mismo cable, que aumenta con la frecuencia y la longitud del enlace, y se mide en decibeles en el extremo lejano del enlace con un certificador de cables.", "El aumento de amplitud de la señal por reflejos en los conectores, que se agrava con la frecuencia.", "La velocidad máxima soportada por el cable según su categoría, expresada en megabits por segundo.", "Otras causas: pérdidas de inserción por terminaciones, reflejos por cambios de impedancia y envejecimiento."], ["El NEXT (diafonía de extremo cercano):", "Es la interferencia no deseada entre pares; el peor caso es que el par de transmisión interfiera el de recepción en el conector; aumenta con la frecuencia y empeora si se desarman demasiado las trenzas.", "Es la pérdida de amplitud de la señal con la distancia; aumenta con la frecuencia y con la temperatura del cable.", "Es la interferencia producida por motores, ascensores y lámparas fluorescentes cercanos al cable, y se reduce con blindaje.", "Es la demora entre la transmisión y la recepción de una trama, que se mide en nanosegundos y depende de la longitud del cable Se corrige agregando blindaje a cada par del cable y reduciendo la longitud total del enlace.", "Se expresa en dB y la dificultad es determinar el punto exacto donde ocurre."], ["¿Cuál es la segunda regla del cableado estructurado de LAN?", "Planificar el crecimiento futuro (considerar Cat 5e, Cat 6 y fibra); la capa física instalada debe funcionar diez años o más.", "Investigar una solución completa que abarque todos los sistemas del edificio, no solo el cableado de datos, y conviene siempre priorizar un solo fabricante para toda la instalación.", "Conservar la libertad de elección de proveedores, con una plataforma abierta y estandarizada de equipos.", "Instalar siempre el cable de menor costo disponible, para ahorrar y reemplazarlo a medida que haga falta.", "1.ª: solución completa; 3.ª: evitar un sistema cerrado y propietario, que es más barato al principio pero puede salir más caro después."], ["Ethernet 10Base2 se caracteriza por:", "Coaxial delgado, segmentos de 185 m y 30 nodos por segmento; no necesita concentrador.", "Par trenzado, segmentos de 100 m y 1024 nodos por segmento; necesita un hub o concentrador.", "Fibra óptica, segmentos de 2000 m y 1024 nodos; necesita transceptores en cada estación.", "Coaxial grueso, segmentos de 500 m y 100 nodos por segmento; no necesita concentrador.", "Todos implementan un bus lógico y un medio común; banda base = señales sin modulación."]]}, "VII": {"title": "Capa de red: enrutamiento, congestión, IPv4, rutas estáticas y RIP", "qs": [["¿Por qué se dice que la capa de red es la más baja que maneja la transmisión extremo a extremo?", "Porque la de enlace solo mueve tramas de un extremo del cable al otro, mientras que la de red lleva los paquetes del origen al destino a través de muchos saltos.", "Porque la de transporte solo maneja tramas completas, mientras que la de red se encarga de los segmentos de cada aplicación y de entregarlos al proceso correcto en el host de destino, usando los números de puerto.", "Porque la de red es la única que usa direcciones físicas, y por eso identifica el origen y el destino en cada tramo.", "Porque la de enlace se ocupa de la conexión fiable entre aplicaciones, y la de red solo la recibe y la envía por el medio.", "La conexión fiable la da la capa de transporte. Además, la capa de red debe conocer la topología, elegir rutas adecuadas y no sobrecargar unas líneas mientras otras quedan inactivas."], ["En la conmutación de paquetes de almacenamiento y reenvío, un router:", "Almacena el paquete hasta que llega completo (para verificar la suma de verificación) y recién entonces lo reenvía al siguiente router; cada conexión entre routers es un salto.", "Reenvía cada bit apenas lo recibe, sin almacenarlo, para reducir el retardo; solo verifica la suma de verificación en el destino final. Por eso el retardo de extremo a extremo no depende del tamaño de cada paquete.", "Reserva un circuito físico entre origen y destino antes de enviar el primer paquete, y lo mantiene hasta que termina la comunicación.", "Reenvía el paquete por todas las líneas simultáneamente, salvo por la que llegó, para asegurarse de que alcance al destino.", "El host envía el paquete al router más cercano y de ahí en adelante se repite el proceso hasta el destino."], ["¿Cuál NO es uno de los objetivos de diseño de los servicios que la capa de red ofrece a la capa de transporte?", "Que los servicios dependan del tipo y la tecnología de cada router.", "Que los servicios sean independientes de la tecnología del router.", "Que la capa de transporte quede aislada de la cantidad, tipo y topología de los routers.", "Que las direcciones de red sigan un plan de numeración uniforme, incluso entre varias LAN y WAN.", "Los tres objetivos son independencia de la tecnología, aislamiento de la topología y numeración uniforme."], ["En el debate sobre qué servicio debe ofrecer la capa de red, ¿cuál es la correspondencia correcta?", "La comunidad Internet defiende un servicio sin conexión (subred de datagramas); las compañías telefónicas, uno orientado a la conexión (subred de circuitos virtuales, como ATM).", "La comunidad Internet defiende circuitos virtuales con calidad de servicio y las compañías telefónicas, una subred de datagramas sin conexión, porque creen que la red debe ser simple y dejar todo el control en los hosts.", "Ambas defienden el servicio sin conexión, porque los datagramas son más simples de operar y no requieren señalización previa.", "Ambas defienden el servicio orientado a la conexión basado en ATM, porque asegura calidad de servicio de extremo a extremo.", "El servicio sin conexión usa SEND PACKET y RECEIVE PACKET, sin ordenamiento ni control de flujo: se pasa el problema a las capas superiores."], ["En una subred de datagramas, los paquetes de un mismo mensaje largo:", "Se enrutan de forma independiente y pueden seguir rutas distintas, sin configuración previa.", "Siguen siempre la misma ruta, definida al establecer la conexión, y llegan en el mismo orden en que se enviaron.", "Llevan un identificador de circuito virtual y se conmutan según una tabla que se armó al establecer la conexión.", "Se envían todos por la ruta más corta sin excepción, por lo que llegan siempre en orden y no se duplican.", "Por eso en el ejemplo de la clase el paquete 4 va por B y no por C como los paquetes 1, 2 y 3."], ["Los dos procesos de un router son:", "Reenvío (busca en la tabla la línea de salida para cada paquete) y enrutamiento (llena y actualiza las tablas; ahí actúa el algoritmo).", "Reenvío (llena y actualiza las tablas) y enrutamiento (busca la línea de salida para cada paquete que llega).", "Fragmentación (divide los paquetes grandes) y reensamblado (los une en el destino), según el MTU de cada enlace.", "Conmutación de circuitos (reserva la ruta) y conmutación de mensajes (almacena el mensaje completo antes de reenviarlo).", "Al llegar un paquete el router lo almacena, comprueba la suma de verificación, elige la interfaz de salida según la tabla y lo reenvía."], ["En una subred de circuitos virtuales, ¿qué lleva cada paquete y qué ocurre si dos hosts eligen el mismo identificador de circuito?", "Lleva un identificador de circuito virtual; el router asigna uno distinto al tráfico saliente para evitar conflictos.", "Lleva la dirección completa de destino en cada paquete; el router descarta uno de los dos paquetes que se confunden.", "Lleva un número de secuencia; el router fusiona los dos circuitos en uno solo para ahorrar entradas en su tabla.", "Lleva una marca de tiempo; el router usa el circuito más reciente y descarta el más antiguo si hay conflicto.", "La ruta se elige al establecer la conexión y se guarda en las tablas de los routers; al liberar la conexión termina el circuito."], ["Se cae un router y pierde su memoria. ¿Qué pasa según se use circuitos virtuales o datagramas?", "Con circuitos virtuales se abortan todos los circuitos que pasan por él; con datagramas solo sufren los usuarios cuyos paquetes estaban en cola en ese momento.", "Con datagramas se abortan todas las conexiones que pasan por él; con circuitos virtuales solo se pierden los paquetes que estaban en cola Los hosts afectados deben reiniciar la comunicación.", "En ambos casos no se pierde nada, porque los paquetes se retransmiten automáticamente por otra ruta sin intervención de los hosts.", "En ambos casos se abortan todas las conexiones que pasaban por él, y los hosts deben restablecerlas desde cero.", "Es una vulnerabilidad de los circuitos virtuales."], ["¿Cuándo se decide la ruta con circuitos virtuales, a veces llamado “enrutamiento de sesión”?", "Solo al establecer el circuito; con datagramas se decide para cada paquete.", "Para cada paquete que llega, porque la mejor ruta puede cambiar mientras dura la sesión.", "Cada vez que cambia la carga de la red, sin excepción, para que todos los paquetes usen el mejor camino.", "Nunca: la ruta la define el administrador de forma estática y no cambia mientras dura la conexión.", "El algoritmo de enrutamiento es la parte del software de la capa de red que decide por qué línea de salida se transmite un paquete."], ["¿Cuál de las siguientes propiedades deseables de un algoritmo de enrutamiento suelen ser contradictorias entre sí?", "Equidad y optimización.", "Corrección y simplicidad.", "Robustez y estabilidad.", "Estabilidad y corrección.", "Como término medio, muchas redes minimizan el número de saltos: reduce el retardo y el consumo de ancho de banda."], ["¿Cuál es la diferencia entre algoritmos adaptativos y no adaptativos?", "Los no adaptativos (estáticos) no se basan en mediciones de tráfico ni topología y calculan la ruta por adelantado; los adaptativos cambian sus decisiones al cambiar la topología y, por lo general, el tráfico.", "Los no adaptativos cambian sus decisiones según el tráfico y la topología de la red; los adaptativos usan rutas fijas calculadas por adelantado; además, ambos tipos de algoritmo necesitan conocer la topología completa antes de empezar a operar.", "Los adaptativos solo se usan con circuitos virtuales, porque necesitan fijar el camino; los no adaptativos se usan con datagramas.", "Los no adaptativos solo funcionan con datagramas, ya que miden el tráfico en cada salto; los adaptativos usan una ruta fija.", "Ejemplos no adaptativos: inundación y ruta más corta; adaptativos: vector de distancia y estado del enlace."], ["El principio de optimización establece que:", "Si el router J está en la ruta óptima de I a K, entonces la ruta óptima de J a K está en la misma ruta.", "La ruta óptima entre dos routers siempre es la de menor cantidad de saltos, sin importar el ancho de banda de las líneas.", "Todos los paquetes con un mismo destino deben seguir la misma ruta óptima, aunque la carga de la red haya cambiado.", "La ruta óptima de I a K es siempre igual, pero en sentido inverso, a la ruta óptima de K a I.", "Consecuencia: el conjunto de rutas óptimas de todos los orígenes a un destino forma un árbol sumidero (con raíz en el destino), sin ciclos."], ["¿Qué garantiza el árbol sumidero?", "Que, al ser un árbol sin ciclos, cada paquete se entrega en un número finito de saltos.", "Que todos los paquetes siguen rutas de igual longitud, lo que hace que lleguen al destino con el mismo retardo.", "Que nunca habrá congestión, porque cada router envía los paquetes solo por una línea y no por varias en paralelo.", "Que los routers conozcan siempre la topología completa de la red de forma consistente, sin intercambiar información.", "En la práctica, los enlaces y routers caen y se reactivan, así que los routers pueden tener ideas distintas de la topología."], ["En el algoritmo de Dijkstra, al inicio:", "Todas las etiquetas de los nodos son infinito y tentativas; el origen se marca como definitivo y se actualizan las etiquetas de sus vecinos.", "Todos los nodos tienen etiqueta 0 y son permanentes, y el algoritmo va aumentando las etiquetas a medida que explora.", "Solo el destino tiene una etiqueta definida, y el algoritmo avanza hacia atrás hasta llegar al origen.", "Se etiquetan los nodos con el número de saltos al destino y se marca como definitivo el más cercano.", "Se elige el nodo tentativo de menor etiqueta, que pasa a permanente, y se repite hasta llegar al destino."], ["La inundación (flooding) tiene como principal problema:", "Genera una gran cantidad de paquetes duplicados (infinitos si no se limita).", "Es muy compleja de implementar, porque requiere que cada router mantenga una tabla con la topología completa.", "No es robusta ante fallas de routers, ya que si uno se cae el paquete no llega por ninguna otra ruta.", "No encuentra nunca la ruta más corta, porque prueba todas las rutas pero elige una al azar.", "Se limita con un contador de saltos que baja en cada router y descarta el paquete al llegar a 0, y con un registro de paquetes ya procesados."], ["¿Cuál es un uso de la inundación y por qué sirve como métrica de comparación?", "Aplicaciones militares y actualización concurrente de bases de datos distribuidas; como prueba todas las rutas en paralelo, siempre elige la más corta y ningún algoritmo logra menos retardo (sin contar la sobrecarga).", "Redes domésticas, porque genera poco tráfico; como solo usa una línea por vez, sirve de referencia para comparar el retardo; en cambio, los algoritmos adaptativos la superan siempre porque evitan por completo los paquetes duplicados en la red.", "Circuitos virtuales, porque fija la ruta; como no genera duplicados, siempre elige la ruta más corta de toda la red.", "Redes con muchos routers, porque no genera duplicados; como prueba una sola ruta, ningún algoritmo logra menos sobrecarga.", "El contador de saltos debería inicializarse con la longitud de la ruta o, si se desconoce, con el diámetro de la subred."], ["En el vector de distancia, cada router:", "Mantiene una tabla con la mejor distancia conocida a cada destino y la línea para llegar, y la actualiza intercambiando información con sus vecinos (Bellman-Ford distribuido).", "Conoce el mapa completo de la red y ejecuta Dijkstra localmente, a partir de la información que recibe de todos los routers y la actualiza cada vez que cambia el costo de alguno de sus enlaces, sin intercambiar nada con los vecinos.", "Envía su tabla a todos los routers de la red mediante inundación, y cada uno la usa para recalcular sus rutas.", "Calcula las rutas por adelantado, fuera de línea, y las carga manualmente en su tabla sin intercambiar información.", "Fue el algoritmo original de ARPANET y en Internet se usó como RIP."], ["El router J tiene retardos a sus vecinos A, B y K de 5, 7 y 4 ms. A, B y K informan que su retardo al destino G es de 20, 9 y 15 ms, respectivamente. ¿Qué ruta elige J para llegar a G y con qué retardo?", "Vía B, con 16 ms.", "Vía K, con 19 ms.", "Vía A, con 25 ms.", "Vía B, con 9 ms.", "Vía A = 5 + 20 = 25; vía B = 7 + 9 = 16; vía K = 4 + 15 = 19. Dx(y) = min sobre vecinos v de [c(x, v) + Dv(y)]."], ["En el vector de distancia, “reacciona rápido a las buenas noticias y lento a las malas”. ¿Qué significa?", "Si un router se activa, la noticia se propaga a 1 salto por intercambio; si se cae, los vecinos se apoyan mutuamente en rutas obsoletas y las distancias suben de a poco hasta infinito.", "Las malas noticias se propagan a 1 salto por intercambio y las buenas hacen que las distancias aumenten de a poco hasta infinito; por eso la convergencia depende de la cantidad de routers y no de la distancia entre ellos.", "Ambas noticias se propagan instantáneamente a toda la red, porque cada router difunde su tabla completa en cuanto cambia.", "Ambas se propagan lentamente, a 1 salto por minuto, porque los routers solo envían su tabla una vez por período.", "La esencia del problema: cuando X le dice a Y que tiene una ruta, Y no puede saber si él mismo está en esa ruta."], ["¿Qué es el horizonte dividido con rutas inalcanzables (poisoned reverse), RFC 1058?", "Un intento de resolver la cuenta hasta infinito, que no funciona bien en general.", "Un protocolo que reemplazó al vector de distancia en ARPANET, porque calculaba rutas con la topología completa.", "Un mecanismo del estado del enlace para evitar que los paquetes de estado se dupliquen durante la inundación.", "Un método para dividir la red en regiones, de modo que cada router solo guarde las rutas de su región.", "En RIP, el horizonte dividido hace que un router no publique por una interfaz las redes aprendidas por esa misma interfaz."], ["¿Por qué se reemplazó el vector de distancia en ARPANET en 1979?", "Porque su métrica era la longitud de la cola y no consideraba el ancho de banda (líneas de 56 kbps a 230 kbps y 1,544 Mbps), y convergía muy lentamente.", "Porque no podía calcular rutas con más de 15 saltos, lo que limitaba el tamaño de la red a unos pocos routers; por eso se lo reemplazó por un algoritmo que calculaba las rutas con el mapa completo de la red.", "Porque no soportaba datagramas y exigía establecer un circuito virtual antes de enviar el primer paquete.", "Porque consumía demasiada memoria en cada router, ya que debía guardar el mapa completo de la topología.", "El reemplazo fue el estado del enlace, del que deriva OSPF."], ["Los cinco pasos del estado del enlace, en orden, son:", "Descubrir vecinos, medir el costo a cada uno, construir el paquete de estado, distribuirlo a todos los routers y calcular las rutas.", "Construir el paquete de estado, descubrir vecinos, calcular rutas, medir costos y distribuir el paquete.", "Medir costos, calcular rutas, descubrir vecinos, distribuir el paquete y construir el paquete de estado.", "Distribuir, construir, calcular, descubrir y medir, repetidos cada vez que cambia la topología.", "Cada router hace los cinco pasos y calcula las rutas localmente con Dijkstra."], ["En el estado del enlace, ¿cómo descubre un router a sus vecinos?", "Envía un paquete HELLO por cada línea punto a punto y el otro extremo responde con su nombre (único globalmente).", "Envía un paquete ECHO por todas las líneas y espera la respuesta de cada vecino con su dirección.", "Pide la tabla de enrutamiento al router raíz, que le informa quiénes son sus vecinos inmediatos.", "Lee el campo de dirección de los paquetes de datos que pasan, y así aprende quiénes están a su alrededor.", "En una LAN, esta se modela como un nodo artificial al que se conectan los routers."], ["El costo hacia un vecino en el estado del enlace se mide con un paquete ECHO. El costo es:", "(tiempo de ida + tiempo de vuelta) / 2.", "Tiempo de ida y vuelta completo.", "Solo el tiempo de ida, sin la vuelta.", "El número de saltos hasta el vecino.", "Incluir la carga en la medición (el temporizador arranca al poner el ECHO en la cola) puede causar oscilaciones y ruteo errático."], ["¿Qué contiene el paquete de estado del enlace?", "La identidad del emisor, un número de secuencia, la edad y la lista de vecinos con su retardo.", "La tabla de enrutamiento completa del router, con el costo de cada destino conocido hasta el momento.", "Solo la dirección IP del router, su máscara y el número de interfaces que tiene activas.", "La lista de todos los hosts de la red, junto con el estado de cada una de las interfaces del emisor.", "Se construye periódicamente o ante un evento significativo (caída o reactivación de un vecino)."], ["En la distribución de paquetes de estado del enlace, ¿para qué sirven el número de secuencia y la edad (TTL)?", "Para resolver versiones distintas de la misma información y descartarla al llegar la edad a 0 (baja una vez por segundo).", "Para ordenar los routers según su prioridad y elegir cuál de ellos distribuye los paquetes de estado primero.", "Para calcular el costo del enlace con cada vecino, midiendo el tiempo que tarda un paquete en ir y volver.", "Para elegir al router raíz del árbol de expansión, que es el que tiene el menor número de secuencia.", "Se usa inundación selectiva; cada router guarda los paquetes con banderas de envío y de ACK."], ["¿Cuál es la comparación correcta entre vector de distancia y estado del enlace?", "VD comparte su tabla completa solo con vecinos y calcula con Bellman-Ford distribuido (RIP); EE comparte sus enlaces directos con todos los routers por inundación y calcula con Dijkstra local (OSPF).", "VD comparte solo sus enlaces directos con todos los routers por inundación; EE comparte su tabla completa con los vecinos; además, VD solo se usa en redes pequeñas y EE solo en redes con más de 15 saltos entre routers.", "VD usa Dijkstra con inundación y EE usa Bellman-Ford distribuido, y las dos usan la misma métrica de costo.", "VD tiene mejor convergencia que EE, y por eso RIP deriva del estado del enlace, igual que OSPF.", "El estado del enlace tiene una visión de mapa completo (grafo) de la red y converge más rápido."], ["Una red de 720 routers se divide en 24 regiones de 30 routers cada una. ¿Cuántas entradas necesita la tabla de cada router con enrutamiento jerárquico de dos niveles?", "53 entradas (30 de su región + 23 de las otras regiones).", "720 entradas, una por cada router de la red.", "24 entradas, una por cada región de la red.", "30 entradas, una por cada router de su propia región.", "Con tres niveles (8 zonas × 9 regiones × 10 routers) bastan 10 + 8 + 7 = 25. Sin jerarquía, 720."], ["Según Kamoun y Kleinrock, el número óptimo de niveles de una jerar
